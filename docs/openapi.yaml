  /scep/challenges:
    post:
      operationId: createSCEPChallenge
      summary: Mint a one-time SCEP enrollment challenge bound to a device's names (pki-admin or pki-operator; W20-16)
      description: >-
        The response is the only place the challenge secret ever appears.
        A device puts it in its CSR's challengePassword; the hub consumes it
        once and issues exactly common_name and dns_names, never the CSR's
        own names. Served only when SCEP is enabled (KRYPTKEEPER_SCEP_ENABLED).
      tags: [SCEP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [common_name]
              properties:
                common_name: { type: string, description: "Host name; no wildcards" }
                dns_names: { type: array, items: { type: string }, maxItems: 20 }
                ttl: { type: string, description: "Go duration, default 1h, at most 24h" }
      responses:
        "201":
          description: Challenge minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/SCEPChallenge"
                      - type: object
                        properties:
                          challenge: { type: string, description: "The one-time secret (64 hex characters)" }
        "400":
          description: Invalid names or TTL
        "403":
          description: Caller lacks pki-admin or pki-operator
    get:
      operationId: listSCEPChallenges
      summary: List SCEP challenges, newest first, without their secrets
      tags: [SCEP]
      responses:
        "200":
          description: Challenges
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SCEPChallenge" }

