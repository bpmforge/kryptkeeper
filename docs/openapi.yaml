  # ── Outbound credentials ──────────────────────────────────────

  /credentials:
    get:
      operationId: listCredentials
      summary: List outbound credentials (metadata only, admin role required)
      description: >-
        Responses never carry secret material - only id, name, type and
        timestamps. The plaintext is resolvable exclusively by internal
        consumers (push installers, inventory sources, AD sync).
      tags: [Credentials]
      responses:
        "200":
          description: Credential metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            credential_type:
                              type: string
                              enum: [ssh_key, api_token, cloud_iam, windows_password]
                            tenant: { type: string }
                            created_at: { type: string }
                            updated_at: { type: string }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "503": { description: Credential store not configured }
    post:
      operationId: createCredential
      summary: Store an outbound credential, encrypted at rest (admin role required)
      description: >-
        The payload is the secret material, shaped by its consumer (an SSH
        key + user, a WinRM URL + password, a device API login). It goes IN
        and never comes back out - the response is metadata only, and there
        is deliberately no update or read-back route.
      tags: [Credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, credential_type, payload]
              properties:
                name: { type: string }
                credential_type:
                  type: string
                  enum: [ssh_key, api_token, cloud_iam, windows_password]
                payload:
                  type: object
                  description: Consumer-shaped secret material. Never echoed back.
      responses:
        "201":
          description: Created - metadata only
        "400": { description: Missing fields or unknown credential type }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "503": { description: Credential store not configured }

  /credentials/{id}:
    delete:
      operationId: deleteCredential
      summary: Delete an outbound credential (admin role required)
      tags: [Credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "404": { description: Credential not found }

  /credentials/{id}/preflight:
    post:
      operationId: preflightCredential
      summary: Report what a windows_password credential can do on its host (admin role required)
      description: >-
        Opens one WinRM session with the stored credential and runs only
        `whoami /groups` - nothing on the host is changed. The verdict says
        whether the account can discover only, or also install, so the
        operator learns it when the credential is entered rather than at
        install time after a renewal has been issued. A bare 401 from the
        listener is reported as "wrong password OR account not permitted to
        use WinRM": the wire cannot tell those apart. The secret is resolved
        only inside the hub and never appears in the response.
      tags: [Credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preflight verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [credential_id, level, can_discover, can_install, detail]
                    properties:
                      credential_id: { type: string }
                      level:
                        type: string
                        enum: [unreachable, unauthenticated, no_shell, discover, install]
                      can_discover: { type: boolean }
                      can_install: { type: boolean }
                      detail:
                        type: string
                        description: Operator-facing explanation. May quote the host's fault text, never the credential.
        "400": { description: Not a windows_password credential, or its payload lacks base_url/username }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "404": { description: Credential not found }
        "503": { description: Credential store not configured or preflight unavailable }

  # ── Admin: whole-keystore backup / restore ────────────────────

  /admin/backup:
    post:
      operationId: createKeystoreBackup
      summary: Export every key in the store as one encrypted bundle (admin role required)
      description: >-
        Operates on every key at once - a materially larger blast radius than
        the single-key export endpoints. Each key is encrypted under the
        caller-supplied backup passphrase; no plaintext key material is ever
        returned. Non-extractable keys (HSM/cloud-KMS backed) are skipped and
        counted, not failed.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                backup_passphrase:
                  type: string
                  description: Wraps every exported key. Never stored server-side.
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Encrypted bundle returned as a file attachment
          content:
            application/json:
              schema:
                type: object
                description: Opaque encrypted bundle; re-submit verbatim to /admin/restore.
        "400":
          description: backup_passphrase missing or body invalid
        "401":
          description: Unauthenticated
        "403":
          description: Admin role required
        "503":
          description: Backup failed

  /admin/restore:
    post:
      operationId: restoreKeystoreBackup
      summary: Re-import every key from a backup bundle (admin role required)
      description: >-
        Best-effort by design: some keys may import while others fail (for
        example a duplicate ID already present), so a partial restore returns
        207 with both the imported count and the failure detail rather than a
        generic error.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_passphrase, bundle]
              properties:
                backup_passphrase: { type: string }
                bundle:
                  type: object
                  description: A bundle previously produced by /admin/backup.
      responses:
        "200":
          description: Every key restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported: { type: integer }
        "207":
          description: Partial restore - some keys imported, some failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported: { type: integer }
                      error: { type: string }
        "400":
          description: backup_passphrase or bundle missing
        "401":
          description: Unauthenticated
        "403":
          description: Admin role required

  # ── Keys ─────────────────────────────────────────────────────────────────

  /keys:
    get:
      operationId: listKeys
      summary: List key metadata (admin role required)
      tags: [Keys]
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeyMetadata"
    post:
      operationId: generateKey
      summary: Generate a new key (admin role required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                algorithm: { type: string }
      responses:
        "201":
          description: Key generated
        "422":
          description: >
            ML-DSA/hybrid algorithm requested against a hardware/remote key
            backend (pkcs11, vault, cloudkms) — PQC keys are
            software-keystore-only per docs/ADR_PQC_KEYS_SOFTWARE_ONLY.md.
            No token object is created.

  /cbom:
    get:
      operationId: exportCBOM
      summary: Export the cryptographic bill of materials (CycloneDX 1.6 CBOM)
      description: >-
        Always-current CycloneDX 1.6 JSON built from the live inventory on
        every call: certificates, private-key metadata (never material),
        observed algorithms (ML-DSA parameter sets carry NIST quantum
        security levels), and discovered protocol endpoints (W6-05).
      tags: [Discovery]
      responses:
        "200":
          description: CycloneDX CBOM (application/vnd.cyclonedx+json)
        "503":
          description: An inventory provider errored (partial BOMs are never served)

  /ceremonies:
    post:
      operationId: startCeremony
      summary: Start an M-of-N root-CA key ceremony (admin role required)
      tags: [Ceremonies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, common_name, algorithm, validity_days, approvers, quorum]
              properties:
                name: { type: string }
                common_name: { type: string }
                algorithm: { type: string }
                validity_days: { type: integer }
                approvers: { type: array, items: { type: string }, description: "Eligible approver principals (N)" }
                quorum: { type: integer, minimum: 2, description: "Approvals required (M); must be >= 2 and <= len(approvers)" }
      responses:
        "201":
          description: >
            Ceremony created. The root CA exists but is parked
            pending_ceremony — every issuance path refuses it until the
            quorum of distinct approvals flips it active.
        "400":
          description: Invalid quorum/approvers or CA creation failed
    get:
      operationId: listCeremonies
      summary: List key ceremonies (admin role required)
      tags: [Ceremonies]
      responses:
        "200":
          description: Ceremonies, newest first

  /ceremonies/{id}:
    get:
      operationId: getCeremony
      summary: Get one ceremony (admin role required)
      tags: [Ceremonies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The ceremony
        "404":
          description: Not found

  /ceremonies/{id}/approve:
    post:
      operationId: approveCeremony
      summary: Record one approval (admin role required)
      description: >
        The approver is the AUTHENTICATED principal — a body-supplied name
        is ignored, so one identity cannot replay N approvals. On the Mth
        distinct approval the CA transitions pending_ceremony → active.
      tags: [Ceremonies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approval recorded (ceremony completed on quorum)
        "400":
          description: Not eligible, already approved, or ceremony not pending

  /ceremonies/{id}/abort:
    post:
      operationId: abortCeremony
      summary: Abort a pending ceremony (admin role required)
      description: The CA stays pending_ceremony — permanently unusable.
      tags: [Ceremonies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Aborted
        "400":
          description: Ceremony is not pending

  /adsync/templates:
    post:
      operationId: syncADCertificateTemplates
      summary: Publish certificate templates into Active Directory
      description: >-
        WRITES into AD's Configuration naming context, which every domain
        member reads - a genuinely high blast radius, so this requires the
        approver capability rather than plain admin and every run is
        audited with its counts. Per-template failures are reported in
        `errors` rather than swallowed: a sync that half-applied must not
        read as a clean success.
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ldap_url, config_dn, credential_ref, templates]
              properties:
                ldap_url: { type: string, description: "ldaps:// unless allow_cleartext is set." }
                bind_dn: { type: string }
                credential_ref: { type: string, description: Bind password from the credential store. }
                config_dn: { type: string }
                service_name: { type: string }
                allow_cleartext:
                  type: boolean
                  description: >-
                    A simple bind sends the password, so cleartext ldap:// is
                    refused unless this is explicitly set.
                templates:
                  type: array
                  items: { type: object }
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      Created: { type: integer }
                      Updated: { type: integer }
                      Deleted: { type: integer }
                      Errors:
                        type: array
                        items: { type: string }
        "400": { description: Missing required fields or unresolvable credential }
        "401": { description: Unauthenticated }
        "403": { description: Approver role required }
        "503": { description: Directory unreachable or credential store unconfigured }

  /adsync/gpo-check:
    post:
      operationId: checkADGPOConfig
      summary: Validate an autoenrollment GPO configuration (advisory, writes nothing)
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checks:
                        type: array
                        items: { type: object }
                      all_passing: { type: boolean }
        "400": { description: Invalid request body }
        "401": { description: Unauthenticated }

  /spiffe/workload-selectors:
    get:
      operationId: listWorkloadSelectors
      summary: List UID-to-SPIFFE-ID bindings the gRPC attestor consults
      description: >-
        A binding carries no secret material - a UID and an identity name,
        both non-sensitive by design.
      tags: [SPIFFE]
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      selectors:
                        type: array
                        items:
                          type: object
                          properties:
                            uid: { type: integer }
                            spiffe_id: { type: string }
        "401": { description: Unauthenticated }
        "403": { description: Approver role required }
    post:
      operationId: bindWorkloadSelector
      summary: Bind a kernel-attested UID to a SPIFFE ID (the human approval)
      description: >-
        Registering a binding IS the approval step that keeps
        proposer != approver structural: a workload can never name its own
        identity, because the SPIFFE Workload API request carries no
        identity field at all. The SPIFFE ID must sit inside this
        deployment's trust domain - binding a UID to a foreign domain's
        identity would mint an SVID this CA has no authority to assert.
      tags: [SPIFFE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid, spiffe_id]
              properties:
                uid: { type: integer, minimum: 0 }
                spiffe_id: { type: string }
      responses:
        "201": { description: Binding registered }
        "400": { description: Malformed SPIFFE ID or foreign trust domain }
        "401": { description: Unauthenticated }
        "403": { description: Approver role required }

  /keys/byok/export:
    post:
      operationId: exportKeyToCloudKMS
      summary: Wrap an escrow-recovered root and import it into a customer-controlled KMS
      description: >-
        Moves OUR OWN escrowed root across a custody boundary into the
        customer's HSM - no new custody is taken on, but the plaintext root
        exists transiently in memory to be wrapped, so the ceremony is
        dual-control gated, every step is audited, and the material is
        zeroized on every exit path including error paths. The destination
        is resolved BEFORE the key is recovered, so an unusable provider
        fails while the key is still sealed. Only AWS is implemented:
        Azure and GCP use different BYOK envelopes and refuse explicitly
        rather than sending material they would reject.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, key_id, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                bundle:
                  type: object
                  description: A dual-custody escrow bundle from /keys/escrow.
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
                provider: { type: string, enum: [aws] }
                region: { type: string }
                key_id: { type: string, description: The destination KMS key to import into. }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Key material imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      provider: { type: string }
                      key_id: { type: string }
                      imported: { type: boolean }
        "400": { description: Missing fields, or a provider this build cannot wrap for }
        "401": { description: Unauthenticated }
        "403": { description: Approver role required, or dual control not satisfied }
        "503": { description: Wrap or KMS import failed }

  /keys/leaf-escrow:
    post:
      operationId: escrowLeafKey
      summary: Deposit an endpoint (leaf) key under dual control - opt-in only
      description: >-
        Leaf-key custody is OFF by default. Holding endpoint private keys
        conflicts with the key-boundary law unless a tenant explicitly
        adopts it, so a tenant not named in KRYPTKEEPER_LEAF_ESCROW_TENANTS
        is refused with 403 and the refusal is audited. Requires two
        DIFFERENT custodian secrets; the returned bundle is dual-custody
        ciphertext, never plaintext key bytes.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                key_id: { type: string }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Encrypted escrow bundle as a file attachment
        "400": { description: Invalid request body }
        "401": { description: Unauthenticated }
        "403": { description: Tenant has not opted in, or dual control not satisfied }

  /keys/leaf-escrow/recover:
    post:
      operationId: recoverLeafKey
      summary: Recover an escrowed leaf key through the same dual-control ceremony
      description: >-
        Recovery is intentionally NOT gated on the current opt-in state, so
        opting out never strands keys already in escrow. Both custodian
        secrets are required and every touch is audited.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                bundle: { type: object }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Key restored to the store
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      key_id: { type: string }
                      recovered: { type: boolean }
        "400": { description: Bundle missing, malformed, or dual control not satisfied }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }

  /keys/escrow:
    post:
      operationId: escrowKey
      summary: Escrow a key under dual custodian control (admin role required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                key_id: { type: string }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string, description: "Must differ from custodian A's — dual control requires two secrets" }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: >
            Escrow bundle (JSON attachment). Dual-custody ciphertext only:
            the key is wrapped under a random inner secret, XOR-split 2-of-2
            between the custodians. One share alone recovers nothing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: { type: integer }
                  key_id: { type: string }
                  created_at: { type: string }
                  wrapped_key_pem: { type: string }
                  shares:
                    type: array
                    items:
                      type: object
                      properties:
                        slot: { type: string, enum: [A, B] }
                        salt: { type: string }
                        nonce: { type: string }
                        ciphertext: { type: string }
        "400":
          description: Identical/empty custodian passphrases, or escrow failed
        "404":
          description: Key not found

  /keys/escrow/recover:
    post:
      operationId: recoverEscrowedKey
      summary: Recover an escrowed key (both custodian passphrases required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                bundle: { type: object, description: "The escrow bundle exactly as produced by POST /keys/escrow" }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "201":
          description: Recovered under the original key ID
        "400":
          description: >
            Recovery refused — a failing custodian passphrase is named by
            slot (never key material), and the key is not created.
        "409":
          description: Key already exists

  /keys/import:
    post:
      operationId: importKey
      summary: Import an encrypted key backup (admin role required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                backup_pem: { type: string }
                passphrase: { type: string }
      responses:
        "201":
          description: Imported

  /keys/{id}:
    get:
      operationId: getKey
      summary: Get key metadata (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Key metadata
        "404":
          description: Not found
    delete:
      operationId: deleteKey
      summary: Delete a key (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: >
            The key backs an active CA (the same in-use guard /rotate
            applies) — deleting it would orphan the CA.

  /keys/{id}/rotate:
    post:
      operationId: rotateKey
      summary: Rotate a key (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm: { type: string }
      responses:
        "200":
          description: Rotated
        "404":
          description: Not found

  /keys/{id}/export:
    post:
      operationId: exportKey
      summary: Export an encrypted key backup (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Encrypted PEM backup
        "404":
          description: Not found

  # ── Audit ────────────────────────────────────────────────────────────────

  /audit:
    get:
      operationId: listAuditEntries
      summary: Query audit log
      tags: [Audit]
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
      responses:
        "200":
          description: Audit entries
        "403":
          description: The caller's role lacks the audit.read permission (pki-admin, auditor, pki-auditor, or a custom role granted it)

  # ── Users ────────────────────────────────────────────────────────────────

  /users:
    get:
      operationId: listUsers
      summary: List users (requires user.manage)
      tags: [Users]
      responses:
        "403":
          description: Caller's role lacks user.manage
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserRecord"

  /users/invite:
    post:
      operationId: inviteUser
      summary: Invite a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, default: pki-operator }
      responses:
        "201":
          description: Invitation sent
        "400":
          description: Missing email, or unknown role
        "403":
          description: The caller does not hold every permission of the requested role

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateUser
      summary: Update user role or status
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string }
                status: { type: string }
      responses:
        "200":
          description: Updated user
        "400":
          description: Unknown role
        "403":
          description: The caller does not hold every permission of the requested role
        "404":
          description: User not found
    delete:
      operationId: deactivateUser
      summary: Deactivate user
      tags: [Users]
      responses:
        "204":
          description: Deactivated
        "404":
          description: User not found

  # ── Auth / API Keys ──────────────────────────────────────────────────────

  /auth/methods:
    get:
      operationId: authMethods
      summary: Which sign-in methods this deployment offers (unauthenticated)
      description: >-
        Booleans only — reveals nothing an anonymous caller could not learn
        by probing the individual login routes. Lets the login page render
        the right buttons.
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Available sign-in methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      password: { type: boolean }
                      oidc: { type: boolean }
                      saml: { type: boolean }

  /auth/login:
    post:
      operationId: login
      summary: Login with credentials
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Access + refresh tokens and sets kk_token httpOnly cookie
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      summary: End the session (expire cookie, revoke refresh tokens)
      description: >-
        Expires the kk_token cookie and revokes server-side every refresh
        token held by the principal identified by the cookie or bearer token,
        plus the optional body-supplied refresh token (A2A7-003). The access
        JWT already issued stays valid until its own expiry. Always 204.
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204":
          description: Cookie cleared

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh an access token using a body-supplied refresh token
      description: >-
        S-60: the handler reads {"refresh_token"} from the REQUEST BODY —
        there is no refresh cookie, and this endpoint does NOT re-issue
        the kk_token session cookie the way /auth/login does. A browser
        session survives refresh because the client stores the new access
        token and the Authorization header is consulted before the cookie;
        cookie-only clients must re-login rather than refresh.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: >-
            New access token (and rotated refresh token) in the JSON body.
            The kk_token cookie is NOT re-issued.
        "400":
          description: Missing or invalid request body
        "401":
          description: Invalid or expired refresh token
        "429":
          description: Rate limit exceeded (30/minute per client IP)

  /authz-check:
    get:
      operationId: authzCheck
      summary: Report the caller's resolved role/scopes/permissions
      tags: [Auth]
      responses:
        "200":
          description: Resolved authorization context
        "401":
          description: >-
            Unauthenticated, OR a valid session whose UserProvider account
            has since been deprovisioned (W6-02) -- the two are
            indistinguishable in the response, to avoid leaking which case
            applies.

  /auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start OIDC SSO login (authorization-code + PKCE)
      description: >-
        Redirects the browser to the configured IdP's authorization endpoint
        with a server-generated state and PKCE code_challenge (S256). Fails
        closed (503) if OIDC login is not fully configured.
      tags: [Auth]
      security: []
      responses:
        "302":
          description: Redirect to the IdP's authorization endpoint
        "429":
          description: >-
            Per-client-IP rate limit exceeded
            (API_RATE_LIMIT_OIDC_LOGIN_PER_MIN), or the server-side
            pending-login table is at its hard ceiling. No redirect and no
            PKCE state are issued in either case.
        "503":
          description: OIDC login not configured/enabled

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC SSO callback (IdP redirect target)
      description: >-
        Validates state (single-use, expiring) and exchanges the
        authorization code for an ID token at the IdP's token endpoint using
        the matching PKCE code_verifier. The ID token is validated via the
        same issuer/audience/signature path bearer OIDC tokens use
        (auth_jwks.go/auth_oidc.go). On success, resolves the token's email
        claim against an ALREADY-PROVISIONED UserProvider account (no
        just-in-time creation -- see /scim/v2/Users) and establishes the same
        session/cookie POST /auth/login issues. A replayed or expired state,
        a code_verifier the IdP rejects, an invalid ID token, an
        unprovisioned identity, or a deprovisioned account each fail closed
        with no session issued.
      tags: [Auth]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Login succeeded; sets kk_token httpOnly cookie and redirects
        "401":
          description: State/PKCE/ID-token validation failed, or no matching provisioned account
        "429":
          description: >-
            Per-client-IP rate limit exceeded
            (API_RATE_LIMIT_OIDC_CALLBACK_PER_MIN). Checked before the state
            is consumed and before the IdP token-endpoint exchange, so a
            throttled request neither burns a valid state nor causes an
            outbound request to the IdP.

  /auth/saml/login:
    get:
      operationId: samlLogin
      summary: Start SP-initiated SAML SSO login
      description: >-
        Redirects the browser to the configured IdP's SSO URL with a
        SAMLServiceProvider.BuildAuthURL-built AuthnRequest. Fails closed
        (503) if SAML login is not fully configured (IdP SSO URL, IdP
        issuer, SP issuer, ACS URL and at least one IdP certificate all
        required).
      tags: [Auth]
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: >-
            Optional same-origin path to redirect to after login, echoed
            back via RelayState. Anything not starting with a single "/"
            is ignored in favor of the configured default.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the IdP's SSO URL with a SAMLRequest parameter
        "429":
          description: Rate limit exceeded
        "503":
          description: SAML login not configured/enabled

  /auth/saml/acs:
    post:
      operationId: samlAssertionConsumerService
      summary: SAML assertion consumer service (IdP POST target)
      description: >-
        Validates the POSTed SAMLResponse via
        SAMLServiceProvider.RetrieveAssertionInfo. An expired assertion or
        one addressed to a different audience returns no error from that
        call -- both surface only as AssertionInfo.WarningInfo
        (InvalidTime/NotInAudience) -- so this endpoint rejects on those
        fields explicitly, and separately rejects unless
        ResponseSignatureValidated is true (an individually-signed
        assertion inside an otherwise-unsigned response envelope is not
        sufficient). A response carrying a wrapped/second Assertion element
        is rejected by RetrieveAssertionInfo itself. Resolves the
        assertion's identity (an Email/email attribute, else NameID)
        against an ALREADY-PROVISIONED UserProvider account (no
        just-in-time creation -- see /scim/v2/Users) and establishes the
        same session/cookie POST /auth/login and the OIDC callback issue,
        so S-34 role claims, deprovisioning and tenancy apply unchanged.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        "302":
          description: Login succeeded; sets kk_token httpOnly cookie and redirects
        "401":
          description: >-
            Signature/warning/audience/expiry validation failed, a
            wrapped/second Assertion element was present, no matching
            provisioned account was found, or the account is deprovisioned
        "429":
          description: Per-client-IP rate limit exceeded (checked before response parsing)
        "503":
          description: SAML login not configured/enabled

  /api-keys:
    get:
      operationId: listAPIKeys
      summary: List API keys (own keys, or all for admins)
      tags: [Auth]
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKeyRecord"
    post:
      operationId: createAPIKey
      summary: Create an API key (admin role required)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                principal_id: { type: string }
                role: { type: string }
                scopes:
                  type: array
                  items: { type: string }
                expires_at: { type: string, format: date-time }
                tenant: { type: string }
      responses:
        "201":
          description: API key created (secret returned once)
        "400":
          description: Invalid request, or unknown role
        "403":
          description: The caller is not an admin, or does not hold every permission of the key's role
        "503":
          description: The key could not be saved to the database, so none was issued; retry

  /api-keys/{kid}:
    delete:
      operationId: deleteAPIKey
      summary: Revoke an API key (admin role required)
      tags: [Auth]
      parameters:
        - name: kid
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "503":
          description: The key is already rejected by this process but the revocation could not be saved to the database (it would return after a restart); repeat the DELETE until it succeeds

  # ── SCIM 2.0 Provisioning (root-scoped, not /api/v1; W6-02) ─────────────
  # A trust boundary separate from the rest of this API: authenticated via
  # scimBearerAuth only, never bearerAuth. See scimBearerAuth's description.

  /scim/v2/Users:
    servers:
      - url: /
    get:
      operationId: scimListUsers
      summary: List provisioned accounts
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      responses:
        "200":
          description: SCIM ListResponse of Users
        "401":
          description: Missing/invalid SCIM bearer token
    post:
      operationId: scimCreateUser
      summary: Provision an account
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/SCIMUser"
      responses:
        "201":
          description: Account created
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUser"
        "400":
          description: Missing userName/emails
        "401":
