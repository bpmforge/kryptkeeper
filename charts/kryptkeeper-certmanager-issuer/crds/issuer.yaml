# Registers the signer type so cert-manager's admission webhook accepts
# CertificateRequests (and approval/status updates) that reference
# group certmanager.kryptkeeper.io kind Issuer.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: issuers.certmanager.kryptkeeper.io
spec:
  group: certmanager.kryptkeeper.io
  scope: Namespaced
  names:
    kind: Issuer
    listKind: IssuerList
    plural: issuers
    singular: issuer
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
