          description: ITSM integration not available
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }

  /credentials:
    get:
      operationId: listCredentials
      summary: List outbound credentials (metadata only, admin role required)
      description: >-
        Responses never carry secret material - only id, name, type and
        timestamps. The plaintext is resolvable exclusively by internal
        consumers (push installers, inventory sources, AD sync).
      tags: [Credentials]
      responses:
        "200":
          description: Credential metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            credential_type:
                              type: string
                              enum: [ssh_key, api_token, cloud_iam, windows_password]
                            tenant: { type: string }
                            created_at: { type: string }
                            updated_at: { type: string }
                            privileged: { type: boolean, description: "High-impact account on the hosts it reaches (W34-11)." }
                            privileged_reason: { type: string }
                            privileged_set_by: { type: string, description: "auto:<source> or manual:<principal>" }
                            privileged_set_at: { type: string }
                            source:
                              type: string
                              enum: [local, external]
                              description: >-
                                Where the secret lives (W38-07). local is the encrypted row;
                                external is a reference fetched from source_id's secret manager
                                at each use.
                            source_id: { type: string, description: "The credential source an external credential fetches from." }
                            reference:
                              type: object
                              additionalProperties: { type: string }
                              description: "External only: where in the manager the secret is (vault_kv2: path, version)."
                            static:
                              type: object
                              additionalProperties: { type: string }
                              description: "External only: fixed non-secret payload fields (host_public_key, base_url)."
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "503": { description: Credential store not configured }
    post:
      operationId: createCredential
      summary: Store an outbound credential, encrypted at rest (admin role required)
      description: >-
        The payload is the secret material, shaped by its consumer (an SSH
        key + user, a WinRM URL + password, a device API login). It goes IN
        and never comes back out - the response is metadata only, and there
        is deliberately no update or read-back route.


        With `source: external` (W38-07, D-324) the hub stores no secret at
        all: send `source_id` (a credential source of the caller's tenant),
        `reference` and optionally `static`, and no payload. The secret is
        fetched from the manager at each use and validated against the
        credential type's shape then; see docs/ops/CREDENTIAL_SOURCES.md.
      tags: [Credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, credential_type]
              properties:
                name: { type: string }
                credential_type:
                  type: string
                  enum: [ssh_key, api_token, cloud_iam, windows_password]
                source:
                  type: string
                  enum: [local, external]
                  default: local
                source_id:
                  type: string
                  description: "external only: the credential source to fetch from."
                reference:
                  type: object
                  additionalProperties: { type: string }
                  description: >-
                    external only: where the secret is. vault_kv2 sources take `path`
                    (under the source's mount) and optionally `version` (whole number;
                    absent or 0 reads the latest). Plugin sources take the plugin's keys
                    (CyberArk safe/object, Secret Server secret_id) and `map`
                    (SourceField:payload_field pairs).
                static:
                  type: object
                  additionalProperties: { type: string }
                  description: >-
                    external only: fixed payload fields the manager does not hold
                    (host_public_key, base_url). Names that look like secrets are refused.
                payload:
                  type: object
                  description: >-
                    Consumer-shaped secret material. Never echoed back. For
                    ssh_key the privilege fields are validated on create:
                    sudo_password is required for, and only allowed with,
                    sudo_mode password; helper_sha256 is required for, and
                    only allowed with, sudo_mode helper.
                  additionalProperties: true
                  properties:
                    sudo_mode:
                      type: string
                      enum: [none, nopasswd, password, helper]
                      default: none
                      description: >-
                        ssh_key only. How the SSH account is elevated on the
                        target (none = no elevation).
                    sudo_password:
                      type: string
                      writeOnly: true
                      description: ssh_key with sudo_mode password only. Stored encrypted, never returned.
                    helper_sha256:
                      type: string
                      pattern: "^[0-9a-fA-F]{64}$"
                      description: ssh_key with sudo_mode helper only. Pinned sha256 of the installed helper.
      responses:
        "201":
          description: Created - metadata only
        "400": { description: Missing fields, unknown credential type, or an invalid ssh_key sudo_mode combination }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "503": { description: Credential store not configured }

  /credential-sources:
    get:
      operationId: listCredentialSources
      summary: List credential sources of the caller's tenant (admin role required)
      description: >-
        A source says where external credentials fetch their secrets from
        (W38-07, D-324): HashiCorp Vault or OpenBao KV v2, or a `credentials`
        plugin. Nothing in a source is secret; its login is a local api_token
        credential named by credential_ref.
      tags: [Credentials]
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CredentialSource" }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "503": { description: Credential source store not configured }
    post:
      operationId: createCredentialSource
      summary: Create a credential source (admin role required)
      description: >-
        credential_ref must be a local api_token credential of the same tenant
        holding the manager login: {"token"} or {"role_id","secret_id"} for
        Vault and OpenBao, the plugin's credential fields for a plugin source.
        A plugin source needs an enabled `credentials` plugin, which a second
        person approved (provide_credentials is a Critical capability).
      tags: [Credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, credential_ref, config]
              properties:
                name: { type: string }
                kind: { type: string, enum: [vault_kv2, plugin] }
                credential_ref: { type: string }
                config: { $ref: "#/components/schemas/CredentialSourceConfig" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CredentialSource" }
        "400": { description: Invalid source, unknown or non-local login credential, or plugin not enabled }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "503": { description: Credential source store not configured }

  /credential-sources/{id}:
    delete:
      operationId: deleteCredentialSource
      summary: Delete a credential source no credential uses (admin role required)
      tags: [Credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "404": { description: Source not found }
        "409": { description: Credentials still use this source }

  /credential-sources/{id}/test:
    post:
      operationId: testCredentialSource
      summary: Fetch a reference through a source and report the field names (admin role required)
      description: >-
        Runs the real fetch and payload validation for a credential type, so the
        operator sees a bad path, a denied policy or a missing field before
        relying on it. Only field names come back, never values. A failed fetch
        is a 200 with ok=false and the reason. The attempt is audited as
        credential.resolve.
      tags: [Credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_type, reference]
              properties:
                credential_type:
                  type: string
                  enum: [ssh_key, api_token, cloud_iam, windows_password]
                reference:
                  type: object
                  additionalProperties: { type: string }
                static:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: The probe's result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      fields: { type: array, items: { type: string }, description: "Names of the payload fields the manager's secret yielded." }
                      error: { type: string, description: "Why the fetch or the shape check failed; never carries a secret." }
        "400": { description: Missing credential_type or an invalid reference }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "404": { description: Source not found }

  /credentials/{id}:
    delete:
      operationId: deleteCredential
      summary: Delete an outbound credential (admin role required)
      tags: [Credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "404": { description: Credential not found }

  /credentials/{id}/privileged:
    put:
      operationId: setCredentialPrivileged
      summary: Mark or clear the privileged flag on an outbound credential (admin role required)
      description: >-
        Manual half of the W34-11 flag; the sudo preflight sets it automatically
        (sudo ALL, uid 0, broad cat/install globs). The flag gates nothing: it is
        shown on the credential, its targets and the access-review and executive
        reports, and every change is audited `credential.privileged.set` with the
        reason and source (auto|manual).
      tags: [Credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privileged]
              properties:
                privileged: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The updated credential metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      privileged: { type: boolean }
                      privileged_reason: { type: string }
                      privileged_set_by: { type: string }
                      privileged_set_at: { type: string }
        "400": { description: privileged is required }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "404": { description: Credential not found }
        "503": { description: Credential store not configured or cannot carry the flag }

  /credentials/{id}/preflight:
    post:
      operationId: preflightCredential
      summary: Report what a windows_password credential can do on its host (admin role required)
      description: >-
        Opens one WinRM session with the stored credential and runs only
        `whoami /groups` - nothing on the host is changed. The verdict says
        whether the account can discover only, or also install, so the
        operator learns it when the credential is entered rather than at
        install time after a renewal has been issued. A bare 401 from the
        listener is reported as "wrong password OR account not permitted to
        use WinRM": the wire cannot tell those apart. The secret is resolved
        only inside the hub and never appears in the response.
      tags: [Credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preflight verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [credential_id, level, can_discover, can_install, detail]
                    properties:
                      credential_id: { type: string }
                      level:
                        type: string
                        enum: [unreachable, unauthenticated, no_shell, discover, install]
                      can_discover: { type: boolean }
                      can_install: { type: boolean }
                      detail:
                        type: string
                        description: Operator-facing explanation. May quote the host's fault text, never the credential.
        "400": { description: "Not a windows_password credential, or its payload lacks base_url/username" }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }
        "404": { description: Credential not found }
        "503": { description: Credential store not configured or preflight unavailable }

  # ── Admin: whole-keystore backup / restore ────────────────────

  /admin/backup:
    post:
      operationId: createKeystoreBackup
      summary: Export every key in the store as one encrypted bundle (admin role required)
      description: >-
        Operates on every key at once - a materially larger blast radius than
        the single-key export endpoints. Each key is encrypted under the
        caller-supplied backup passphrase; no plaintext key material is ever
        returned. Non-extractable keys (HSM/cloud-KMS backed) are skipped and
        counted, not failed.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                backup_passphrase:
                  type: string
                  description: Wraps every exported key. Never stored server-side.
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Encrypted bundle returned as a file attachment
          content:
            application/json:
              schema:
                type: object
                description: Opaque encrypted bundle; re-submit verbatim to /admin/restore.
        "400":
          description: backup_passphrase missing or body invalid
        "401":
          description: Unauthenticated
        "403":
          description: Admin role required
        "503":
          description: Backup failed

  /admin/restore:
    post:
      operationId: restoreKeystoreBackup
      summary: Re-import every key from a backup bundle (admin role required)
      description: >-
        Best-effort by design: some keys may import while others fail (for
        example a duplicate ID already present), so a partial restore returns
        207 with both the imported count and the failure detail rather than a
        generic error.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_passphrase, bundle]
              properties:
                backup_passphrase: { type: string }
                bundle:
                  type: object
                  description: A bundle previously produced by /admin/backup.
      responses:
        "200":
          description: Every key restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported: { type: integer }
        "207":
          description: Partial restore - some keys imported, some failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported: { type: integer }
                      error: { type: string }
        "400":
          description: backup_passphrase or bundle missing
        "401":
          description: Unauthenticated
        "403":
          description: Admin role required

  # ── Keys ─────────────────────────────────────────────────────────────────

  /keys:
    get:
      operationId: listKeys
      summary: List key metadata (admin role required)
      tags: [Keys]
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeyMetadata"
    post:
      operationId: generateKey
      summary: Generate a new key (admin role required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                algorithm: { type: string }
      responses:
        "201":
          description: Key generated
        "422":
          description: >
            ML-DSA/hybrid algorithm requested against a hardware/remote key
            backend (pkcs11, vault, cloudkms) — PQC keys are
            software-keystore-only per docs/ADR_PQC_KEYS_SOFTWARE_ONLY.md.
            No token object is created.

  /cbom:
    get:
      operationId: exportCBOM
      summary: Export the cryptographic bill of materials (CycloneDX 1.6 CBOM)
      description: >-
        Always-current CycloneDX 1.6 JSON built from the live inventory on
        every call: certificates, private-key metadata (never material),
        observed algorithms (ML-DSA parameter sets carry NIST quantum
        security levels), and discovered protocol endpoints (W6-05). Every
        certificate component carries kryptkeeper:public-key-algorithm,
        kryptkeeper:signature-algorithm, kryptkeeper:key-size-bits and
        kryptkeeper:pqc-readiness properties; the body is streamed.
      tags: [Discovery]
      responses:
        "200":
          description: CycloneDX CBOM (application/vnd.cyclonedx+json)
        "503":
          description: An inventory provider errored (partial BOMs are never served)

  /ceremonies:
    post:
      operationId: startCeremony
      summary: Start an M-of-N root-CA key ceremony (admin role required)
      tags: [Ceremonies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, common_name, algorithm, validity_days, approvers, quorum]
              properties:
                name: { type: string }
                common_name: { type: string }
                algorithm: { type: string }
                validity_days: { type: integer }
                approvers: { type: array, items: { type: string }, description: "Eligible approver principals (N)" }
                quorum: { type: integer, minimum: 2, description: "Approvals required (M); must be >= 2 and <= len(approvers)" }
      responses:
        "201":
          description: >
            Ceremony created. The root CA exists but is parked
            pending_ceremony — every issuance path refuses it until the
            quorum of distinct approvals flips it active. Ceremonies
            still pending after `expires_at` (created_at + 72h, configurable
            via KRYPTKEEPER_CEREMONY_TTL) auto-abort to status `expired`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Ceremony" }
        "400":
          description: Invalid quorum/approvers or CA creation failed
    get:
      operationId: listCeremonies
      summary: List key ceremonies (admin role required)
      tags: [Ceremonies]
      responses:
        "200":
          description: Ceremonies, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Ceremony" } }

  /ceremonies/{id}:
    get:
      operationId: getCeremony
      summary: Get one ceremony (admin role required)
      tags: [Ceremonies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The ceremony
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Ceremony" }
        "404":
          description: Not found

  /ceremonies/{id}/approve:
    post:
      operationId: approveCeremony
      summary: Record one approval (admin role required)
      description: >
        The approver is the AUTHENTICATED principal — a body-supplied name
        is ignored, so one identity cannot replay N approvals. On the Mth
        distinct approval the CA transitions pending_ceremony → active.
      tags: [Ceremonies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approval recorded (ceremony completed on quorum)
        "400":
          description: Not eligible, already approved, or ceremony not pending

  /ceremonies/{id}/abort:
    post:
      operationId: abortCeremony
      summary: Abort a pending ceremony (admin role required)
      description: The CA stays pending_ceremony — permanently unusable.
      tags: [Ceremonies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Aborted
        "400":
          description: Ceremony is not pending

  /adsync/templates:
    post:
      operationId: syncADCertificateTemplates
      summary: Publish certificate templates into Active Directory
      description: >-
        WRITES into AD's Configuration naming context, which every domain
        member reads - a genuinely high blast radius, so this requires the
        approver capability rather than plain admin and every run is
        audited with its counts. Per-template failures are reported in
        `errors` rather than swallowed: a sync that half-applied must not
        read as a clean success.
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ldap_url, config_dn, credential_ref, templates]
              properties:
                ldap_url: { type: string, description: "ldaps:// unless allow_cleartext is set." }
                bind_dn: { type: string }
                credential_ref: { type: string, description: Bind password from the credential store. }
                config_dn: { type: string }
                service_name: { type: string }
                allow_cleartext:
                  type: boolean
                  description: >-
                    A simple bind sends the password, so cleartext ldap:// is
                    refused unless this is explicitly set.
                templates:
                  type: array
                  items: { type: object }
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      Created: { type: integer }
                      Updated: { type: integer }
                      Deleted: { type: integer }
                      Errors:
                        type: array
                        items: { type: string }
        "400": { description: Missing required fields or unresolvable credential }
        "401": { description: Unauthenticated }
        "403": { description: Approver role required }
        "503": { description: Directory unreachable or credential store unconfigured }

  /adsync/gpo-check:
    post:
      operationId: checkADGPOConfig
      summary: Validate an autoenrollment GPO configuration (advisory, writes nothing)
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checks:
                        type: array
                        items: { type: object }
                      all_passing: { type: boolean }
        "400": { description: Invalid request body }
        "401": { description: Unauthenticated }

  /migration/sources:
    get:
      operationId: listMigrationSources
      summary: List the registered template importers
      tags: [Migration]
      responses:
        "200":
          description: Importer names, sorted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string }
        "401": { description: Unauthenticated }

  /migration/dryrun:
    post:
      operationId: dryRunMigration
      summary: Diff an export against existing templates (writes nothing)
      tags: [Migration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationRequest" }
      responses:
        "200":
          description: Create, skip and conflict per source object, with per-field mapping status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MigrationDiff" }
        "400": { description: "Unknown source, empty or unparseable export" }
        "401": { description: Unauthenticated }
        "403": { description: ca.manage required }

  /migration/apply:
    post:
      operationId: applyMigration
      summary: Propose creating or updating the templates a dry run would
      description: >-
        Nothing is written here. When at least one template would be created
        or updated the apply is queued for a second person (202,
        pending-actions); on approval the templates are created or updated
        under a batch id. Rerunning an applied export changes nothing (200,
        nothing_to_apply). Rolling back a batch disables the templates it
        created or updated; an update is not reverted to the old content.
      tags: [Migration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationRequest" }
      responses:
        "200":
          description: Nothing to apply
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [nothing_to_apply] }
                      diff: { $ref: "#/components/schemas/MigrationDiff" }
        "202":
          description: Queued for approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [pending_approval] }
                      pending_action_id: { type: string }
                      diff: { $ref: "#/components/schemas/MigrationDiff" }
        "400": { description: "Bad export, or content over 48 KiB (split it)" }
        "401": { description: Unauthenticated }
        "403": { description: ca.manage required }

  /migration/batches:
    get:
      operationId: listMigrationBatches
      summary: List applied migration batches
      tags: [Migration]
      responses:
        "200":
          description: Batches, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MigrationBatch" }
        "401": { description: Unauthenticated }

  /migration/{batch}/report:
    get:
      operationId: getMigrationReport
      summary: Per-object report of a batch (mapped, partial and unmapped fields)
      tags: [Migration]
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The batch and its report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      batch: { $ref: "#/components/schemas/MigrationBatch" }
                      report: { $ref: "#/components/schemas/MigrationReport" }
        "401": { description: Unauthenticated }
        "404": { description: Unknown batch }

  /migration/{batch}/rollback:
    post:
      operationId: rollbackMigration
      summary: Disable (never delete) the templates a batch created
      description: >-
        Templates with a pending certificate approval stay active and are
        reported as kept. A batch with kept items is still marked rolled back;
        rolling back twice is a no-op (200, already_rolled_back, no audit row).
        A failure part-way leaves the batch applied, so a retry resumes.
      tags: [Migration]
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rollback outcome per template
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MigrationRollbackResult" }
        "401": { description: Unauthenticated }
        "403": { description: ca.manage required }
        "404": { description: Unknown batch }

  /spiffe/workload-selectors:
    get:
      operationId: listWorkloadSelectors
      summary: List UID-to-SPIFFE-ID bindings the gRPC attestor consults
      description: >-
        A binding carries no secret material - a UID and an identity name,
        both non-sensitive by design.
      tags: [SPIFFE]
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      selectors:
                        type: array
                        items:
                          type: object
                          properties:
                            uid: { type: integer }
                            spiffe_id: { type: string }
        "401": { description: Unauthenticated }
        "403": { description: Approver role required }
    post:
      operationId: bindWorkloadSelector
      summary: Bind a kernel-attested UID to a SPIFFE ID (the human approval)
      description: >-
        Registering a binding IS the approval step that keeps
        proposer != approver structural: a workload can never name its own
        identity, because the SPIFFE Workload API request carries no
        identity field at all. The SPIFFE ID must sit inside this
        deployment's trust domain - binding a UID to a foreign domain's
        identity would mint an SVID this CA has no authority to assert.
      tags: [SPIFFE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid, spiffe_id]
              properties:
                uid: { type: integer, minimum: 0 }
                spiffe_id: { type: string }
      responses:
        "201": { description: Binding registered }
        "400": { description: Malformed SPIFFE ID or foreign trust domain }
        "401": { description: Unauthenticated }
        "403": { description: Approver role required }

  /keys/byok/export:
    post:
      operationId: exportKeyToCloudKMS
      summary: Wrap an escrow-recovered root and import it into a customer-controlled KMS
      description: >-
        Moves OUR OWN escrowed root across a custody boundary into the
        customer's HSM - no new custody is taken on, but the plaintext root
        exists transiently in memory to be wrapped, so the ceremony is
        dual-control gated, every step is audited, and the material is
        zeroized on every exit path including error paths. The destination
        is resolved BEFORE the key is recovered, so an unusable provider
        fails while the key is still sealed. Only AWS is implemented:
        Azure and GCP use different BYOK envelopes and refuse explicitly
        rather than sending material they would reject.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, key_id, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                bundle:
                  type: object
                  description: A dual-custody escrow bundle from /keys/escrow.
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
                provider: { type: string, enum: [aws] }
                region: { type: string }
                key_id: { type: string, description: The destination KMS key to import into. }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Key material imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      provider: { type: string }
                      key_id: { type: string }
                      imported: { type: boolean }
        "400": { description: "Missing fields, or a provider this build cannot wrap for" }
        "401": { description: Unauthenticated }
        "403": { description: "Approver role required, or dual control not satisfied" }
        "503": { description: Wrap or KMS import failed }

  /keys/leaf-escrow:
    post:
      operationId: escrowLeafKey
      summary: Deposit an endpoint (leaf) key under dual control - opt-in only
      description: >-
        Leaf-key custody is OFF by default. Holding endpoint private keys
        conflicts with the key-boundary law unless a tenant explicitly
        adopts it, so a tenant not named in KRYPTKEEPER_LEAF_ESCROW_TENANTS
        is refused with 403 and the refusal is audited. Requires two
        DIFFERENT custodian secrets; the returned bundle is dual-custody
        ciphertext, never plaintext key bytes.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                key_id: { type: string }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Encrypted escrow bundle as a file attachment
        "400": { description: Invalid request body }
        "401": { description: Unauthenticated }
        "403": { description: "Tenant has not opted in, or dual control not satisfied" }

  /keys/leaf-escrow/recover:
    post:
      operationId: recoverLeafKey
      summary: Recover an escrowed leaf key through the same dual-control ceremony
      description: >-
        Recovery is intentionally NOT gated on the current opt-in state, so
        opting out never strands keys already in escrow. Both custodian
        secrets are required and every touch is audited.
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                bundle: { type: object }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Key restored to the store
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      key_id: { type: string }
                      recovered: { type: boolean }
        "400": { description: "Bundle missing, malformed, or dual control not satisfied" }
        "401": { description: Unauthenticated }
        "403": { description: Admin role required }

  /keys/escrow:
    post:
      operationId: escrowKey
      summary: Escrow a key under dual custodian control (admin role required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                key_id: { type: string }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string, description: "Must differ from custodian A's — dual control requires two secrets" }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: >
            Escrow bundle (JSON attachment). Dual-custody ciphertext only:
            the key is wrapped under a random inner secret, XOR-split 2-of-2
            between the custodians. One share alone recovers nothing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: { type: integer }
                  key_id: { type: string }
                  created_at: { type: string }
                  wrapped_key_pem: { type: string }
                  shares:
                    type: array
                    items:
                      type: object
                      properties:
                        slot: { type: string, enum: [A, B] }
                        salt: { type: string }
                        nonce: { type: string }
                        ciphertext: { type: string }
        "400":
          description: Identical/empty custodian passphrases, or escrow failed
        "404":
          description: Key not found

  /keys/escrow/recover:
    post:
      operationId: recoverEscrowedKey
      summary: Recover an escrowed key (both custodian passphrases required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, custodian_a_passphrase, custodian_b_passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                bundle: { type: object, description: "The escrow bundle exactly as produced by POST /keys/escrow" }
                custodian_a_passphrase: { type: string }
                custodian_b_passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "201":
          description: Recovered under the original key ID
        "400":
          description: >
            Recovery refused — a failing custodian passphrase is named by
            slot (never key material), and the key is not created.
        "409":
          description: Key already exists

  /keys/import:
    post:
      operationId: importKey
      summary: Import an encrypted key backup (admin role required)
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                backup_pem: { type: string }
                passphrase: { type: string }
      responses:
        "201":
          description: Imported

  /keys/{id}:
    get:
      operationId: getKey
      summary: Get key metadata (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Key metadata
        "404":
          description: Not found
    delete:
      operationId: deleteKey
      summary: Delete a key (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: >
            The key backs an active CA (the same in-use guard /rotate
            applies) — deleting it would orphan the CA.

  /keys/{id}/rotate:
    post:
      operationId: rotateKey
      summary: Rotate a key (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm: { type: string }
      responses:
        "200":
          description: Rotated
        "404":
          description: Not found

  /keys/{id}/policy:
    get:
      operationId: getKeyPolicy
      summary: Get a key's lifecycle policy
      description: Admin only. 404 when the key has no policy.
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/KeyPolicy" }
        "403": { description: Admin role required }
        "404": { description: No policy for this key }
    put:
      operationId: setKeyPolicy
      summary: Set a key's owner, ACL and max age
      description: >-
        Admin only. Once a key has a policy, rotate, delete and export are
        limited to its owner and ACL principals; policy edits stay admin-only so
        a lost owner cannot brick the key. `max_age_days` of 0 disables
        scheduled rotation. The sweep proposes (never directly performs) the
        re-key of an overdue CA-backing key, through the approval queue.
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner]
              properties:
                owner: { type: string }
                acl: { type: array, items: { type: string } }
                max_age_days: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/KeyPolicy" }
        "400": { description: owner missing or max_age_days negative }
        "403": { description: Admin role required }
        "404": { description: Key not found }

  /keys/{id}/compromise:
    post:
      operationId: markKeyCompromised
      summary: Start the key-compromise flow (always dual control)
      description: >-
        Admin on the key's ACL, and the key must have a policy (409 otherwise).
        Always returns 202 with `data.action_id`; nothing runs until a different
        human approves it. On approval the hub rotates the key (a failed
        rotation aborts with no other effect), stamps it compromised, revokes
        the certificates of the CA it backed with reason keyCompromise, then
        flags and re-issues them. The approved action's result report lists
        `inventory_only`: revoked certificates that were only marked in the
        hub inventory (no issuing CA here), which still need revoking at the
        real issuer. `KRYPTKEEPER_KEY_DUAL_CONTROL=false` does not
        bypass this.
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Proposal filed; awaiting a second approver.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      action_id: { type: string }
                      message: { type: string }
        "403": { description: "Not an admin, or not the owner / on the ACL" }
        "404": { description: Key not found }
        "409": { description: The key has no policy }

  /keys/{id}/cancel-deletion:
    post:
      operationId: cancelKeyDeletion
      summary: Cancel a scheduled cloud-KMS key deletion (admin role required)
      description: >
        Restores a cloud-KMS key that is inside its provider pending-deletion
        window (AWS 7 days, GCP 24 hours, Azure soft-delete 90 days) to Enabled.
        With dual control on (the default) this files a proposal that a
        different administrator approves at POST /pending-actions/{id}/approve;
        the cancellation runs on approval. Audited as key.destroy_cancel.
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dual control is off - the deletion was cancelled and the key is Enabled again.
        "202":
          description: Dual control is on - a proposal was filed and nothing changed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "403":
          description: Admin role required.
        "404":
          description: Malformed key id.
        "409":
          description: >
            The backend has no scheduled deletions (e.g. a software key), or the
            key is not inside a cancellable pending-deletion window (never
            deleted, or the provider window has passed).
        "503":
          description: The deletion status or the approval queue is unavailable.

  /keys/{id}/export:
    post:
      operationId: exportKey
      summary: Export an encrypted key backup (admin role required)
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                approved_action_id: { type: string, description: "Dual control (on by default): the id returned by the 202 proposal, once a different administrator has approved it. Single-use, expires after 10 minutes, redeemable only by the proposer." }
                passphrase: { type: string }
      responses:
        "202":
          description: Dual control is on - a proposal was filed and nothing was exported. A different administrator approves it at POST /pending-actions/{id}/approve, then the proposer repeats this request with approved_action_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DualControlProposal"
        "200":
          description: Encrypted PEM backup
        "404":
          description: Not found

  # ── Audit ────────────────────────────────────────────────────────────────

  /audit:
    get:
      operationId: listAuditEntries
      summary: Query audit log
      tags: [Audit]
      parameters:
        - name: action
          in: query
          description: An exact action, or a dotted prefix that also matches every action under it (certificate matches certificate.issue).
          schema: { type: string }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      next_cursor: { type: string, nullable: true }
                      prev_cursor: { type: string, nullable: true }
                  principal: { type: string }
        "403":
          description: The caller's role lacks the audit.read permission (pki-admin, auditor, pki-auditor, or a custom role granted it)

  /audit/export:
    get:
      operationId: exportAuditEntries
      summary: Stream every matching audit row as CSV or JSON
      description: >-
        Pages the audit log server-side in fixed chunks of 1000 and streams
        each chunk, so memory stays bounded however large the log is. Rows
        are oldest-first. Filters match GET /audit; a tenant principal
        receives only its own tenant's rows (an unscoped super-admin gets
        all). The export itself is recorded as an audit.export event
        carrying the filter and row count, written after the stream so the
        file never contains its own row. CSV fields starting with = + - @
        tab or CR are prefixed with a quote to defuse formula injection.
        An error after the first byte truncates the body (status cannot
        change) and is recorded as a failed audit.export event.
      tags: [Audit]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
        - name: action
          in: query
          schema: { type: string }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: actor_type
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string }
        - name: after
          in: query
          description: RFC 3339 lower bound (exclusive).
          schema: { type: string, format: date-time }
        - name: before
          in: query
          description: RFC 3339 upper bound (exclusive).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Attachment stream (audit-evidence-<UTC timestamp>.csv|json)
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "400": { description: "format is not csv or json, or unknown outcome filter" }
        "401": { description: Unauthenticated }
        "403": { description: The caller's role lacks the audit.read permission }
        "503": { description: Audit store unavailable }

  /audit/archive:
    post:
      operationId: proposeAuditArchive
      summary: Propose archiving and deleting audit rows older than the retention window
      description: >-
        Files a dual-control pending action (action_type audit_archive); it
        changes nothing until a second, distinct pki-admin approves it via
        POST /pending-actions/{id}/approve. On approval the hub writes every
        audit row older than `before` to a signed, hash-chained JSONL archive
        under AUDIT_ARCHIVE_DIR (default KRYPTKEEPER_DATA_DIR/audit-archive,
        mode 0600), records the archive's Merkle checkpoint in the
        audit_archives table, and only then deletes those rows in one
        transaction in which the append-only trigger is relaxed for that
        transaction alone. The job is recorded as an audit.archive event. The
        cutoff may not reach into the retention window (AUDIT_RETENTION_DAYS,
        default 2555); `before` defaults to the edge of the window.
        Instance-wide: with multi-tenancy on, only an unscoped super-admin may
        propose or approve. Transparency log: the live Merkle tree is derived
        from the remaining rows, so it restarts after an archive; checkpoints
        published before the archive cannot be proven consistent with later
        ones, and the signed archive checkpoint anchors the archived prefix.
      tags: [Audit]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                before:
                  type: string
                  format: date-time
                  description: RFC 3339 cutoff; rows strictly older are archived.
      responses:
        "202":
          description: Proposal filed; awaiting a second approver
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PendingAction"
        "400": { description: before is malformed or inside the retention window }
        "401": { description: Unauthenticated }
        "403": { description: "Caller is not a pki-admin, or (multi-tenancy on) not an unscoped super-admin" }
        "503": { description: Audit archiving unavailable (audit trail not in the hub database) }

  # ── Users ────────────────────────────────────────────────────────────────

  /users:
    get:
      operationId: listUsers
      summary: List users (requires user.manage)
      tags: [Users]
      responses:
        "403":
          description: Caller's role lacks user.manage
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserRecord"

  /users/me/prefs:
    get:
      operationId: getMyPrefs
      summary: The caller's own UI preferences (onboarding dismissal)
      tags: [Users]
      responses:
        "200":
          description: Preferences (defaults when none stored)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPrefs"
        "401":
          description: Unauthenticated
        "503":
          description: Prefs store unavailable
    put:
      operationId: setMyPrefs
      summary: Set the caller's own UI preferences (audited as user.prefs.set)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [onboarding_dismissed]
              properties:
                onboarding_dismissed: { type: boolean }
      responses:
        "200":
          description: Stored preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPrefs"
        "400":
          description: Unknown field, missing field or malformed body
        "401":
          description: Unauthenticated
        "503":
          description: Prefs store unavailable

  /users/invite:
    post:
      operationId: inviteUser
      summary: Invite a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, default: pki-operator }
                tenant:
                  type: string
                  description: Super-admin only; a tenant-scoped caller invites into its own tenant.
      responses:
        "201":
          description: Invitation sent
        "400":
          description: Missing email, or unknown role
        "403":
          description: The caller does not hold every permission of the requested role

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateUser
      summary: Update user role or status
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string }
                status: { type: string }
      responses:
        "200":
          description: Updated user
        "400":
          description: Unknown role
        "403":
          description: The caller does not hold every permission of the requested role
        "404":
          description: User not found
    delete:
      operationId: deactivateUser
      summary: Deactivate user
      tags: [Users]
      responses:
        "204":
          description: Deactivated
        "404":
          description: User not found

  # ── Auth / API Keys ──────────────────────────────────────────────────────

  /auth/methods:
    get:
      operationId: authMethods
      summary: Which sign-in methods this deployment offers (unauthenticated)
      description: >-
        Booleans only — reveals nothing an anonymous caller could not learn
        by probing the individual login routes. Lets the login page render
        the right buttons.
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Available sign-in methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      password: { type: boolean }
                      oidc: { type: boolean }
                      saml: { type: boolean }

  /auth/login:
    post:
      operationId: login
      summary: Login with credentials
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Access + refresh tokens and sets kk_token httpOnly cookie
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      summary: End the session (expire cookie, revoke refresh tokens)
      description: >-
        Expires the kk_token cookie and revokes server-side every refresh
        token held by the principal identified by the cookie or bearer token,
        plus the optional body-supplied refresh token (A2A7-003). The access
        JWT already issued stays valid until its own expiry. Always 204.
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204":
          description: Cookie cleared

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh an access token using a body-supplied refresh token
      description: >-
        S-60: the handler reads {"refresh_token"} from the REQUEST BODY —
        there is no refresh cookie, and this endpoint does NOT re-issue
        the kk_token session cookie the way /auth/login does. A browser
        session survives refresh because the client stores the new access
        token and the Authorization header is consulted before the cookie;
        cookie-only clients must re-login rather than refresh.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: >-
            New access token (and rotated refresh token) in the JSON body.
            The kk_token cookie is NOT re-issued.
        "400":
          description: Missing or invalid request body
        "401":
          description: Invalid or expired refresh token
        "429":
          description: Rate limit exceeded (30/minute per client IP)

  /authz-check:
    get:
      operationId: authzCheck
      summary: Report the caller's resolved role/scopes/permissions
      tags: [Auth]
      responses:
        "200":
          description: Resolved authorization context
        "401":
          description: >-
            Unauthenticated, OR a valid session whose UserProvider account
            has since been deprovisioned (W6-02) -- the two are
            indistinguishable in the response, to avoid leaking which case
            applies.

  /auth/role-map/preview:
    get:
      operationId: previewRoleMap
      summary: Preview which role a set of IdP groups would receive
      description: >-
        W22-19. Applies APP_AUTH_ROLE_MAP_JSON (first matching entry, in
        order) to the supplied group values and reports the role, the
        APP_AUTH_UNMAPPED_ROLE policy and whether an SSO login with those
        groups would succeed. Requires role-management permission
        (user.manage). Reads instance-global auth config only.
      tags: [Auth]
      parameters:
        - name: groups
          in: query
          required: false
          description: Comma-separated IdP group values (at most 50, each at most 256 characters).
          schema:
            type: string
      responses:
        "200":
          description: Mapping preview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [groups, mapped, role, matched_claim_value, unmapped_policy, effective_role, would_login]
                    properties:
                      groups:
                        type: array
                        items:
                          type: string
                      mapped:
                        type: boolean
                      role:
                        type: string
                        description: Role of the matching map entry, or empty when none matches.
                      matched_claim_value:
                        type: string
                      unmapped_policy:
                        type: string
                        enum: [deny, read-only]
                      effective_role:
                        type: string
                        description: The mapped role, else the opt-in fallback (viewer), else empty.
                      would_login:
                        type: boolean
        "400":
          description: Too many groups or a group value is too long
        "401":
          description: Unauthenticated
        "403":
          description: Caller lacks role-management permission

  /auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start OIDC SSO login (authorization-code + PKCE)
      description: >-
        Redirects the browser to the configured IdP's authorization endpoint
        with a server-generated state and PKCE code_challenge (S256). Fails
        closed (503) if OIDC login is not fully configured.
      tags: [Auth]
      security: []
      responses:
        "302":
          description: Redirect to the IdP's authorization endpoint
        "429":
          description: >-
            Per-client-IP rate limit exceeded
            (API_RATE_LIMIT_OIDC_LOGIN_PER_MIN), or the server-side
            pending-login table is at its hard ceiling. No redirect and no
            PKCE state are issued in either case.
        "503":
          description: OIDC login not configured/enabled

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC SSO callback (IdP redirect target)
      description: >-
        Validates state (single-use, expiring) and exchanges the
        authorization code for an ID token at the IdP's token endpoint using
        the matching PKCE code_verifier. The ID token is validated via the
        same issuer/audience/signature path bearer OIDC tokens use
        (auth_jwks.go/auth_oidc.go). On success, resolves the token's email
        claim against an ALREADY-PROVISIONED UserProvider account (no
        just-in-time creation -- see /scim/v2/Users) and establishes the same
        session/cookie POST /auth/login issues. A replayed or expired state,
        a code_verifier the IdP rejects, an invalid ID token, an
        unprovisioned identity, or a deprovisioned account each fail closed
        with no session issued.
      tags: [Auth]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Login succeeded; sets kk_token httpOnly cookie and redirects
        "401":
          description: State/PKCE/ID-token validation failed, or no matching provisioned account
        "429":
          description: >-
            Per-client-IP rate limit exceeded
            (API_RATE_LIMIT_OIDC_CALLBACK_PER_MIN). Checked before the state
            is consumed and before the IdP token-endpoint exchange, so a
            throttled request neither burns a valid state nor causes an
            outbound request to the IdP.

  /auth/saml/login:
    get:
      operationId: samlLogin
      summary: Start SP-initiated SAML SSO login
      description: >-
        Redirects the browser to the configured IdP's SSO URL with a
        SAMLServiceProvider.BuildAuthURL-built AuthnRequest. Fails closed
        (503) if SAML login is not fully configured (IdP SSO URL, IdP
        issuer, SP issuer, ACS URL and at least one IdP certificate all
        required).
      tags: [Auth]
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: >-
            Optional same-origin path to redirect to after login, echoed
            back via RelayState. Anything not starting with a single "/"
            is ignored in favor of the configured default.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the IdP's SSO URL with a SAMLRequest parameter
        "429":
          description: Rate limit exceeded
        "503":
          description: SAML login not configured/enabled

  /auth/saml/acs:
    post:
      operationId: samlAssertionConsumerService
      summary: SAML assertion consumer service (IdP POST target)
      description: >-
        Validates the POSTed SAMLResponse via
        SAMLServiceProvider.RetrieveAssertionInfo. An expired assertion or
        one addressed to a different audience returns no error from that
        call -- both surface only as AssertionInfo.WarningInfo
        (InvalidTime/NotInAudience) -- so this endpoint rejects on those
        fields explicitly, and separately rejects unless
        ResponseSignatureValidated is true (an individually-signed
        assertion inside an otherwise-unsigned response envelope is not
        sufficient). A response carrying a wrapped/second Assertion element
        is rejected by RetrieveAssertionInfo itself. Resolves the
        assertion's identity (an Email/email attribute, else NameID)
        against an ALREADY-PROVISIONED UserProvider account (no
        just-in-time creation -- see /scim/v2/Users) and establishes the
        same session/cookie POST /auth/login and the OIDC callback issue,
        so S-34 role claims, deprovisioning and tenancy apply unchanged.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        "302":
          description: Login succeeded; sets kk_token httpOnly cookie and redirects
        "401":
          description: >-
            Signature/warning/audience/expiry validation failed, a
            wrapped/second Assertion element was present, no matching
            provisioned account was found, or the account is deprovisioned
        "429":
          description: Per-client-IP rate limit exceeded (checked before response parsing)
        "503":
          description: SAML login not configured/enabled

  /api-keys:
    get:
      operationId: listAPIKeys
      summary: List API keys (own keys, or all for admins)
      tags: [Auth]
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKeyRecord"
    post:
      operationId: createAPIKey
      summary: Create an API key (admin role required)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                principal_id: { type: string }
                role: { type: string }
                scopes:
                  type: array
                  items: { type: string }
                expires_at: { type: string, format: date-time }
                tenant: { type: string }
      responses:
        "201":
          description: API key created (secret returned once)
        "400":
          description: Invalid request, or unknown role
        "403":
          description: The caller is not an admin, or does not hold every permission of the key's role
        "503":
          description: Key minting is off (APP_API_KEY_PEPPER unset), or the key could not be saved to the database so none was issued; retry

  /api-keys/{kid}:
    delete:
      operationId: deleteAPIKey
      summary: Revoke an API key (admin role required)
      tags: [Auth]
      parameters:
        - name: kid
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "503":
          description: The key is already rejected by this process but the revocation could not be saved to the database (it would return after a restart); repeat the DELETE until it succeeds

  # ── SCIM 2.0 Provisioning (root-scoped, not /api/v1; W6-02) ─────────────
  # A trust boundary separate from the rest of this API: authenticated via
  # scimBearerAuth only, never bearerAuth. See scimBearerAuth's description.

  /scim/v2/Users:
    servers:
      - url: /
    get:
      operationId: scimListUsers
      summary: List provisioned accounts
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      responses:
        "200":
          description: SCIM ListResponse of Users
        "401":
          description: Missing/invalid SCIM bearer token
    post:
      operationId: scimCreateUser
      summary: Provision an account
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/SCIMUser"
      responses:
        "201":
          description: Account created
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUser"
        "400":
          description: Missing userName/emails
        "401":
          description: Missing/invalid SCIM bearer token

  /scim/v2/Users/{id}:
    servers:
      - url: /
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: scimGetUser
      summary: Get a provisioned account
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      responses:
        "200":
          description: Account
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUser"
        "404":
          description: Not found
    patch:
      operationId: scimUpdateUser
      summary: Update role/active (SCIM PATCH Operations, e.g. active=false to deprovision)
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              properties:
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      op: { type: string, enum: [add, replace] }
                      path: { type: string }
                      value: {}
      responses:
        "200":
          description: Updated account
        "404":
          description: Not found
    delete:
      operationId: scimDeprovisionUser
      summary: Deprovision an account (soft -- maps to DeactivateUser, never a hard delete)
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      responses:
        "204":
          description: Deprovisioned
        "404":
          description: Not found

  /scim/v2/Groups:
    servers:
      - url: /
    get:
      operationId: scimListGroups
      summary: List provisioned groups
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      responses:
        "200":
          description: SCIM ListResponse of Groups
        "401":
          description: Missing/invalid SCIM bearer token
    post:
      operationId: scimCreateGroup
      summary: >-
        Create a group (optionally with initial members). Membership maps to
        a Kryptkeeper role via APP_SCIM_GROUP_ROLE_MAP_JSON when the group's
        displayName is configured.
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/SCIMGroup"
      responses:
        "201":
          description: Group created
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMGroup"
        "400":
          description: Missing displayName
        "401":
          description: Missing/invalid SCIM bearer token

  /scim/v2/Groups/{id}:
    servers:
      - url: /
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: scimGetGroup
      summary: Get a group
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      responses:
        "200":
          description: Group
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMGroup"
        "404":
          description: Not found
    patch:
      operationId: scimUpdateGroupMembers
      summary: Add/remove members (SCIM PATCH Operations, path=members)
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              properties:
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      op: { type: string, enum: [add, remove] }
                      path: { type: string }
                      value:
                        type: array
                        items:
                          type: object
                          properties:
                            value: { type: string }
      responses:
        "200":
          description: Updated group
        "404":
          description: Not found
    delete:
      operationId: scimDeleteGroup
      summary: Delete a group
      tags: [SCIM]
      security:
        - scimBearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

