{{- /* minAvailable: 1 on a single pod would block every node drain. */ -}}
{{- if and .Values.pdb.enabled (gt (include "kryptkeeper.replicas" . | int) 1) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kryptkeeper.fullname" . }}
  labels:
    {{- include "kryptkeeper.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "kryptkeeper.selectorLabels" . | nindent 6 }}
{{- end }}
