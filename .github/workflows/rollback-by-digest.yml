# W20-02: already workflow_dispatch-only (no change needed to its trigger) --
# kept, not deleted, for the same reason as promote-by-digest.yml: this rolls
# an environment back to a previously-verified digest, a different job than
# building one. Same known gap: `precheck` below verifies with `cosign
# verify --key`/COSIGN_PUBLIC_KEY, which will not validate a digest signed
# keyless by release.yml's goreleaser `docker_signs`. Rolling back to a
# release.yml-built image needs that verify step switched to `cosign verify
# --certificate-identity .../release.yml@refs/tags/v* --certificate-oidc-issuer
# https://token.actions.githubusercontent.com` first -- see
# promote-by-digest.yml's header for the fuller note.
name: rollback-by-digest

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        default: production
      rollback_digest:
        description: Digest to rollback to (image@sha256:...)
        required: true
      incident_id:
        description: Incident identifier
        required: true

permissions:
  contents: read
  packages: read

# workflow_dispatch inputs reach shell only through env (IAC-006): never
# interpolate inputs.* expressions into a run: script.
env:
  IN_TARGET_ENV: ${{ inputs.target_env }}
  IN_ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
  IN_INCIDENT_ID: ${{ inputs.incident_id }}

concurrency:
  group: rollback-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate rollback request
        run: |
          set -euo pipefail
          digest="$IN_ROLLBACK_DIGEST"
          if [[ ! "$digest" =~ ^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{40,64}$ ]]; then
            echo "Invalid rollback digest format: $digest"
            exit 1
          fi
          if [[ "$IN_TARGET_ENV" != "staging" && "$IN_TARGET_ENV" != "production" ]]; then
            echo "target_env must be one of: staging, production"
            exit 1
          fi
          if [ -z "$IN_INCIDENT_ID" ]; then
            echo "incident_id is required"
            exit 1
          fi
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify rollback digest exists
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "$IN_ROLLBACK_DIGEST" > /dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Rollback digest not found after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Verify rollback digest signature
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PUBLIC_KEY}" ]; then
            echo "COSIGN_PUBLIC_KEY is required for rollback verification"
            exit 1
          fi
          umask 077
          printf '%s' "$COSIGN_PUBLIC_KEY" > cosign.pub
          for attempt in 1 2 3; do
            if cosign verify --key cosign.pub "$IN_ROLLBACK_DIGEST" > /dev/null; then
              rm -f cosign.pub
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              rm -f cosign.pub
              echo "Cosign verification failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

  deploy-rollback:
    runs-on: ubuntu-latest
    needs: [precheck]
    environment: ${{ inputs.target_env }}
    timeout-minutes: 20
    env:
      DEPLOY_CMD_STAGING: ${{ secrets.DEPLOY_CMD_STAGING }}
      DEPLOY_CMD_PRODUCTION: ${{ secrets.DEPLOY_CMD_PRODUCTION }}
      INCIDENT_ID: ${{ inputs.incident_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Deploy rollback digest
        run: |
          set -euo pipefail
          if [ "$IN_TARGET_ENV" = 'staging' ] && [ -z "${DEPLOY_CMD_STAGING}" ]; then
            echo "DEPLOY_CMD_STAGING secret must be configured"
            exit 1
          fi
          if [ "$IN_TARGET_ENV" = 'production' ] && [ -z "${DEPLOY_CMD_PRODUCTION}" ]; then
            echo "DEPLOY_CMD_PRODUCTION secret must be configured"
            exit 1
          fi
          if [ -x scripts/deploy/by-digest.sh ]; then
            scripts/deploy/by-digest.sh "$IN_TARGET_ENV" "$IN_ROLLBACK_DIGEST" "incident:$IN_INCIDENT_ID"
          else
            echo "Missing executable deploy script: scripts/deploy/by-digest.sh"
            exit 1
          fi

  verify-recovery:
    runs-on: ubuntu-latest
    needs: [deploy-rollback]
    timeout-minutes: 15
    env:
      KRYPTKEEPER_SMOKE_BASE_URL_STAGING: ${{ secrets.KRYPTKEEPER_SMOKE_BASE_URL_STAGING }}
      KRYPTKEEPER_SMOKE_BASE_URL_PRODUCTION: ${{ secrets.KRYPTKEEPER_SMOKE_BASE_URL_PRODUCTION }}
      KRYPTKEEPER_OCSP_SMOKE_URL: ${{ secrets.KRYPTKEEPER_OCSP_SMOKE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify recovery checks
        run: |
          set -euo pipefail
          if [ "$IN_TARGET_ENV" = 'staging' ] && [ -z "${KRYPTKEEPER_SMOKE_BASE_URL_STAGING}" ]; then
            echo "KRYPTKEEPER_SMOKE_BASE_URL_STAGING secret must be configured"
            exit 1
          fi
          if [ "$IN_TARGET_ENV" = 'production' ] && [ -z "${KRYPTKEEPER_SMOKE_BASE_URL_PRODUCTION}" ]; then
            echo "KRYPTKEEPER_SMOKE_BASE_URL_PRODUCTION secret must be configured"
            exit 1
          fi
          if [ -x scripts/deploy/smoke.sh ]; then
            scripts/deploy/smoke.sh "$IN_TARGET_ENV"
          else
            echo "Missing executable smoke script: scripts/deploy/smoke.sh"
            exit 1
          fi

  announce:
    runs-on: ubuntu-latest
    needs: [verify-recovery]
    timeout-minutes: 5
    steps:
      - name: Emit rollback record
        run: |
          set -euo pipefail
          cat > rollback-record.txt <<EOF
          target_env=${IN_TARGET_ENV}
          rollback_digest=${IN_ROLLBACK_DIGEST}
          incident_id=${IN_INCIDENT_ID}
          actor=${{ github.actor }}
          sha=${{ github.sha }}
          rolled_back_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-record
          path: rollback-record.txt
