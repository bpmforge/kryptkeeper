# W31-11: TLS vhost serving whatever sits at /etc/ssl/kk/server.{crt,key}.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/kk/server.crt;
    ssl_certificate_key /etc/ssl/kk/server.key;
    location / {
        return 200 "kk-pqc-wave\n";
        add_header Content-Type text/plain;
    }
}
