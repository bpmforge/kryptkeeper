{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: {{ .Values.k8sDiscovery.enabled }}
metadata:
  name: {{ include "kryptkeeper.serviceAccountName" . }}
  labels:
    {{- include "kryptkeeper.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
