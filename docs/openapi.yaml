    post:
      operationId: createNotificationRule
      summary: Create alert rule
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel, target]
              description: Exactly one of threshold_days, threshold_pct or use_defaults must be given.
              properties:
                name: { type: string }
                threshold_days: { type: integer, minimum: 1, maximum: 3650, description: Absolute days before expiry. Never fires for a certificate whose lifetime is not longer than this. }
                threshold_pct: { type: integer, minimum: 0, maximum: 100, description: Percent of the certificate's lifetime remaining; 0 means EXPIRED. }
                use_defaults: { type: boolean, description: Create the four default rules (50%, 25%, 10%, EXPIRED). }
                template_id: { type: string, maxLength: 128, description: Scope the rule to one template; template-scoped rules override global ones for that template. }
                channel: { type: string, enum: [email, slack, pagerduty, webhook, itsm, plugin] }
                target: { type: string, description: "Destination for the channel (for itsm, the id of an existing ITSM connection visible to the caller tenant; for plugin, <plugin_id>/<credential_id> naming an enabled notify plugin and an api_token credential holding its credential fields), or the literal @owner_team to route each alert to the certificate owner team's /notifications/team-routes on this channel, else the global inbox (owner_team *), else the dashboard queue with nothing sent externally." }
      responses:
        "201":
          description: Created rule (with use_defaults, the 50% rule plus meta.created listing all four ids)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationRule"
                  meta:
                    type: object
