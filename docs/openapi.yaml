  /reports/key-custody:
    get:
      operationId: getKeyCustodyReport
      summary: Per-key custody evidence (backend, rotation history, access events)
      tags: [Reports]
      responses:
        "200":
          description: >-
            Key-custody report: per-key custody facts plus targets[], the
            effective key-handling mode of every target visible to the caller
            (W23-46).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [generated_at, backend, dual_control_escrow, keys, event_counts, targets]
                    properties:
                      generated_at: { type: string, format: date-time }
                      backend: { type: string }
                      dual_control_escrow: { type: boolean }
                      keys:
                        type: array
                        items:
                          type: object
                          required: [key_id, algorithm, backend, rotation_count, access_count, events]
                          properties:
                            key_id: { type: string }
                            algorithm: { type: string }
                            backend: { type: string }
                            created_at: { type: string }
                            deleted: { type: boolean, description: Tombstone for a key no longer in the keystore (super-admin only) }
                            imported: { type: boolean }
                            rotation_count: { type: integer }
                            last_rotated_at: { type: string }
                            access_count: { type: integer }
                            last_accessed_at: { type: string }
                            events:
                              type: array
                              items:
                                type: object
                                required: [action, occurred_at, requester, approver, redeemer, dual_control]
                                properties:
                                  action: { type: string, enum: [key.export, key.escrow, key.escrow_recover, key.rotate, key.delete] }
                                  occurred_at: { type: string }
                                  requester: { type: string }
                                  approver: { type: string, description: Empty only when dual control was off }
                                  redeemer: { type: string }
                                  dual_control: { type: boolean }
                                  approval_id: { type: string }
                      event_counts:
                        type: object
                        description: Count per custody action over the keys visible to the caller; all five actions always present.
                        additionalProperties: { type: integer }
                      truncated: { type: boolean, description: Audit trail exceeded the read limit }
                      pqc_custody_statement: { type: string }
                      targets:
                        type: array
                        items:
                          type: object
                          required: [target_id, name, host, install_mode, mode, source]
                          properties:
                            target_id: { type: string }
                            name: { type: string }
                            host: { type: string }
                            install_mode: { type: string }
                            mode: { type: string, enum: [client_csr, hub_generated, hsm_resident_ca, macos_non_extractable] }
                            source: { type: string, enum: [explicit, derived] }
        "503":
