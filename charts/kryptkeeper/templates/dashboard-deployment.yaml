{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kryptkeeper.dashboardFullname" . }}
  labels:
    {{- include "kryptkeeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "kryptkeeper.dashboardSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the nginx config changes; a subPath ConfigMap
        # mount never refreshes in place.
        checksum/config: {{ include (print $.Template.BasePath "/dashboard-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kryptkeeper.dashboardSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kryptkeeper.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          securityContext:
            {{- toYaml (merge (dict "runAsUser" 101) .Values.securityContext) | nindent 12 }}
          {{- if .Values.dashboard.image.digest }}
          image: "{{ .Values.dashboard.image.repository }}@{{ .Values.dashboard.image.digest }}"
          {{- else }}
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: hub-ca
              mountPath: /etc/kryptkeeper/tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "kryptkeeper.dashboardFullname" . }}
        {{- if .Values.tls.enabled }}
        - name: hub-ca
          secret:
            secretName: {{ required "dashboard.hubCA.existingSecret is required when dashboard.enabled and tls.enabled" .Values.dashboard.hubCA.existingSecret }}
            items:
              - key: {{ .Values.dashboard.hubCA.key }}
                path: {{ .Values.dashboard.hubCA.key }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
