server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    location / {
        return 200 "kryptkeeper-agent-uat\n";
    }
}
