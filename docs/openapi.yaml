  /notifications/ownerless:
    get:
      operationId: listOwnerlessExpiringCertificates
      summary: List expiring certificates that have no owner team
      description: |
        Active certificates with no owner team whose expiry is within `within_days`
        (already-expired ones included), soonest first. Same "unowned" definition as
        the dashboard count and `GET /certificates?owner=unassigned`. Alerts for
        these certificates go to the routes whose owner_team is `!ownerless` (the
        ownerless queue), else the global inbox, else the dashboard queue.
        Tenant-scoped callers see only their own tenant's certificates.
      tags: [Notifications]
      parameters:
        - { name: within_days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 3650, default: 30 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Ownerless expiring certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            fingerprint_sha256: { type: string }
                            common_name: { type: string }
                            valid_until: { type: string, format: date-time }
                            days_left: { type: integer, description: Negative when already expired }
                            owner_email: { type: string }
                            ca_id: { type: string }
                  meta:
                    type: object
                    properties:
                      total: { type: integer, description: Matches before `limit` is applied }
                      within_days: { type: integer }
        "400":
          description: within_days or limit out of range
        "403":
          description: Caller may not read operational summaries

