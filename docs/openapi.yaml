  # ── Events (W8-14) ───────────────────────────────────────────────────────

  /events:
    get:
      operationId: streamOperationEvents
      summary: >-
        Server-sent event stream of long-running operation status
        (Content-Type: text/event-stream). ONE stream carries every
        operation kind -- clients filter client-side on each event's `kind`
        field rather than opening a stream per kind. The stream is
        tenant-scoped through the same principal resolution every other
        endpoint uses (internal/bootstrap/auth.go's resolvePrincipalTenancy):
        a principal receives every in-tenant operation's events, including
        ones it did not itself start, and never receives another tenant's.
        Each SSE `data:` line is one JSON-encoded OperationEvent. The server
        also emits a bare SSE comment line (`:`) on a fixed interval as a
        heartbeat, so proxies/load balancers do not reap an idle-but-healthy
        connection -- clients must ignore lines that don't start with
        `data:`. The connection is bounded: an idle timeout, a maximum
        lifetime, and a cap on concurrent streams per principal (exceeding
        the cap returns 429 rather than dropping an existing stream).
      tags: [Events]
      responses:
        "200":
          description: >-
            Event stream opened. Body is `text/event-stream`, not JSON --
            each event is `data: <OperationEvent JSON>\n\n`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/OperationEvent"
        "429":
          description: >-
            This principal already holds the maximum number of concurrent
            event streams.

