# Trust the hub's SSH CA for users, and present a hub-issued host
# certificate. Key-only: no passwords, no authorized_keys.
TrustedUserCAKeys /etc/ssh/kk_user_ca.pub
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
AuthorizedKeysFile none
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
LogLevel VERBOSE
