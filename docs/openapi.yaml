  # ── Outbound credentials ──────────────────────────────────────

  /itsm/connections:
    get:
      operationId: listItsmConnections
      summary: List ITSM connections (admin role required, W32-10)
      description: Responses carry the credential reference only, never the credential.
      tags: [ITSM]
      responses:
        "200":
          description: Connections visible to the caller's tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ItsmConnection" }
        "401":
          description: Unauthenticated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Admin role required
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: ITSM integration not available
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
    post:
      operationId: createItsmConnection
      summary: Connect a ticketing system (admin role required, W32-10)
      description: >-
        base_url must be https (http only for a loopback host).
        credential_ref names an entry in the encrypted outbound credential
        store; for ServiceNow its api_token payload is
        {"username","password"}, for Jira {"email","api_token"}. Kind plugin
        (D-326) names an enabled ticket plugin in plugin_id, takes no
        base_url, and its credential is an api_token credential holding the
        plugin's credential_schema fields (which include the service's
        subdomain address). Plugin connections cannot carry approval_pending:
        approval sync stays native-only.
      tags: [ITSM]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, credential_ref]
              properties:
                kind: { type: string, enum: [servicenow, jira, plugin] }
                name: { type: string }
                base_url: { type: string, description: "Required for servicenow and jira; must be empty for plugin." }
                credential_ref: { type: string }
                plugin_id: { type: string, description: "Required for kind plugin: the id of an enabled ticket plugin." }
                event_classes:
                  type: array
                  items: { $ref: "#/components/schemas/ItsmEventClass" }
                  description: >-
                    Only these event classes create tickets, each with its
                    ticket type; empty means all classes with the connector
                    default. The array is stored and returned verbatim.
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ItsmConnection" }
        "400":
          description: Invalid kind, name or base_url, or unknown credential_ref
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "401":
          description: Unauthenticated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Admin role required
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: ITSM integration or credential store not available
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }

