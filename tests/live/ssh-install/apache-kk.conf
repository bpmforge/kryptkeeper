# W19-02 fixture: TLS vhost serving whatever the hub last installed at
# /etc/ssl/kk/*. No "Listen 443" here -- Ubuntu's stock
# /etc/apache2/ports.conf already declares it inside <IfModule ssl_module>,
# which a2enmod ssl (Containerfile) activates; a second Listen 443 here
# collides with it ("Cannot define multiple Listeners on the same IP:port").
<VirtualHost *:443>
    ServerName kk-uat-apache.local
    SSLEngine on
    SSLCertificateFile   /etc/ssl/kk/server.crt
    SSLCertificateKeyFile /etc/ssl/kk/server.key

    DocumentRoot /var/www/html
    <Location "/">
        SetHandler none
    </Location>
</VirtualHost>
