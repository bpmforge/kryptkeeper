# Keyless (Sigstore) cosign signing of archives + checksums. CI-only: it
# needs the GitHub Actions OIDC token (id-token: write in release.yml), which
# does not exist in a local run -- `--skip=sign` is required outside CI.
signs:
  - id: keyless
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

# Keyless signing of the pushed images, by digest. Same CI-only constraint as
# `signs` above.
docker_signs:
  - id: keyless
    cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}"
    artifacts: manifests

release:
  github:
    owner: bpmforge
    name: kryptkeeper
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
