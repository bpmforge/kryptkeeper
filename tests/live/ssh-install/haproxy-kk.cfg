# W27-08 fixture: TLS frontend serving whatever the hub last installed at
# /etc/ssl/kk/haproxy.pem (one file: chain then key). Content is irrelevant;
# only the served leaf certificate is checked.
global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 5s
    timeout server 5s

frontend kk_tls
    bind *:443 ssl crt /etc/ssl/kk/haproxy.pem
    http-request return status 200 content-type text/plain string kk-uat-haproxy
