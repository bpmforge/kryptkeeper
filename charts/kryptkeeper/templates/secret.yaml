{{- if not .Values.secrets.existingSecret }}
{{- if and .Values.secrets.bootstrapToken (eq .Values.secrets.bootstrapToken .Values.secrets.keystorePassphrase) }}
{{- fail "secrets.keystorePassphrase must differ from secrets.bootstrapToken (the token is a network credential, the passphrase protects CA private keys at rest)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kryptkeeper.secretName" . }}
  labels:
    {{- include "kryptkeeper.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_BOOTSTRAP_TOKEN: {{ required "secrets.bootstrapToken is required" .Values.secrets.bootstrapToken | quote }}
  KRYPTKEEPER_KEYSTORE_PASSPHRASE: {{ required "secrets.keystorePassphrase is required" .Values.secrets.keystorePassphrase | quote }}
  {{- if eq .Values.config.dbMode "postgres" }}
  DATABASE_URL: {{ required "secrets.databaseURL is required when config.dbMode is postgres" .Values.secrets.databaseURL | quote }}
  {{- else if .Values.secrets.databaseURL }}
  DATABASE_URL: {{ .Values.secrets.databaseURL | quote }}
  {{- end }}
  {{- if .Values.notifications.smtp.password }}
  SMTP_PASSWORD: {{ .Values.notifications.smtp.password | quote }}
  {{- end }}
  {{- if .Values.notifications.slack.webhookURL }}
  SLACK_WEBHOOK_URL: {{ .Values.notifications.slack.webhookURL | quote }}
  {{- end }}
  {{- if .Values.notifications.pagerduty.routingKey }}
  PAGERDUTY_ROUTING_KEY: {{ .Values.notifications.pagerduty.routingKey | quote }}
  {{- end }}
  {{- if .Values.cloudKMS.keyURI }}
  KRYPTKEEPER_KMS_KEY_URI: {{ .Values.cloudKMS.keyURI | quote }}
  {{- end }}
{{- end }}
