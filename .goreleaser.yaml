    goarch: amd64
    dockerfile: Dockerfile.agent
    use: buildx
    extra_files: [go.mod, go.sum, cmd, internal, sdk]
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=TARGETOS=linux"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
      - "--build-arg=DATE={{ .Date }}"
      - "--build-arg=TARGETARCH=amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    image_templates:
      - "ghcr.io/bpmforge/kryptkeeper-agent:{{ .Version }}-amd64"
  - id: kryptkeeper-agent-linux-arm64
    ids: [kryptkeeper-agent]
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.agent
    use: buildx
    extra_files: [go.mod, go.sum, cmd, internal, sdk]
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=TARGETOS=linux"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
      - "--build-arg=DATE={{ .Date }}"
      - "--build-arg=TARGETARCH=arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    image_templates:
      - "ghcr.io/bpmforge/kryptkeeper-agent:{{ .Version }}-arm64"

  - id: kryptkeeper-certmanager-linux-amd64
    ids: [kryptkeeper-certmanager]
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.certmanager
    use: buildx
    extra_files: [go.mod, go.sum, cmd, internal, sdk]
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=TARGETOS=linux"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
      - "--build-arg=DATE={{ .Date }}"
      - "--build-arg=TARGETARCH=amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    image_templates:
      - "ghcr.io/bpmforge/kryptkeeper-certmanager:{{ .Version }}-amd64"
  - id: kryptkeeper-certmanager-linux-arm64
    ids: [kryptkeeper-certmanager]
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.certmanager
    use: buildx
    extra_files: [go.mod, go.sum, cmd, internal, sdk]
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=TARGETOS=linux"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
