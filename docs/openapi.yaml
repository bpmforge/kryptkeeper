  /delivery-plugins:
    get:
      operationId: listDeliveryPlugins
      summary: List delivery plugins and their versions (W20-20)
      tags: [DeliveryPlugins]
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeliveryPlugin" }
        "503":
          description: Delivery plugins are turned off (KRYPTKEEPER_DELIVERY_PLUGINS=off) or unavailable
    post:
      operationId: installDeliveryPlugin
      summary: Install a plugin version, disabled (pki-admin)
      description: >-
        The module must match the manifest's artifact.sha256 and compile.
        An unsigned upload is trust tier "community". A signature (cosign
        sign-blob over manifest.json's exact bytes, sent as manifest_base64)
        makes it "first-party" (the compiled-in Kryptkeeper plugin key) or
        "verified" (a key in KRYPTKEEPER_PLUGIN_TRUSTED_KEYS); a signature
        that does not verify against either refuses the install (W20-24).
      tags: [DeliveryPlugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wasm_base64]
              properties:
                manifest: { type: object, description: "manifest.json (api_version kryptkeeper.delivery/v1); unsigned installs only. Send this or manifest_base64." }
                manifest_base64: { type: string, description: "manifest.json's exact bytes, base64. Required with a signature." }
                signature: { type: string, description: "cosign sign-blob output over manifest.json: the sigstore bundle JSON or the bare base64 signature" }
                wasm_base64: { type: string }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryPluginVersion" }
        "400":
          description: Invalid manifest, hash mismatch, a module that does not compile, or a signature that does not verify against a trusted plugin-signing key
        "403":
          description: Not pki-admin
        "409":
          description: That version is already installed

  /delivery-plugins/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDeliveryPlugin
      summary: One delivery plugin
      tags: [DeliveryPlugins]
      responses:
        "200":
          description: Plugin
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryPlugin" }
        "404":
          description: No such plugin
    delete:
      operationId: removeDeliveryPlugin
      summary: Remove a disabled plugin and all its versions (pki-admin)
      tags: [DeliveryPlugins]
      responses:
        "204":
          description: Removed
        "409":
          description: The plugin is enabled; disable it first

  /delivery-plugins/{id}/disable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: disableDeliveryPlugin
      summary: Stop a plugin; renewals through it fail until it is enabled again (pki-admin)
