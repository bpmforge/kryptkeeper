          description: Rejected or revoked
        "403":
          description: Not an approver role, or self-approval attempted

  # ── Integrations ─────────────────────────────────────────────────────────────

  /integrations/microsoft:
    get:
      operationId: getMicrosoftIntegrationStatus
      summary: Microsoft SCEP / XCEP / WSTEP integration status
      tags: [Integrations]
      responses:
        "200":
          description: Integration status. scep_enabled is true only when SCEP is serving; scep_off_reason (additive, omitted when empty) says why it is not when it was requested or cannot run, for example a non-RSA SCEP CA.

  /scep/challenges:
    post:
      operationId: createSCEPChallenge
      summary: Mint a one-time SCEP enrollment challenge bound to a device's names (pki-admin or pki-operator; W20-16)
      description: >-
        The response is the only place the challenge secret ever appears.
        A device puts it in its CSR's challengePassword; the hub consumes it
        once and issues exactly common_name and dns_names, never the CSR's
        own names. Served only when SCEP is enabled (KRYPTKEEPER_SCEP_ENABLED).
      tags: [SCEP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [common_name]
              properties:
                common_name: { type: string, description: "Host name; no wildcards" }
                dns_names: { type: array, items: { type: string }, maxItems: 20 }
                ttl: { type: string, description: "Go duration, default 1h, at most 24h" }
      responses:
        "201":
          description: Challenge minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/SCEPChallenge"
                      - type: object
                        properties:
                          challenge: { type: string, description: "The one-time secret (64 hex characters)" }
        "400":
          description: Invalid names or TTL
        "403":
          description: Caller lacks pki-admin or pki-operator
    get:
      operationId: listSCEPChallenges
      summary: List SCEP challenges, newest first, without their secrets
      tags: [SCEP]
      responses:
        "200":
          description: Challenges
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SCEPChallenge" }

  /scep/challenges/{id}:
    delete:
      operationId: deleteSCEPChallenge
      summary: Withdraw an unused SCEP challenge
      tags: [SCEP]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Withdrawn
        "404":
          description: No unused challenge with that id (a used one stays as a record)

  /scep/labels:
    get:
      operationId: listSCEPLabels
      summary: List SCEP labels (pki-admin; W20-23)
      description: >-
        A label publishes a named SCEP endpoint, /scep/{label}, whose challenge
        mode is "intune": the hub validates each device's challenge through
        the Microsoft Intune SCEP validation API before issuing. The bare /scep
        route keeps the hub's one-time challenges.
      tags: [SCEP]
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SCEPLabel" }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
    post:
      operationId: createSCEPLabel
      summary: Create an Intune-mode SCEP label (pki-admin)
      description: >-
        credential_ref names an api_token credential in the outbound credential
        store whose payload is {"client_secret": "..."} or {"certificate_pem":
        "...", "private_key_pem": "..."} for the Entra app. The secret is never
        accepted, stored in the label or returned here.
      tags: [SCEP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, mode, template_id, intune_tenant_id, intune_client_id, credential_ref]
              properties:
                label: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$" }
                mode: { type: string, enum: [intune] }
                template_id: { type: string, description: "Its enrollment_permissions gate the label (role protocol:scep)" }
                intune_tenant_id: { type: string, description: "Entra tenant GUID or domain" }
                intune_client_id: { type: string, description: "Entra app (client) id" }
                credential_ref: { type: string }
                issuing_authority: { type: string, maxLength: 256, description: "certIssuingAuthority reported to Intune; defaults to the certificate issuer" }
                description: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SCEPLabel" }
        "400": { description: "Invalid label, mode or tenant, or the template or credential is not usable" }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
        "409": { description: Label already exists }

  /scep/labels/{label}:
    delete:
      operationId: deleteSCEPLabel
      summary: Delete a SCEP label (pki-admin)
      tags: [SCEP]
      parameters:
        - name: label
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
        "404": { description: No such label }

  /acme/eab-keys:
    post:
      operationId: createACMEEABKey
      summary: Mint an ACME External Account Binding credential (pki-admin; W26-01)
      description: >-
        hmac_key (base64url, unpadded; what certbot --eab-hmac-key and lego
        --hmac take) appears only in this response. provisioner and
        template_id are recorded as metadata; a key bound to a provisioner
        only registers accounts on that provisioner's directory (W26-02).
      tags: [ACME]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
                provisioner: { type: string, description: "Lowercase letters, digits, hyphens" }
                template_id: { type: string }
      responses:
        "201":
          description: Key minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [kid, hmac_key, created_at]
                    properties:
                      kid: { type: string }
                      hmac_key: { type: string, description: "Shown once" }
                      label: { type: string }
                      provisioner: { type: string }
                      template_id: { type: string }
                      created_at: { type: string, format: date-time }
        "400":
          description: Invalid request
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "503":
          description: No credential store passphrase configured, or the store is unavailable
    get:
      operationId: listACMEEABKeys
      summary: List ACME EAB credentials without key material (pki-admin)
      tags: [ACME]
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        kid: { type: string }
                        label: { type: string }
                        provisioner: { type: string }
                        template_id: { type: string }
                        created_by: { type: string }
                        created_at: { type: string, format: date-time }
                        revoked_at: { type: string, format: date-time, nullable: true }
                        last_used_at: { type: string, format: date-time, nullable: true }
                        uses: { type: integer }
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin

  /acme/eab-keys/{kid}:
    delete:
      operationId: revokeACMEEABKey
      summary: Revoke an ACME EAB credential; its next newAccount fails (pki-admin)
      tags: [ACME]
      parameters:
        - name: kid
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "404":
          description: No such key
        "409":
          description: Already revoked

  /acme/devices:
    post:
      operationId: addACMEDevice
      summary: Add a device to the ACME device inventory (pki-admin; W40-02)
      description: >-
        device-attest-01 issues only to identifiers in this inventory:
        attestation proves the hardware, the inventory proves ownership. The
        identifier is the order value verbatim (case-sensitive, at most 64
        bytes, optional "/assigner-OID" suffix per draft-ietf-acme-device-attest
        section 3.1) and is unique across the hub. With MULTI_TENANCY on the
        entry belongs to the caller's tenant and only CAs of that tenant issue
        to it.
      tags: [ACME]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, maxLength: 64 }
                label: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ACMEDevice" }
        "400":
          description: Invalid identifier or label
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "409":
          description: The identifier is already in the inventory
        "503":
          description: Inventory unavailable
    get:
      operationId: listACMEDevices
      summary: List the ACME device inventory visible to the caller (pki-admin; W40-02)
      tags: [ACME]
      responses:
        "200":
          description: Devices by identifier
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ACMEDevice" }
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin

  /acme/devices/{identifier}:
    delete:
      operationId: removeACMEDevice
      summary: Remove a device from the ACME device inventory (pki-admin; W40-02)
      description: >-
        Takes effect at once: an order already attested is refused at finalize.
        The identifier is percent-encoded because it may contain "/".
      tags: [ACME]
      parameters:
        - name: identifier
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "404":
          description: No such device (or it belongs to another tenant)

  /acme/provisioners:
    get:
      operationId: listACMEProvisioners
      summary: List ACME provisioners (pki-admin; W26-02)
      tags: [ACME]
      responses:
        "200":
          description: Provisioners by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ACMEProvisioner" }
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
    post:
      operationId: createACMEProvisioner
      summary: Create an ACME provisioner (pki-admin; W26-02)
      description: >-
        Serves /acme/{name}/directory bound to one CA and optional template.
        allow_names entries are exact names or "*.suffix" (any depth below the
        suffix); at least one is required. challenges is a subset of http-01
        and dns-01 (empty means both); wildcard names never get http-01.
      tags: [ACME]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACMEProvisionerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ACMEProvisioner" }
        "400":
          description: Invalid request; the message names the bad field or entry
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "409":
          description: Name already exists

  /acme/provisioners/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getACMEProvisioner
      summary: Get an ACME provisioner (pki-admin)
      tags: [ACME]
      responses:
        "200":
          description: The provisioner
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ACMEProvisioner" }
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "404":
          description: No such provisioner
    put:
      operationId: updateACMEProvisioner
      summary: Replace an ACME provisioner's settings (pki-admin)
      tags: [ACME]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACMEProvisionerInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ACMEProvisioner" }
        "400":
          description: Invalid request
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "404":
          description: No such provisioner
    delete:
      operationId: deleteACMEProvisioner
      summary: Delete an ACME provisioner; its directory 404s (pki-admin)
      tags: [ACME]
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "404":
          description: No such provisioner

  /delivery-plugins:
    get:
      operationId: listDeliveryPlugins
      summary: List delivery plugins and their versions (W20-20)
      tags: [DeliveryPlugins]
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeliveryPlugin" }
        "503":
          description: Delivery plugins are turned off (KRYPTKEEPER_DELIVERY_PLUGINS=off) or unavailable
    post:
      operationId: installDeliveryPlugin
      summary: Install a plugin version, disabled (pki-admin)
      description: >-
        The module must match the manifest's artifact.sha256 and compile.
        An unsigned upload is trust tier "community". A signature (cosign
        sign-blob over manifest.json's exact bytes, sent as manifest_base64)
        makes it "first-party" (the compiled-in Kryptkeeper plugin key) or
        "verified" (a key in KRYPTKEEPER_PLUGIN_TRUSTED_KEYS); a signature
        that does not verify against either refuses the install (W20-24).
      tags: [DeliveryPlugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wasm_base64]
              properties:
                manifest: { type: object, description: "manifest.json (api_version kryptkeeper.delivery/v1); unsigned installs only. Send this or manifest_base64." }
                manifest_base64: { type: string, description: "manifest.json's exact bytes, base64. Required with a signature." }
                signature: { type: string, description: "cosign sign-blob output over manifest.json: the sigstore bundle JSON or the bare base64 signature" }
                wasm_base64: { type: string }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryPluginVersion" }
        "400":
          description: Invalid manifest, hash mismatch, a module that does not compile, or a signature that does not verify against a trusted plugin-signing key
        "403":
          description: Not pki-admin
        "409":
          description: That version is already installed

  /delivery-plugins/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDeliveryPlugin
      summary: One delivery plugin
      tags: [DeliveryPlugins]
      responses:
        "200":
          description: Plugin
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryPlugin" }
        "404":
          description: No such plugin
    delete:
      operationId: removeDeliveryPlugin
      summary: Remove a disabled plugin and all its versions (pki-admin)
      tags: [DeliveryPlugins]
      responses:
        "204":
          description: Removed
        "409":
          description: The plugin is enabled; disable it first

  /delivery-plugins/{id}/disable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: disableDeliveryPlugin
      summary: Stop a plugin; renewals through it fail until it is enabled again (pki-admin)
      tags: [DeliveryPlugins]
      responses:
        "200":
          description: Disabled

  /delivery-plugins/{id}/versions/{version}/enable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
    post:
      operationId: enableDeliveryPluginVersion
      summary: Enable a plugin version (pki-admin)
      description: >-
        Standard capabilities, or an upgrade that adds none, are enabled at
        once (200). High or Critical capabilities create a pending action
        that a different pki-admin must approve (202); the previously enabled
        version keeps running until then (D-116).
      tags: [DeliveryPlugins]
      responses:
        "200":
          description: Enabled
        "202":
          description: Waiting for a second pki-admin in the approval queue
        "404":
          description: No such plugin version

  /plugin-catalogue:
    get:
      operationId: listPluginCatalogue
      summary: List the signed plugin catalogue with install status (pki-admin, W38-11)
      description: >-
        Fetches catalogue.json and its cosign bundle through the egress guard
        (only when called; the hub never polls), verifies the signature
        against the compiled-in first-party key or KRYPTKEEPER_PLUGIN_TRUSTED_KEYS,
        and marks each entry available, installed or upgradable. The URL is
        KRYPTKEEPER_PLUGIN_CATALOGUE_URL (default https://kryptkeeper.io/plugins/catalogue.json;
        empty disables it).
      tags: [DeliveryPlugins]
      responses:
        "200":
          description: Catalogue entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      generated_at: { type: string }
                      entries:
                        type: array
                        items: { $ref: "#/components/schemas/PluginCatalogueEntry" }
        "403":
          description: Not pki-admin
        "502":
          description: The catalogue could not be fetched or its signature does not verify
        "503":
          description: The catalogue is disabled or plugins are turned off

  /plugin-catalogue/{id}/install:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: installPluginFromCatalogue
      summary: Install a plugin version from the catalogue, disabled (pki-admin, W38-11)
      description: >-
        Downloads the manifest, cosign bundle and module, checks the module
        against the catalogue's and the manifest's SHA-256, then runs the same
        install as a manual upload (same trust tiers). Enabling is a separate
        step and High or Critical capabilities still need a second pki-admin.
      tags: [DeliveryPlugins]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: "Defaults to the highest version listed." }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryPluginVersion" }
        "400":
          description: Hash mismatch, manifest not matching the entry, or a signature that does not verify
        "404":
          description: Not in the catalogue
        "409":
          description: Already installed, or the version needs a newer hub
        "502":
          description: Download failed or the catalogue signature does not verify
        "503":
          description: The catalogue is disabled

  /plugin-catalogue/import:
    post:
      operationId: importPluginFromCatalogueFiles
      summary: Install a plugin from catalogue files carried in by hand (pki-admin, W38-11)
      description: >-
        For air-gapped hubs. Send the catalogue.json and catalogue.json.bundle
        from a release asset plus one plugin's manifest.json, its bundle and
        plugin.wasm. The catalogue signature is verified exactly as for an
        online fetch; nothing touches the network.
      tags: [DeliveryPlugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, catalogue_base64, catalogue_bundle, manifest_base64, bundle, wasm_base64]
              properties:
                id: { type: string }
                version: { type: string }
                catalogue_base64: { type: string }
                catalogue_bundle: { type: string }
                manifest_base64: { type: string }
                bundle: { type: string }
                wasm_base64: { type: string }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryPluginVersion" }
        "400":
          description: Bad files, hash mismatch, or a signature that does not verify
        "404":
          description: Not in the catalogue
        "409":
          description: That version is already installed
        "502":
          description: The catalogue signature does not verify

  /integrations/siem:
    get:
      operationId: getSIEMIntegrationStatus
      summary: SIEM integration status
      tags: [Integrations]
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: {type: boolean}
                      webhook_enabled: {type: boolean}
                      webhook_target: {type: string}
                      webhook_has_token: {type: boolean}
                      syslog_enabled: {type: boolean}
                      syslog_addr: {type: string}
                      syslog_proto: {type: string}
                      format:
                        type: string
                        description: "W19-27: SIEM_FORMAT env var -- json (default) or cef (ArcSight CEF), applies to both webhook and syslog targets"
                        enum: [json, cef]

  /integrations/siem/test:
    post:
      operationId: testSIEMIntegration
      summary: Send a test event to the configured SIEM, in the configured format (json or cef)
      tags: [Integrations]
      responses:
        "200":
          description: Test event sent

  # ── Runtime configuration ───────────────────────────────────────────────

  /config:
    get:
      operationId: listRuntimeConfig
      summary: Effective runtime settings (notifications, renewal policy, discovery, SSO) -- env defaults merged with DB overrides
      tags: [Config]
      responses:
        "200":
          description: Effective settings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EffectiveSetting"
        "403":
          description: Forbidden
        "503":
          description: Config store unavailable

  /config/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
        description: Registered runtime setting key, e.g. notifications.smtp_host
    put:
      operationId: setRuntimeConfig
      summary: Set a DB override for a runtime setting (admin only); secret keys are write-only and never echoed back
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        "204":
          description: Override set
        "400":
          description: Invalid request body or value
        "403":
          description: Admin role required
        "404":
          description: Unknown config key
        "409":
          description: An sso.oidc_* key was refused because no enabled local admin exists, or the OIDC discovery test failed; nothing was saved
        "503":
          description: Config store unavailable
    delete:
      operationId: resetRuntimeConfig
      summary: Remove a DB override, reverting the effective value to its env default (admin only)
      tags: [Config]
      responses:
        "204":
          description: Override removed
        "403":
          description: Admin role required
        "404":
          description: No override set for this key
        "503":
          description: Config store unavailable

  # ── Inventory ────────────────────────────────────────────────────────────

  /renewal/rollout:
    post:
      operationId: runCoordinatedRollout
      summary: Cluster-atomic renewal - one certificate, canary then fleet
      description: >-
        Multi-node clusters where several nodes serve the SAME certificate
        are left manual by incumbents: renew node-by-node and the cluster
        serves a split identity until the last node lands. This performs
        EXACTLY ONE renewal and pushes that identical material to every
        node, canary first. Every node's tenant visibility is authorized
        BEFORE any node is touched, so an unauthorized target aborts the
        rollout untouched rather than splitting the cluster halfway.
        When every node is an ssh-mode nginx, apache or haproxy host the
        rollout is STAGED (mode "staged"): the new certificate is written
        beside the live files on every node first, then flipped canary-first
        with reload and verify. Any failure returns every node to the old
        certificate (flipped nodes restore the copy kept on the host; staged
        nodes discard), so the cluster is all-new or all-old; the host-side
        predecessor copy is deleted once the whole group has flipped. Other
        groups run "sequential": a node whose verify fails is reverted by the
        pusher's own restore, but a node that already SUCCEEDED cannot be
        auto-reverted (that would require the predecessor's private key,
        which is deliberately not retained) and is reported as rollback_failed
        so the operator knows exactly which nodes are on the new certificate.
        The maintenance window is checked before anything runs: an
        out-of-window request issues no certificate and dials no node. Each
        node's outcome is audited as its own certificate.renew_rollout row.
      tags: [Renewal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, nodes]
              properties:
                fingerprint: { type: string }
                group: { type: string }
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      target_id: { type: string }
                      is_canary: { type: boolean }
                window:
                  type: object
                  description: UTC maintenance window; both zero means any time.
                  properties:
                    start_hour: { type: integer }
                    end_hour: { type: integer }
                install:
                  type: object
                  description: >-
                    Optional install profile override applied to every node.
                    pki-admin only (403 otherwise); by default each node uses
                    its target's stored install profile.
                  properties:
                    verify_host_port: { type: string }
      responses:
        "200":
          description: Rollout result with per-node outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group: { type: string }
                      mode: { type: string, enum: [staged, sequential], description: "staged = two-phase stage-then-flip with cluster-atomic rollback (ssh nginx/apache/haproxy groups); sequential = node-by-node." }
                      new_fingerprint: { type: string, description: SHA-256 of the one renewed leaf every node received; empty when deferred. }
                      deferred: { type: boolean, description: Outside the maintenance window; nothing was touched. }
                      halted: { type: boolean }
                      halt_reason: { type: string }
                      node_results:
                        type: array
                        items:
                          type: object
                          properties:
                            node_id: { type: string }
                            is_canary: { type: boolean }
                            outcome:
                              type: string
                              enum: [installed, rolled_back, skipped, failed, rollback_failed]
                            detail: { type: string }
        "400": { description: "Missing fingerprint or nodes, or too many nodes" }
        "401": { description: Unauthenticated }
        "403": { description: A node is not visible to the caller's tenant }
        "404": { description: Certificate or a target not found }
        "409":
          description: >-
            The certificate already has a successor, typically minted by an
            earlier halted or rolled-back rollout that no node kept. Nothing
            was minted or pushed; roll out successor_fingerprint instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [conflict] }
                  message: { type: string }
                  successor_fingerprint:
                    type: string
                    description: >-
                      The successor an earlier (halted or rolled-back) attempt
                      already minted. The hub never re-mints or reuses key
                      material implicitly; roll this certificate out instead.
        "503": { description: Renewal failed or credential store unconfigured }

  /crypto-agility/roadmap:
    post:
      operationId: deriveCryptoAgilityRoadmap
      summary: Derive a migration roadmap and progress for an algorithm transition
      description: >-
        Generalizes the PQC-wave machinery to ANY algorithm transition, so
        "what do we migrate, in what order, before RSA-2048 is disallowed in
        2030" is a query rather than a spreadsheet. A policy that constrains
        neither algorithms nor max_key_bits is REFUSED: it would match
        nothing, report 100% migrated and return a clean roadmap - a false
        all-clear.
      tags: [Reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                algorithms:
                  type: array
                  items: { type: string }
                max_key_bits: { type: integer, description: "0 = ignore key size." }
                deadline: { type: string, format: date-time }
      responses:
        "200":
          description: Roadmap grouped by migration wave, plus progress against the deadline
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      roadmap:
                        type: object
                        properties:
                          policy: { type: string }
                          generated_at: { type: string, format: date-time }
                          total_matched: { type: integer }
                          deadline: { type: string, format: date-time }
                          by_wave:
                            type: object
                            description: Test | Internal | Customer-Facing.
                            additionalProperties:
                              type: array
                              items:
                                type: object
                                properties:
                                  fingerprint: { type: string }
                                  common_name: { type: string }
                                  wave_tier: { type: string }
                                  reason: { type: string }
                                  deadline: { type: string, format: date-time }
                      progress:
                        type: object
                        properties:
                          policy: { type: string }
                          total_inventory: { type: integer }
                          matched_remaining: { type: integer }
                          percent_migrated: { type: integer }
                          deadline: { type: string, format: date-time }
                          overdue: { type: boolean }
        "400": { description: Unconstrained policy or bad deadline }
        "401": { description: Unauthenticated }
        "503": { description: Inventory unavailable }

  /blast-radius:
    get:
      operationId: simulateBlastRadius
      summary: What breaks if I revoke this, retire that CA, or disallow an algorithm
      description: >-
        Pre-flight simulation over the live inventory. Edges run
        dependent->dependency, so impact propagates transitively: retiring a
        CA reaches its certificates and then the services those certificates
        serve. Algorithm targets are named algorithm+size ("RSA-2048")
        because deprecation deadlines are written against a key size, not a
        bare family. Child CAs depend on their parent, so retiring a CA
        also reaches its sub-CAs. Services are derived from certificate
        SANs and common names and attach to every certificate naming them,
        so a service served by two certificates is reported when either
        breaks (over-reported, never under-reported). `edge_coverage`
        discloses how many certificates carry dependency edges. Unknown
        targets return 404; a target owned by another tenant returns 403.
      tags: [Reports]
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [revoke, retire_ca, deprecate_algorithm]
        - name: target
          in: query
          required: true
          schema: { type: string }
          description: Certificate fingerprint, CA id, or algorithm-size label.
      responses:
        "200":
          description: Simulated impact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      action: { type: string }
                      target: { type: string }
                      total_affected: { type: integer }
                      severity:
                        type: string
                        enum: [none, low, medium, high, critical]
                      affected_by_kind:
                        type: object
                        additionalProperties:
                          type: array
                          items: { type: string }
                      graph_size: { type: string }
                      edge_coverage:
                        type: object
                        properties:
                          certs_total: { type: integer }
                          certs_with_ca_edge: { type: integer }
                          certs_with_service_edge: { type: integer }
                          basis: { type: string }
        "400": { description: Missing target or unknown action }
        "401": { description: Unauthenticated }
        "403": { description: Target belongs to another tenant }
        "404": { description: Target not found }
        "503": { description: Inventory unavailable }

  /audit/transparency/checkpoint:
    get:
      operationId: getAuditTransparencyCheckpoint
      summary: Signed Merkle checkpoint over the audit log (the auditor's trust anchor)
      description: >-
        Returns the Ed25519-signed tree head. When
        AUDIT_TRANSPARENCY_SIGNING_SEED is unset the hub generates a seed
        once and persists it at KRYPTKEEPER_DATA_DIR/audit-transparency.seed
        (mode 0600), logging a warning; if that file cannot be written the
        endpoint refuses with 503 rather than signing under an ephemeral key,
        which would be unverifiable after a restart. Auditors must pin the
        public key out of band (the public_key field here is informational;
        a forger could ship their own) and verify offline with
        kryptkeeper-audit-verify.
      tags: [Audit]
      responses:
        "200":
          description: Signed checkpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      size: { type: integer }
                      root: { type: string, description: Base64 Merkle Tree Hash. }
                      signature: { type: string }
                      public_key: { type: string }
        "401": { description: Unauthenticated }
        "503": { description: "Checkpoint signing key unavailable (invalid seed, or the data directory is not writable)" }

  /audit/transparency/inclusion:
    get:
      operationId: getAuditInclusionProof
      summary: RFC 6962 inclusion proof for one audit record
      tags: [Audit]
      parameters:
        - name: index
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Audit path proving the record is in the tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      index: { type: integer }
                      tree_size: { type: integer }
                      root: { type: string }
                      audit_path:
                        type: array
                        items: { type: string }
        "400": { description: Invalid index }
        "401": { description: Unauthenticated }

  /audit/transparency/consistency:
    get:
      operationId: getAuditConsistencyProof
      summary: RFC 6962 consistency proof between an earlier tree size and now
      description: >-
        Proves the tree at size `from` is a prefix of the current tree. A
        record edited after the fact fails this check against a previously
        recorded head - the property that makes the trail tamper-evident.
      tags: [Audit]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Consistency proof
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from_size: { type: integer }
                      tree_size: { type: integer }
                      root: { type: string }
                      proof:
                        type: array
                        items: { type: string }
        "400": { description: Invalid from size }
        "401": { description: Unauthenticated }

  /inventory/keys:
    get:
      operationId: getCloudKeyInventory
      summary: Unified key inventory across cloud KMS, SSH host keys and SSH user keys
      description: >-
        Each provider runs concurrently under a 3 s timeout. SSH host keys
        come from discovery (algorithms only); SSH user keys from the
        in-memory SSH key inventory. The crypto-agility denominator for KEYS, completing the
        certificate-side inventory. Read-only: a provider that cannot be
        reached degrades the result and is named in `errors` rather than
        failing the request, so one dead cloud never hides the others.
        Requires `key.manage` or `report.read`.
      tags: [Inventory]
      responses:
        "200":
          description: Aggregated key inventory with PQC readiness rollup
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      generated_at: { type: string, format: date-time }
                      total: { type: integer }
                      pqc_summary:
                        type: object
                        additionalProperties: { type: integer }
                        description: Counts keyed by vulnerable | quantum_safe | unknown.
                      providers:
                        type: array
                        items: { type: string }
                      keys:
                        type: array
                        items:
                          type: object
                          properties:
                            provider: { type: string }
                            location: { type: string }
                            key_id: { type: string }
                            algorithm: { type: string }
                            usage: { type: string }
                            state: { type: string }
                            rotation_enabled: { type: boolean }
                            created_at: { type: string }
                            pqc_readiness: { type: string }
                            key_type:
                              type: string
                              description: Empty for cloud KMS keys; `host` or `user` for SSH keys.
                            stale:
                              type: boolean
                              description: Past its rotation window (SSH user keys).
                      errors:
                        type: array
                        items: { type: string }
                        description: >-
                          Per-provider failures as generic strings
                          ("cloud key inventory unavailable: <provider>");
                          the raw cloud error is logged server-side only.
                          Presence means a partial result.
        "401":
          description: Unauthenticated
        "403":
          description: Requires the key.manage or report.read permission (mcp-agent is refused)

  /codesign/issue:
    post:
      operationId: issueCodesignCertificate
      summary: Exchange a CI OIDC token and a CSR for a short-lived code-signing certificate
      description: >-
        The OIDC token is the credential (no hub Bearer). It must come from an
        issuer with an approved trust rule and match that rule's audience,
        repository pattern and ref pattern, and its jti is single-use. The
        certificate carries EKU codeSigning, is valid for at most 15 minutes
        (KRYPTKEEPER_CODESIGN_TTL, clamped to 30s-14m) and is bound to the
        repository and ref through a URI SAN of the form
        `<base>/<repo>@<ref>` (base is https://github.com for github, the
        issuer for gitlab). The CSR key must be ECDSA P-256/P-384/P-521 or
        RSA >= 3072; the hub never generates the subject key. The certificate
        is recorded in the inventory, so revoke and policy-check see it.
        Every outcome is audited as codesign.issue; refusal reasons are
        written to the audit trail only.
      tags: [CA]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oidc_token, csr_pem]
              properties:
                oidc_token: { type: string }
                csr_pem: { type: string }
      responses:
        "201":
          description: Issued (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      certificate_pem: { type: string }
                      chain_pem: { type: string }
                      serial_number: { type: string }
                      fingerprint_sha256: { type: string }
                      not_before: { type: string, format: date-time }
                      not_after: { type: string, format: date-time }
                      repo: { type: string }
                      ref: { type: string }
        "400":
          description: Invalid body, CSR, or unsupported key type
        "401":
          description: Token refused (generic body; the reason is audit-only)
        "403":
          description: Refused by issuance policy
        "413":
          description: Request body too large
        "503":
          description: Code-signing issuance unavailable, or the certificate could not be recorded

  /codesign/oidc-trust-rules:
    get:
      operationId: listCodesignTrustRules
      summary: List CI OIDC trust rules visible to the caller's tenant
      tags: [CA]
      responses:
        "200":
          description: Trust rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CodesignTrustRule"
        "401":
          description: Unauthenticated
        "503":
          description: Trust store unavailable
    post:
      operationId: proposeCodesignTrustRule
      summary: Propose a CI OIDC trust rule (dual control)
      description: >-
        Queues the rule in the approval queue; it takes effect only when a
        different approver approves it. The CA must be visible to the
        caller's tenant. Repo patterns must name an owner (contain `/`, not
        start with `*`), ref patterns must start with `refs/`, `**` is not
        supported.
      tags: [CA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, issuer, audience, repo_pattern, ref_pattern, ca_id]
              properties:
                provider: { type: string, enum: [github, gitlab] }
                issuer: { type: string }
                audience: { type: string }
                repo_pattern: { type: string }
                ref_pattern: { type: string }
                ca_id: { type: string }
                rationale: { type: string }
      responses:
        "202":
          description: Pending approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      action_id: { type: string }
                      status: { type: string }
        "400":
          description: Invalid or overly broad rule, or unknown CA
        "401":
          description: Unauthenticated
        "403":
          description: Requires pki-admin
        "503":
          description: Trust store or approval queue unavailable

  /codesign/oidc-trust-rules/{id}:
    delete:
      operationId: deleteCodesignTrustRule
      summary: Remove a CI OIDC trust rule (single control; removing trust is the safe direction)
      tags: [CA]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthenticated
        "403":
          description: Requires pki-admin
        "404":
          description: No such rule in the caller's tenant
        "503":
          description: Trust store unavailable

  /tsa:
    post:
      operationId: timestampRFC3161
      summary: RFC 3161 time-stamp authority
      description: >-
        Body is a DER TimeStampReq (`Content-Type: application/timestamp-query`,
        up to 64 KiB, SHA-256/384/512 digests); the reply is a DER TimeStampResp
        (`application/timestamp-reply`). A rejected request (for example an
        unsupported hash) is still HTTP 200: clients read the PKIStatus. Needs
        a hub principal (Bearer) unless the operator set
        KRYPTKEEPER_TSA_ALLOW_ANONYMOUS=true, because jarsigner and openssl ts
        cannot send a Bearer token. Every request is audited as
        codesign.timestamp with the digest (never the request body). The TSA key
        and certificate are operator-provisioned files
        (KRYPTKEEPER_TSA_CERT_FILE / KRYPTKEEPER_TSA_KEY_FILE).
      tags: [CA]
      requestBody:
        required: true
        content:
          application/timestamp-query:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: TimeStampResp (granted or rejected in-band)
          content:
            application/timestamp-reply:
              schema: { type: string, format: binary }
        "401":
          description: Authentication required (anonymous access is off by default)
        "413":
          description: Request body too large
        "415":
          description: Content-Type is not application/timestamp-query
        "503":
          description: Time-stamp authority not configured, or signing failed

  /codesign/requests:
    post:
      operationId: createCodeSigningRequest
      summary: Request a code-signing certificate with an HSM-generated key
      description: >-
        The hub generates the key pair in the HSM/KMS backend (never a
        software store) and builds the CSR there, then queues the request for
        a second user's approval. A codeSigning-EKU template always requires
        approval and the approver must differ from the requester. Refusals
        (including `protected_store_required`) audit `codesign.request.deny`.
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ca_id, template_id, common_name]
              properties:
                ca_id: { type: string }
                template_id: { type: string }
                common_name: { type: string }
                team_id: { type: string }
                algorithm:
                  type: string
                  enum: [RSA-3072, RSA-4096, ECDSA-P256, ECDSA-P384]
                  default: ECDSA-P256
      responses:
        "202":
          description: Queued for approval; no certificate exists yet
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending_approval] }
                  approval_id: { type: string }
                  key_id: { type: string }
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid credentials
        "403":
          description: Role, team or tenant scope refused
        "422":
          description: Not a code-signing template, policy violation, or no protected key store

  /inventory/code-signing:
    get:
      operationId: getCodeSigningInventory
      summary: Code-signing certificate inventory
      tags: [Inventory]
      responses:
        "200":
          description: Inventory

  /inventory/code-signing/policy-check:
    post:
      operationId: checkCodeSigningPolicy
      summary: Evaluate the live code-signing inventory against a policy
      description: >-
        Stateless by design so a CI pipeline can gate a release on signing
        hygiene without a policy-CRUD subsystem. Key-size floors are
        per-family because a single minimum cannot compare RSA with EC;
        PQC algorithms carry no comparable bit length and are governed by
        the algorithm allowlist instead. A zero-value policy constrains
        nothing rather than failing everything.
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                allowed_algorithms:
                  type: array
                  items: { type: string }
                min_rsa_key_size_bits: { type: integer }
                min_ec_key_size_bits: { type: integer }
                max_validity_days: { type: integer }
      responses:
        "200":
          description: Policy evaluation over every code-signing certificate in view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      policy_id: { type: string }
                      evaluated: { type: integer }
                      compliant: { type: integer }
                      violating: { type: integer }
                      findings:
                        type: array
                        items:
                          type: object
                          properties:
                            fingerprint_sha256: { type: string }
                            common_name: { type: string }
                            violations:
                              type: array
                              items: { type: string }
        "400":
          description: Invalid policy body
        "401":
          description: Unauthenticated
        "503":
          description: Inventory unavailable

  # ── Scheduler ────────────────────────────────────────────────────────────

  /scheduler/renewal/status:
    get:
      operationId: getRenewalSchedulerStatus
      summary: Renewal scheduler status (last scan, next scan, counts)
      description: >-
        threshold_days is the global default window. max_threshold_days (W27-04)
        is the widest window in force on the last scan: the default or the
        largest target or group threshold.
      tags: [Scheduler]
      responses:
        "200":
          description: Scheduler status

  # ── Managed Targets ──────────────────────────────────────────────────────────

  /ct/findings:
    get:
      operationId: listCTFindings
      summary: List Certificate Transparency findings (tenant-scoped, audited as ct.finding.list)
      description: >-
        Certificates seen in CT for an owned domain whose serial is absent from
        the inventory (W24-19). Sorted created_at desc, id.
      tags: [CT Findings]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, acknowledged, known_issuer] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Findings visible to the caller's tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [findings, total]
                    properties:
                      findings:
                        type: array
                        items:
                          $ref: "#/components/schemas/CTFinding"
                      total: { type: integer, description: "Matching findings before the limit" }
        "400":
          description: Invalid status or limit
        "403":
          description: Caller may not read operational summaries
        "503":
          description: CT findings store unavailable

  /ct/findings/{id}/acknowledge:
    parameters:
      - name: id
        in: path
        required: true
        description: Finding id (source:entry-id, e.g. crtsh:12345)
        schema: { type: string }
    post:
      operationId: acknowledgeCTFinding
      summary: Acknowledge a CT finding (idempotent; audited as ct.finding.acknowledge)
      description: >-
        Acknowledged findings are never re-notified by a later scan. Revokes
        nothing.
      tags: [CT Findings]
      responses:
        "200":
          description: The finding, now acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CTFinding"
        "403":
          description: Caller may not triage CT findings (pki-admin, pki-operator, or the ops:write scope); audited as denied
        "404":
          description: Unknown finding, or one that belongs to another tenant
        "503":
          description: CT findings store unavailable

  /ct/findings/{id}/known-issuer:
    parameters:
      - name: id
        in: path
        required: true
        description: Finding id (source:entry-id, e.g. crtsh:12345)
        schema: { type: string }
    post:
      operationId: markCTFindingKnownIssuer
      summary: Mark a CT finding as issued by a known issuer (idempotent; audited as ct.finding.known_issuer)
      description: >-
        Resolves this one finding only; it does not allow-list the issuer for
        future findings. Revokes nothing.
      tags: [CT Findings]
      responses:
        "200":
          description: The finding, now known_issuer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CTFinding"
        "403":
          description: Caller may not triage CT findings; audited as denied
        "404":
          description: Unknown finding, or one that belongs to another tenant
        "503":
          description: CT findings store unavailable

  /targets:
    get:
      operationId: listManagedTargets
      summary: List managed targets (tenant-scoped)
      tags: [Targets]
      responses:
        "200":
          description: Managed target list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedTarget"
        "503":
          description: Managed target store unavailable
    post:
      operationId: createManagedTarget
      summary: Create a managed target, including its renewal policy (method + threshold)
      tags: [Targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, host]
              properties:
                name: { type: string }
                host: { type: string }
                discovery_mode: { type: string, enum: [agent, network, cloud, winrm, none] }
                install_mode: { type: string, enum: [agent, ssh, f5, citrix, k8s, iis, sqlserver, rdp, exchange, keychain, cloud, acme, plugin] }
                renewal_method: { type: string, enum: [acme, est, scep, manual] }
                renewal_threshold_days: { type: integer, minimum: 0, maximum: 365, description: "1 to 365; 0 or omitted means use the RENEWAL_THRESHOLD_DAYS env default" }
                plugin_id: { type: string, description: "Delivery plugin for install_mode=plugin (W20-20); required then, refused otherwise" }
                key_handling_mode: { type: string, enum: [client_csr, hub_generated, hsm_resident_ca, macos_non_extractable], description: "W23-46: where the private key is created and held; omit to derive from install_mode. windows_cng and tpm are rejected (planned for v1.x). client_csr needs agent/acme/cloud, hub_generated needs ssh/f5/citrix/k8s/iis/sqlserver/rdp/plugin, macos_non_extractable needs keychain; hsm_resident_ca is a label accepted with any install_mode." }
                plugin_settings: { type: object, additionalProperties: { type: string }, description: "The plugin's target_schema values; no secrets" }
                credential_ref: { type: string }
                schedule: { type: string }
                install_server_type: { type: string }
                install_cert_path: { type: string }
                install_key_path: { type: string }
                install_reload_method: { type: string }
                verify_host_port: { type: string, description: "Optional host:port that scheduled renewals dial to verify the served leaf after install; default <host>:443." }
                ssh_host_key: { type: string, description: "Operator-confirmed SSH host key pin in authorized_keys format (W24-09); only for install_mode ssh or keychain. Obtain and confirm it via POST /targets/hostkey. Empty falls back to the credential's host_public_key. A later dial seeing a different key is refused (audit target.hostkey.mismatch)." }
                auto_renew: { type: boolean }
      responses:
        "201":
          description: Created target
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ManagedTarget"
        "400":
          description: >-
            Invalid request body, mode enum, renewal_threshold_days,
            verify_host_port (loopback and link-local are refused), or a
            credential_ref / plugin_id that does not exist
        "403":
          description: >-
            Arming key egress (auto_renew, credential_ref, plugin_id, or the
            install profile of an armed target) needs certificate.renew, and
            credential_ref needs pki-admin; the refusal is audited
        "503":
          description: Managed target store unavailable

  /targets/hostkey:
    post:
      operationId: probeTargetHostKey
      summary: Observe an SSH host's host key for operator confirmation (W24-09)
      description: >-
        Dials host:port without authenticating (no credential is used) through
        the egress policy and returns the key the host presents. The operator
        confirms the fingerprint and submits ssh_host_key on target creation.
      tags: [Targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
      responses:
        "200":
          description: Observed host key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      host: { type: string }
                      port: { type: integer }
                      algorithm: { type: string, example: ssh-ed25519 }
                      ssh_host_key: { type: string, description: "authorized_keys format" }
                      fingerprint_sha256: { type: string, example: "SHA256:..." }
        "400":
          description: Missing or forbidden host (loopback/link-local) or bad port
        "502":
          description: The host could not be reached or did not complete an SSH handshake

  /targets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getManagedTarget
      summary: Get a managed target
      tags: [Targets]
      responses:
        "200":
          description: Managed target
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ManagedTarget"
        "403":
          description: Forbidden (different tenant)
        "404":
          description: Target not found
    patch:
      operationId: updateManagedTarget
      summary: Update a managed target, including its renewal policy (method + threshold)
      tags: [Targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                host: { type: string }
                discovery_mode: { type: string, enum: [agent, network, cloud, winrm, none] }
                install_mode: { type: string, enum: [agent, ssh, f5, citrix, k8s, iis, sqlserver, rdp, exchange, keychain, cloud, acme, plugin] }
                renewal_method: { type: string, enum: [acme, est, scep, manual] }
                renewal_threshold_days: { type: integer, minimum: 0, maximum: 365, description: "1 to 365; 0 clears the override, reverting to the env default" }
                plugin_id: { type: string, description: "Delivery plugin for install_mode=plugin (W20-20); required then, refused otherwise" }
                key_handling_mode: { type: string, enum: [client_csr, hub_generated, hsm_resident_ca, macos_non_extractable], description: "W23-46: where the private key is created and held; omit to derive from install_mode. windows_cng and tpm are rejected (planned for v1.x). client_csr needs agent/acme/cloud, hub_generated needs ssh/f5/citrix/k8s/iis/sqlserver/rdp/plugin, macos_non_extractable needs keychain; hsm_resident_ca is a label accepted with any install_mode." }
                plugin_settings: { type: object, additionalProperties: { type: string }, description: "The plugin's target_schema values; no secrets" }
                credential_ref: { type: string }
                schedule: { type: string }
                install_server_type: { type: string }
                install_cert_path: { type: string }
                install_key_path: { type: string }
                install_reload_method: { type: string }
                verify_host_port: { type: string, description: "Optional host:port that scheduled renewals dial to verify the served leaf after install; default <host>:443." }
                ssh_host_key: { type: string, description: "Operator-confirmed SSH host key pin in authorized_keys format (W24-09); only for install_mode ssh or keychain. Obtain and confirm it via POST /targets/hostkey. Empty falls back to the credential's host_public_key. A later dial seeing a different key is refused (audit target.hostkey.mismatch)." }
                auto_renew: { type: boolean }
      responses:
        "200":
          description: Updated target
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ManagedTarget"
        "400":
          description: >-
            Invalid mode enum, renewal_threshold_days, verify_host_port, or a
            credential_ref / plugin_id that does not exist
        "403":
          description: >-
            Forbidden (different tenant), or the change arms or re-aims key
            egress without the authority it needs:
            certificate.renew (pki-admin for credential_ref)
        "404":
          description: Target not found
    delete:
      operationId: deleteManagedTarget
      summary: Delete a managed target
      tags: [Targets]
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden (different tenant)
        "404":
          description: Target not found

  /targets/privilege-bundle:
    get:
      operationId: getPrivilegeBundleForProfile
      summary: Privilege bundle from an install profile, before the target exists (setup wizard)
      description: Same payload as the per-target route, built from the server_type, cert_path and key_path query parameters.
      tags: [Targets]
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [helper, nopasswd, password], default: helper } }
        - { name: user, in: query, description: Account name for the drop-in (default kkscan), schema: { type: string } }
        - { name: server_type, in: query, schema: { type: string, enum: [nginx, apache, haproxy, tomcat] } }
        - { name: cert_path, in: query, schema: { type: string } }
        - { name: key_path, in: query, schema: { type: string } }
      responses:
        "200":
          description: The privilege bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PrivilegeBundle"
        "400": { description: Unknown mode, invalid user, or an unusable path }
        "401": { description: Unauthenticated }
        "403": { description: Missing discovery or certificate.renew permission, or a different tenant }

  /targets/{id}/privilege-bundle:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTargetPrivilegeBundle
      summary: Sudoers drop-in, helper script with sha256, and customer checklist for a target
      description: >-
        Requires discovery or certificate.renew permission on the target's tenant.
        Audited as target.privilege_bundle.read. The helper text is byte-identical
        to the one the hub verifies by sha256 before first use.
      tags: [Targets]
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [helper, nopasswd, password], default: helper } }
        - { name: user, in: query, description: Account name for the drop-in (default kkscan), schema: { type: string } }
        - name: scan_paths
          in: query
          description: >-
            Comma-separated directories or files a scan reads in addition to the
            target's install paths (for example /opt/ssl). The raw (nopasswd)
            allowlist covers only the install directory and these; at most 16.
          schema: { type: string }
      responses:
        "200":
          description: The privilege bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PrivilegeBundle"
        "400": { description: Unknown mode, invalid user, or an unusable path }
        "401": { description: Unauthenticated }
        "403": { description: Missing discovery or certificate.renew permission, or a different tenant }
        "404": { description: Target not found }

  /targets/{id}/unblock:
    post:
      operationId: unblockTarget
      summary: Clear a rollback block after checking the host (discovery.manage or certificate.renew)
      description: >-
        A failed rollback blocks the target so the scheduler stops pushing to a
        host in an unknown state. An operator who has checked the host clears it
        here. A privilege block is not cleared by this route: it follows the
        credential and the latest scan.
      tags: [Targets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Unblocked }
        "401": { description: Unauthenticated }
        "403": { description: Permission required, or the target belongs to another tenant }
        "404": { description: Target not found }
        "503": { description: Target state storage unavailable }

  /targets/{id}/preflight:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: preflightTarget
      summary: Test an ssh target's credential and privilege (per-capability rows with fixes)
      description: >-
        Dials with the pinned host key (8 s dial cap), authenticates, and runs the
        privilege preflight for role scan and, when auto_renew is set, role install.
        Needs discovery or certificate.renew permission on the target's tenant.
        Stores the secret-free report on the target and audits target.privilege.preflight.
        A failed dial is reported as a failing ssh_auth row, not an error status.
      tags: [Targets]
      responses:
        "200":
          description: Preflight report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PrivilegePreflight"
        "400": { description: Not an ssh target, no usable credential, or invalid privilege settings }
        "401": { description: Unauthenticated }
        "403": { description: Missing permission or different tenant }
        "404": { description: Target not found }
        "503": { description: Credential or preflight storage unavailable }
    get:
      operationId: getTargetPreflight
      summary: The last stored privilege preflight report for a target
      tags: [Targets]
      responses:
        "200":
          description: Last report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PrivilegePreflight"
        "403": { description: Missing permission or different tenant }
        "404": { description: Target not found, or no preflight has run }

  /targets/{id}/endpoints:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getManagedTargetEndpoints
      summary: Resolve a managed target's declared host against scanned/agent-reported endpoints
      tags: [Targets]
      responses:
        "200":
          description: Endpoint matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedTargetEndpointMatch"
        "403":
          description: Forbidden (different tenant)
        "404":
          description: Target not found

  /targets/{id}/bindings:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTargetBindings
      summary: List the certificates bound to a managed target for auto-renew (W27-02)
      tags: [Targets]
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CertTargetBinding"
        "403":
          description: Forbidden (different tenant)
        "404":
          description: Target not found
        "503":
          description: Binding store unavailable
    post:
      operationId: createTargetBinding
      summary: Bind a certificate to a managed target for auto-renew (W27-02)
      description: >-
        Authorizes the renewal scheduler to renew this certificate onto this
        target and push its private key there. Needs certificate.renew on top
        of discovery.manage, and the target's tenant must be able to see the
        certificate's CA. Audited as target.update ("binding.create cert=<fp>").
      tags: [Targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert_fingerprint]
              properties:
                cert_fingerprint: { type: string, description: "SHA-256 fingerprint (64 hex)" }
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CertTargetBinding"
        "400":
          description: Malformed fingerprint or body
        "403":
          description: Forbidden (different tenant, certificate.renew missing, or the target's tenant cannot use the certificate's CA)
        "404":
          description: Target or certificate not found
        "409":
          description: Already bound
        "503":
          description: Binding store unavailable

  /targets/{id}/bindings/{fingerprint}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: fingerprint
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteTargetBinding
      summary: Unbind a certificate from a managed target (W27-02)
      description: >-
        Stops auto-renewal of the certificate onto the target. Audited as
        target.update ("binding.delete cert=<fp>").
      tags: [Targets]
      responses:
        "204":
          description: Unbound
        "400":
          description: Malformed fingerprint
        "403":
          description: Forbidden (different tenant)
        "404":
          description: Target or binding not found
        "503":
          description: Binding store unavailable

  /target-groups:
    get:
      operationId: listTargetGroups
      summary: List target groups and their renewal thresholds (tenant-scoped, W27-04)
      tags: [Targets]
      responses:
        "200":
          description: Groups visible to the caller's tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TargetGroup"
        "503":
          description: Group store unavailable

  /target-groups/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: putTargetGroup
      summary: Create or replace a target group (pki-admin, audited as target.update, W27-04)
      description: >-
        Sets the group's renewal threshold and replaces its membership. The
        scheduler re-reads groups every tick, so a change applies on the next
        scan with no restart. A target already in another group is moved.
        Members must belong to the caller's tenant.
      tags: [Targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [renewal_threshold_days]
              properties:
                renewal_threshold_days: { type: integer, minimum: 1, maximum: 398 }
                target_ids: { type: array, items: { type: string } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TargetGroup"
        "400":
          description: Threshold outside 1..398, malformed name, or an unknown or other-tenant target id
        "503":
          description: Group store unavailable
    delete:
      operationId: deleteTargetGroup
      summary: Delete a target group (pki-admin, audited as target.update, W27-04)
      tags: [Targets]
      responses:
        "204":
          description: Deleted; former members fall back to their own threshold or the default
        "404":
          description: Group not found
        "503":
          description: Group store unavailable

  /target-policy:
    get:
      operationId: getTargetPolicy
      summary: Effective renewal threshold per target, with its source (W27-04)
      tags: [Targets]
      responses:
        "200":
          description: One row per target visible to the caller's tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TargetPolicyRow"
        "503":
          description: Store unavailable

  # ── Search ──────────────────────────────────────────────────────────────────

  /search:
    get:
      operationId: search
      summary: Full-text search across certs, CAs, templates, endpoints
      tags: [Search]
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string}
                        id: {type: string}
                        label: {type: string}
                        description: {type: string}
                        url: {type: string}

  # ── Satellite Agents ────────────────────────────────────────────────────────

  /agents:
    get:
      operationId: listAgents
      summary: List registered satellite agents
      tags: [Agents]
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentInfo"

  /agent/register:
    post:
      operationId: registerAgent
      summary: Register a satellite agent (enrollment evidence required)
      description: >-
        Enrollment is closed by default (W5-07, W33-24). Present exactly one
        kind of evidence: a single-use, 24h enrollment token minted by an admin
        (`enrollment_token` or `X-Enrollment-Token`; wins if both are sent), or
        a configured enrollment secret (`enrollment_secret` or
        `X-Enrollment-Secret`). The legacy open mode is opt-in via
        `KRYPTKEEPER_AGENT_OPEN_REGISTRATION=true`. No evidence answers 401;
        invalid, expired, used or revoked evidence answers a generic 403.
        Audited as `agent.register` (the detail carries the token id, never the
        token). Rate limited per client IP (429).
      tags: [Agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                type:
                  type: string
                  enum: [linux, mac, windows]
                enrollment_token: {type: string, description: "W29-06 single-use token (preferred); or X-Enrollment-Token header. When present, the shared secret is not tried."}
                enrollment_secret: {type: string, description: "Deprecated shared secret (transition path; startup warning); or X-Enrollment-Secret header"}
              required: [name]
      responses:
        "201":
          description: Credentials issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: {type: string}
                  token: {type: string}
        "401":
          description: No enrollment credential presented
        "403":
          description: Enrollment refused (wrong, expired, revoked or already-redeemed evidence)
        "429":
          description: Rate limit exceeded

  /agent/enrollment-tokens:
    post:
      operationId: mintAgentEnrollmentToken
      summary: Mint a single-use agent enrollment token (admin only)
      description: >-
        W29-06: returns a hashed-at-rest, single-use token (default 24h, max
        7d) that POST /agent/register redeems via the enrollment_token body
        field or X-Enrollment-Token header. The secret appears only in this
        201 response (Cache-Control: no-store). Audited as agent.token_mint.
        W33-24: the token belongs to the caller's tenant.
      tags: [Agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, maxLength: 128}
                ttl_seconds: {type: integer, minimum: 1, maximum: 604800, description: "Defaults to 86400"}
      responses:
        "201":
          description: Token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: string}
                      token: {type: string}
                      expires_at: {type: string, format: date-time}
                      label: {type: string}
        "400":
          description: Invalid body or ttl_seconds out of range
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
    get:
      operationId: listAgentEnrollmentTokens
      summary: List agent enrollment tokens (admin only; never includes the secret)
      description: >-
        Tenant-scoped (W33-24): a tenant admin sees only its own tenant's
        tokens. redeemed_agent_id names the agent a redeemed token enrolled.
      tags: [Agents]
      responses:
        "200":
          description: Enrollment tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        label: {type: string}
                        created_by: {type: string}
                        created_at: {type: string, format: date-time}
                        expires_at: {type: string, format: date-time}
                        redeemed_at: {type: string}
                        redeemed_agent_id: {type: string}
                        revoked_at: {type: string}
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)

  /agent/enrollment-tokens/{id}:
    delete:
      operationId: revokeAgentEnrollmentToken
      summary: Revoke an unredeemed enrollment token (admin only)
      description: Audited as agent.token_revoke.
      tags: [Agents]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "204":
          description: Token revoked
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
        "404":
          description: Token not found (a token of another tenant is reported identically)
        "409":
          description: Token already redeemed or revoked

  /agent/heartbeat:
    post:
      operationId: agentHeartbeat
      summary: Agent liveness ping (X-Agent-ID + X-Agent-Token headers)
      tags: [Agents]
      security: []
      parameters:
        - {in: header, name: X-Agent-ID, required: true, schema: {type: string}}
        - {in: header, name: X-Agent-Token, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
        "401":
          description: Invalid credentials

  /agent/inventory:
    post:
      operationId: submitAgentInventory
      summary: Submit discovered certificate inventory
      tags: [Agents]
      security: []
      parameters:
        - {in: header, name: X-Agent-ID, required: true, schema: {type: string}}
        - {in: header, name: X-Agent-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                certs:
                  type: array
                  items:
                    type: object
                    properties:
                      fingerprint: {type: string}
                      subject: {type: string}
                      issuer: {type: string}
                      not_before: {type: string, format: date-time}
                      not_after: {type: string, format: date-time}
                      source: {type: string}
                      auto_renewable: {type: boolean}
                host_scanned:
                  type: boolean
                  description: >-
                    W34-09 marker that the agent ran the host pass. A pre-W34
                    agent omits it and every field below; the hub then records
                    posture as unknown, not standard.
                privilege_mode: { type: string, enum: [none, nopasswd, helper], description: "KRYPTKEEPER_PRIVILEGE_MODE the walk ran with; password mode is not offered to the agent." }
                scan_user: { type: string }
                unreadable_paths:
                  type: array
                  description: Paths the walk could not open for lack of privilege (capped agent-side at 50).
                  items:
                    type: object
                    properties:
                      path: { type: string }
                      error: { type: string }
                unreadable_total: { type: integer, description: The true count when unreadable_paths was capped. }
                files:
                  type: array
                  description: >-
                    Certificate, key and keystore files with ownership. Keys are
                    described by stat only; no key bytes are ever sent.
                  items:
                    type: object
                    properties:
                      path: { type: string }
                      kind: { type: string, enum: [pem, jks, p12, key] }
                      owner: { type: string }
                      group: { type: string }
                      mode: { type: string, description: Octal permission bits. }
                      uid: { type: integer, description: "-1 when unknown." }
                      gid: { type: integer }
                      cert_fingerprints: { type: array, items: { type: string } }
                listeners:
                  type: array
                  description: Listening TCP sockets with their owning process (the W34-07 shape); the command line is never sent.
                  items:
                    type: object
                    properties:
                      port: { type: integer }
                      pid: { type: integer }
                      uid: { type: integer, description: "-1 when the owner could not be read." }
                      gid: { type: integer }
                      user: { type: string }
                      exe: { type: string }
                      comm: { type: string }
                      cwd: { type: string }
                      tech: { type: string }
                      config_refs: { type: array, items: { type: string } }
                      app_dirs: { type: array, items: { type: string } }
                config_refs:
                  type: object
                  description: Paths a service's configuration names, mapped to the technology that uses them.
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: integer}

  /trust-bundles:
    get:
      operationId: listTrustBundles
      summary: List approved trust bundles with per-host status counts (W40-03)
      tags: [Agents]
      responses:
        "200":
          description: Trust bundles, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrustBundleSummary"
        "401":
          description: Unauthenticated
        "403":
          description: Instance-wide setting, platform super-admin required when multi-tenancy is on
        "503":
          description: Trust bundle store unavailable
    post:
      operationId: proposeTrustBundle
      summary: Propose pushing CA certificates to agents' OS trust stores (dual control, Critical)
      description: >-
        Queues the bundle in the approval queue; nothing reaches an agent until
        a different approver approves it (proposer is never the approver). The
        hub refuses bundles holding any block other than CERTIFICATE, any
        certificate that is not a CA, and (for `add`) any expired or not yet
        valid certificate. A `remove` bundle that names the root of a hub CA
        that issued live managed certificates returns `warnings`, which the
        approver also sees. Targets are resolved now: a union of `agent_ids`,
        `agent_types` and `all`. An agent applies the bundle only if its own
        configuration opts in (`KRYPTKEEPER_TRUST_STORE_PUSH=true`).
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, action, cert_pem, selector]
              properties:
                name: {type: string, maxLength: 120}
                action: {type: string, enum: [add, remove]}
                cert_pem: {type: string, description: "PEM CA certificates only; at most 20"}
                selector:
                  type: object
                  properties:
                    agent_ids: {type: array, items: {type: string}}
                    agent_types: {type: array, items: {type: string, enum: [linux, mac, windows]}}
                    all: {type: boolean}
                rationale: {type: string}
      responses:
        "202":
          description: Pending approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      action_id: {type: string}
                      status: {type: string}
                      targets: {type: integer}
                      warnings: {type: array, items: {type: string}}
        "400":
          description: Not a CA bundle, expired certificate, empty or unknown selector
        "401":
          description: Unauthenticated
        "403":
          description: Role may not propose, or platform super-admin required under multi-tenancy
        "503":
          description: Approval queue unavailable

  /trust-bundles/{id}:
    get:
      operationId: getTrustBundle
      summary: One trust bundle with its per-host result (applied, refused_not_opted_in, failed, pending)
      tags: [Agents]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: Bundle and per-host status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bundle:
                        $ref: "#/components/schemas/TrustBundleSummary"
                      hosts:
                        type: array
                        items:
                          $ref: "#/components/schemas/TrustHostStatus"
        "401":
          description: Unauthenticated
        "404":
          description: Unknown bundle

  /agent/trust-tasks:
    get:
      operationId: getAgentTrustTasks
      summary: Fetch trust bundles queued for this agent (X-Agent-ID + X-Agent-Token headers)
      description: >-
        Bundles that target this agent and have no applied result. The agent
        acts only if it opted in locally; otherwise it reports
        refused_not_opted_in.
      tags: [Agents]
      security: []
      parameters:
        - {in: header, name: X-Agent-ID, required: true, schema: {type: string}}
        - {in: header, name: X-Agent-Token, required: true, schema: {type: string}}
      responses:
        "200":
          description: Trust tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        bundle_id: {type: string}
                        name: {type: string}
                        action: {type: string, enum: [add, remove]}
                        cert_pem: {type: string}
        "401":
          description: Bad agent credentials

  /agent/trust-result:
    post:
      operationId: submitAgentTrustResult
      summary: Report what the agent did with a trust bundle (X-Agent-ID + X-Agent-Token headers)
      tags: [Agents]
      security: []
      parameters:
        - {in: header, name: X-Agent-ID, required: true, schema: {type: string}}
        - {in: header, name: X-Agent-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle_id, outcome]
              properties:
                bundle_id: {type: string}
                outcome: {type: string, enum: [applied, refused_not_opted_in, failed]}
                detail: {type: string, maxLength: 1000}
      responses:
        "200":
          description: Recorded
        "400":
          description: Missing credentials or unknown outcome
        "401":
          description: Bad agent credentials
        "404":
          description: The bundle does not target this agent

  /agent/renewal-result:
    post:
      operationId: submitAgentRenewalResult
      summary: Report the outcome of an agent-performed renewal (X-Agent-ID + X-Agent-Token headers)
      tags: [Agents]
      security: []
      parameters:
        - {in: header, name: X-Agent-ID, required: true, schema: {type: string}}
        - {in: header, name: X-Agent-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprint: {type: string}
                outcome: {type: string, enum: [installed, installed_verified, failed]}
                rolled_back: {type: boolean}
                reported_at: {type: string, format: date-time}
      responses:
        "200":
          description: Recorded

  /agent/tasks:
    get:
      operationId: getAgentTasks
      summary: Fetch pending renewal tasks
      tags: [Agents]
      security: []
      parameters:
        - {in: header, name: X-Agent-ID, required: true, schema: {type: string}}
        - {in: header, name: X-Agent-Token, required: true, schema: {type: string}}
      responses:
        "200":
          description: Renewal tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: {type: string}
                        fingerprint: {type: string}
                        subject: {type: string}
                        action: {type: string, enum: [renew, install]}
                        not_after: {type: string, format: date-time}
                        created_at: {type: string, format: date-time}

  /agents/{id}:
    delete:
      operationId: removeAgent
      summary: Remove an agent and revoke its token (admin only)
      description: >-
        W24-13: deletes the agent and its inventory, endpoints, tasks and
        results. The agent token lives in the agent row, so the agent's next
        call is rejected with 401. Audited as agent.remove.
      tags: [Agents]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "204":
          description: Agent removed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
        "404":
          description: Agent not found

  /agents/{id}/tasks:
    get:
      operationId: getAgentTaskResults
      summary: An agent's queued renewal tasks and reported results (admin view)
      description: >-
        W19-26: today the audit log is the only durable evidence of what an
        agent was asked to do and what happened -- this exposes the same
        history resultsFor already tracked internally. Authorized the same
        way as GET /agents (bearer JWT); agents carry no tenant column in the
        schema, so there is no tenant dimension to scope this by.
      tags: [Agents]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: Queued tasks and reported results, merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: {type: string}
                        fingerprint: {type: string}
                        action: {type: string}
                        identifiers: {type: array, items: {type: string}}
                        status: {type: string, enum: [queued, completed]}
                        outcome: {type: string}
                        detail: {type: string}
                        created_at: {type: string, format: date-time}
                        completed_at: {type: string, format: date-time}
        "401":
          description: Unauthorized
        "404":
          description: Agent not found

  /agents/{id}/inventory:
    get:
      operationId: getAgentInventory
      summary: What one agent discovered, certificates and files (admin view)
      description: >-
        W24-45: the certificates the agent last pushed (the fields it sent: no
        PEM, no key) and the files its host pass flagged (non-standard posture
        or findings; a key file is a path with no bytes), with counts of every
        statted file by posture. Pages by limit and offset, applied to each list
        separately. Authorized like GET /agents/{id}/tasks: agents carry no
        tenant column (D-203), so under multi-tenancy only a platform
        super-admin may read it; a tenant-scoped principal gets 403, audited.
        Audited as agent.inventory.
      tags: [Agents]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: One page of the agent's inventory
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, certificates, total_certificates, files, total_files, files_known, limit, offset]
                properties:
                  agent_id: {type: string}
                  certificates:
                    type: array
                    items:
                      type: object
                      required: [fingerprint, subject, issuer, not_before, not_after, source, auto_renewable]
                      properties:
                        fingerprint: {type: string}
                        subject: {type: string}
                        issuer: {type: string}
                        not_before: {type: string, format: date-time}
                        not_after: {type: string, format: date-time}
                        source: {type: string, description: "Where the agent found it: a file path or a store such as jks:/path."}
                        auto_renewable: {type: boolean}
                        dns_names: {type: array, items: {type: string}}
                  total_certificates: {type: integer}
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, kind, posture]
                      properties:
                        path: {type: string}
                        kind: {type: string, enum: [pem, jks, p12, key, config]}
                        owner: {type: string}
                        group: {type: string}
                        mode: {type: string}
                        posture: {type: string}
                        service_tech: {type: string}
                        findings: {type: array, items: {type: string}}
                  total_files: {type: integer}
                  file_posture_counts:
                    type: object
                    additionalProperties: {type: integer}
                  files_known:
                    type: boolean
                    description: False when the agent has sent no host pass; its files are unknown, not empty.
                  limit: {type: integer}
                  offset: {type: integer}
        "400":
          description: Bad limit or offset
        "401":
          description: Unauthorized
        "403":
          description: Tenant-scoped principals cannot read agent inventory (agents have no tenant)
        "404":
          description: Agent not found

  /admin/access-review/report:
    get:
      operationId: getAccessReviewReport
      summary: Access review report - principals, roles, keys, last use, dormant accounts, role changes
      description: >-
        Read-only. Joins users, API keys and the audit trail. Needs the
        audit.read permission (admin or auditor). With multi-tenancy on, a
        tenant-scoped caller sees only their own tenant's principals and
        role changes; an unscoped super-admin sees every tenant.
      tags: [Governance]
      parameters:
        - { name: period_days, in: query, schema: { type: integer, minimum: 1, maximum: 3660, default: 90 }, description: "Length of the role-change window ending now." }
        - { name: dormant_days, in: query, schema: { type: integer, minimum: 1, maximum: 3650 }, description: "Overrides ACCESS_REVIEW_DORMANT_DAYS (default 90)." }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AccessReviewReport" }
        "400": { description: Bad period_days or dormant_days }
        "401": { description: Unauthenticated }
        "403": { description: Requires audit.read }

  /admin/access-review/campaigns:
    get:
      operationId: listAccessReviewCampaigns
      summary: List access recertification campaigns visible to the caller
      description: Needs audit.read. A tenant-scoped caller sees only their tenant's campaigns.
      tags: [Governance]
      responses:
        "200":
          description: Campaigns (without entries)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AccessReviewCampaign" }
        "401": { description: Unauthenticated }
        "403": { description: Requires audit.read }
    post:
      operationId: openAccessReviewCampaign
      summary: Open a campaign, snapshotting the access review report (admin)
      description: >-
        Freezes the current access review report (scoped to the caller's
        tenant) as the campaign's entries. An unscoped super-admin's campaign
        is instance-wide (tenant "*").
      tags: [Governance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                period_days: { type: integer, minimum: 1, maximum: 3660, default: 90 }
      responses:
        "201":
          description: Campaign opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AccessReviewCampaign" }
        "400": { description: Invalid name or period_days }
        "401": { description: Unauthenticated }
        "403": { description: Administrator required }

  /admin/access-review/campaigns/{id}:
    get:
      operationId: getAccessReviewCampaign
      summary: One campaign with each entry's decision
      tags: [Governance]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AccessReviewCampaign" }
        "401": { description: Unauthenticated }
        "403": { description: Requires audit.read }
        "404": { description: "Unknown campaign, or another tenant's" }

  /admin/access-review/campaigns/{id}/decisions:
    post:
      operationId: decideAccessReviewEntry
      summary: Record keep / revoke / modify for one entry (admin)
      description: >-
        Revoke and modify execute the same changes as DELETE /api-keys/{kid}
        and PATCH /users/{id} (and are audited under those action names).
        Role and source come from the stored snapshot. SCIM-managed users are
        read-only here (keep only). A revoke of an approver-capable user is
        held (202) until a different human, never the bootstrap token, repeats
        it; the held decision counts as undecided at close.
      tags: [Governance]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_id, decision]
              properties:
                entry_id: { type: string }
                decision: { type: string, enum: [keep, revoke, modify] }
                new_role: { type: string, description: "Required for modify (users only)." }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Decision recorded and executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AccessReviewEntry" }
        "202":
          description: First revoke of an approver-capable user is held for a second reviewer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AccessReviewEntry" }
        "400": { description: "Bad decision, missing or unknown new_role, or modify on an API key" }
        "401": { description: Unauthenticated }
        "403": { description: "Not an administrator, same reviewer twice, bootstrap as second reviewer, or role above the caller" }
        "404": { description: "Unknown campaign, entry, user or key" }
        "409": { description: "Campaign closed, entry already decided, or SCIM-managed user" }

  /admin/access-review/campaigns/{id}/close:
    post:
      operationId: closeAccessReviewCampaign
      summary: Close a campaign and record the export hash (admin)
      description: >-
        Refuses (409) while entries are undecided unless allow_undecided is
        set; held revokes count as undecided. Writes access_review.close with
        the SHA-256 of the CSV export.
      tags: [Governance]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_undecided: { type: boolean }
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AccessReviewCampaign" }
        "401": { description: Unauthenticated }
        "403": { description: Administrator required }
        "404": { description: Unknown campaign }
        "409": { description: "Entries undecided, or already closed" }

  /admin/access-review/campaigns/{id}/export:
    get:
      operationId: exportAccessReviewCampaign
      summary: Deterministic CSV export of a campaign
      description: >-
        Byte-identical to the content hashed at close. CSV only; PDF export
        (UC-F04) is not available yet.
      tags: [Governance]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [csv], default: csv } }
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Unsupported format }
        "401": { description: Unauthenticated }
        "403": { description: Requires audit.read }
        "404": { description: Unknown campaign }

  /auth/breakglass/activations:
    post:
      operationId: requestBreakGlassActivation
      summary: Request a break-glass window (first holder)
      description: >-
        Caller must be an interactive session of an active user holding the
        custom role `break-glass` (an administrator creates it once, with the
        benign permission certificate.read, because the roles API needs at
        least one permission). The bootstrap token and API keys are refused.
        Only one pending or active activation exists at a time. A pending
        request lapses after 15 minutes.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Pending activation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassActivation" }
        "400": { description: Reason missing or too long }
        "401": { description: Unauthenticated }
        "403": { description: "Not a break-glass holder, or bootstrap token / API key" }
        "409": { description: An activation is already pending or active }

  /auth/breakglass/activations/{id}/confirm:
    post:
      operationId: confirmBreakGlassActivation
      summary: Confirm a pending request (a different holder); opens a 4 h window
      tags: [Auth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Active for 4 hours; audited as breakglass.activate naming both holders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassActivation" }
        "401": { description: Unauthenticated }
        "403": { description: "Not a holder, or the same human as the requester" }
        "404": { description: Unknown activation }
        "409": { description: Activation is not pending }
        "410": { description: The request lapsed (older than 15 minutes) }

  /auth/breakglass/status:
    get:
      operationId: getBreakGlassStatus
      summary: Whether a break-glass window is open
      description: Holders and administrators. With multi-tenancy on, administrators must be unscoped super-admins.
      tags: [Auth]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [active, open_reviews]
                    properties:
                      active: { type: boolean }
                      activation: { $ref: "#/components/schemas/BreakGlassActivation" }
                      open_reviews: { type: integer }
        "401": { description: Unauthenticated }
        "403": { description: Neither a holder nor an administrator }

  /auth/breakglass/reviews:
    get:
      operationId: listBreakGlassReviews
      summary: After-action review tasks opened by break-glass use
      tags: [Auth]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, completed] } }
      responses:
        "200":
          description: Reviews, each with a derived overdue flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BreakGlassReview" }
        "400": { description: Bad status filter }
        "401": { description: Unauthenticated }
        "403": { description: Neither a holder nor an administrator }

  /auth/breakglass/reviews/{id}/complete:
    post:
      operationId: completeBreakGlassReview
      summary: Complete an after-action review (an administrator who was not involved)
      description: >-
        The reviewer must be a pki-admin (not the bootstrap token) who is
        neither a holder of the reviewed activation nor an actor of the
        reviewed use. Audited as breakglass.review.
      tags: [Auth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [justified, unjustified] }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Completed review
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BreakGlassReview" }
        "400": { description: Bad outcome or notes }
        "401": { description: Unauthenticated }
        "403": { description: Not an eligible reviewer }
        "404": { description: Unknown review }
        "409": { description: Already completed }

  /auth/breakglass/login:
    post:
      operationId: breakGlassLogin
      summary: Local login for the flagged break-glass account while the IdP is unavailable
      description: >-
        Only answers when APP_AUTH_BREAKGLASS_EMAIL names the configured local
        login user (otherwise 503). Never contacts the IdP. Every successful
        login is audited as auth.breakglass_login, raises the breakglass.used
        alert and opens or extends a 24 h review task (scope local-login).
        Rate limited separately from /auth/login (5 per minute per client).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session token, same shape as /auth/login
        "401": { description: Invalid credentials }
        "403": { description: "Not the break-glass account, or account inactive" }
        "429": { description: Rate limited }
        "503": { description: Break-glass login is not configured }

  /pending-actions/{id}/override:
    post:
      operationId: overridePendingAction
      summary: Execute a pending action whose approval quorum cannot be met (break-glass)
      description: >-
        Requires a live two-holder break-glass window and a caller who is one
        of its two holders (an interactive session; the bootstrap token and
        API keys are refused). Proposer != approver and tenant scope still
        apply: a holder cannot override their own proposal or an action
        outside their tenant (404). Refused with 409 while enough eligible
        approvers remain for the normal flow. The use is audited as
        approval.override naming both holders, raises breakglass.used and
        opens a 24 h review task.
      tags: [Approvals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [approved] }
                      overridden: { type: boolean }
                      result: { type: object }
        "400": { description: Reason missing or too long }
        "401": { description: Unauthenticated }
        "403": { description: "No live window, caller is not one of its holders, bootstrap token / API key, or own proposal" }
        "404": { description: "Unknown action, or another tenant's" }
        "409": { description: "Not pending, or quorum is still reachable" }
        "503": { description: "Execution failed, or the use could not be recorded (nothing executed)" }

  /est/users:
    get:
      operationId: listESTUsers
      summary: List EST HTTP Basic users (pki-admin; W26-07)
      description: >-
        Users stored through this API. Never returns a hash or password.
        Users defined in KRYPTKEEPER_EST_USERS_FILE are not listed; the users
        file wins on a name clash, and a stored user that a file user shadows
        reports shadowed_by_file.
      tags: [EST]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ESTUser" }
        "403":
          description: Caller is not pki-admin
    post:
      operationId: createESTUser
      summary: Create an EST Basic user with a generated password (pki-admin)
      description: >-
        The server generates the password (24 characters) and returns it only
        in this response (Cache-Control no-store); admin-chosen passwords are
        not accepted. Refused with 409 when the name is already stored or is
        defined in the users file (the users file wins on a name clash).
      tags: [EST]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, allowed_dns_suffixes]
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9._@-]{1,64}$", description: "No colon: it would break HTTP Basic parsing" }
                allowed_dns_suffixes: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: "Each starts with a dot, e.g. .devices.example.com" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ESTUserSecret" }
        "400":
          description: Invalid username or suffixes
        "403":
          description: Caller is not pki-admin
        "409":
          description: Already stored, or defined in the users file

  /est/users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getESTUser
      summary: Get one EST Basic user (pki-admin)
      tags: [EST]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ESTUser" }
        "404":
          description: No such stored user
    patch:
      operationId: updateESTUser
      summary: Disable, enable or re-suffix an EST Basic user (pki-admin)
      tags: [EST]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled: { type: boolean }
                allowed_dns_suffixes: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ESTUser" }
        "400":
          description: Nothing to change, or invalid suffixes
        "404":
          description: No such stored user
    delete:
      operationId: deleteESTUser
      summary: Delete an EST Basic user (pki-admin)
      tags: [EST]
      responses:
        "204":
          description: Deleted
        "404":
          description: No such stored user

  /est/users/{username}/rotate:
    post:
      operationId: rotateESTUserPassword
      summary: Replace an EST Basic user's password (pki-admin)
      description: The new password is returned once; the old one stops working immediately.
      tags: [EST]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New password, shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ESTUserSecret" }
        "404":
          description: No such stored user

  /est/labels:
    get:
      operationId: listESTLabels
      summary: List EST labels (pki-admin; W26-06)
      description: >-
        A label publishes a named EST endpoint, /.well-known/est/{label}/, bound
        to one certificate template. The bare /.well-known/est/ routes remain
        the default label. Allow EST on the bound template by listing the role
        protocol:est in its enrollment_permissions.enroll.
      tags: [EST]
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ESTLabel" }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
    post:
      operationId: createESTLabel
      summary: Create an EST label bound to a template (pki-admin)
      tags: [EST]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, template_id]
              properties:
                label: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$", description: "Not an EST operation name (cacerts, simpleenroll, simplereenroll, csrattrs, serverkeygen, fullcmc)" }
                template_id: { type: string }
                description: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ESTLabel" }
        "400": { description: "Invalid label, or the template does not exist" }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
        "409": { description: Label already exists }

  /est/labels/{label}:
    parameters:
      - name: label
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getESTLabel
      summary: Get one EST label (pki-admin)
      tags: [EST]
      responses:
        "200":
          description: The label
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ESTLabel" }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
        "404": { description: No such label }
    put:
      operationId: updateESTLabel
      summary: Rebind an EST label to another template (pki-admin)
      tags: [EST]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                label: { type: string, description: "Optional; must equal the path label" }
                template_id: { type: string }
                description: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated label
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ESTLabel" }
        "400": { description: "The template does not exist, or the body label differs from the path" }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
        "404": { description: No such label }
    delete:
      operationId: deleteESTLabel
      summary: Delete an EST label (pki-admin)
      tags: [EST]
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthenticated }
        "403": { description: Caller is not pki-admin }
        "404": { description: No such label }

  /cmp/credentials:
    post:
      operationId: createCMPCredential
      summary: Mint a CMP PBM shared secret or register a trust anchor (pki-admin; W26-09)
      description: >-
        kind "pbm" returns reference (the senderKID: openssl cmp -ref) and
        secret (openssl cmp -secret pass:); the secret appears only in this
        response. kind "trust_anchor" stores one CERTIFICATE; it is listed and
        revocable but NOT yet used to verify messages (enforced is false).
        allowed_dns_suffixes, when set, replaces the server-wide suffix binding
        for clients using this secret.
      tags: [CMP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [pbm, trust_anchor] }
                label: { type: string, maxLength: 200 }
                allowed_dns_suffixes: { type: array, maxItems: 20, items: { type: string }, description: "pbm only" }
                certificate_pem: { type: string, maxLength: 8192, description: "trust_anchor only; exactly one unexpired CERTIFICATE" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, kind, created_at]
                    properties:
                      id: { type: string }
                      kind: { type: string, enum: [pbm, trust_anchor] }
                      label: { type: string }
                      reference: { type: string, description: "pbm: the senderKID" }
                      secret: { type: string, description: "pbm: shown once" }
                      allowed_dns_suffixes: { type: array, items: { type: string } }
                      subject: { type: string, description: "trust_anchor" }
                      not_after: { type: string, format: date-time, description: "trust_anchor" }
                      cert_sha256: { type: string, description: "trust_anchor" }
                      enforced: { type: boolean, description: "trust_anchor: always false" }
                      created_at: { type: string, format: date-time }
        "400":
          description: Invalid request
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "409":
          description: Trust anchor already registered
        "503":
          description: No credential store passphrase configured, or the store is unavailable
    get:
      operationId: listCMPCredentials
      summary: List CMP credentials without secret material (pki-admin)
      tags: [CMP]
      responses:
        "200":
          description: Credentials, newest first; revoked ones keep revoked_at
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, kind, created_at]
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [pbm, trust_anchor] }
                        label: { type: string }
                        reference: { type: string }
                        cert_sha256: { type: string }
                        enforced: { type: boolean }
                        allowed_dns_suffixes: { type: array, items: { type: string } }
                        created_by: { type: string }
                        created_at: { type: string, format: date-time }
                        rotated_at: { type: string, format: date-time, nullable: true }
                        revoked_at: { type: string, format: date-time, nullable: true }
                        last_used_at: { type: string, format: date-time, nullable: true }
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin

  /cmp/credentials/{id}:
    delete:
      operationId: revokeCMPCredential
      summary: Revoke a CMP credential (pki-admin)
      description: >-
        A message protected by a revoked secret is answered badMessageCheck,
        the same as a wrong secret. Immediate on the node that handled this
        call, within 30 seconds on other nodes.
      tags: [CMP]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "404":
          description: No such credential
        "409":
          description: Already revoked

  /cmp/credentials/{id}/rotate:
    post:
      operationId: rotateCMPCredential
      summary: Replace a PBM secret, keeping its reference (pki-admin)
      description: The new secret appears only in this response; the old one stops working (same 30 second note as revoke).
      tags: [CMP]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, reference, secret, rotated_at]
                    properties:
                      id: { type: string }
                      reference: { type: string }
                      secret: { type: string, description: "Shown once" }
                      rotated_at: { type: string, format: date-time }
        "400":
          description: Not a PBM secret
        "401":
          description: Not authenticated
        "403":
          description: Caller is not pki-admin
        "404":
          description: No such credential
        "409":
          description: Revoked
        "503":
          description: No credential store passphrase configured, or the store is unavailable

  /itsm/connections/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: testItsmConnection
      summary: Check an ITSM connection with a read-only lookup (admin role required, W32-25)
      description: >-
        Resolves the connection's credential and runs one read-only ticket
        lookup. ok=false carries a short generic detail; the upstream response
        and the credential are never returned. Every outcome is audited.
      tags: [ITSM]
      responses:
        "200":
          description: Test result (a failed test is still 200 with ok=false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [ok, detail]
                    properties:
                      ok: { type: boolean }
                      detail: { type: string }
        "401":
          description: Unauthenticated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Admin role required
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "404":
          description: No such connection for this tenant
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: ITSM integration not available
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }

  /chatops/slack/interactions:
    post:
      operationId: slackChatopsInteraction
      summary: Receive a Slack approve/reject button press (Slack signature auth, W32-21)
      description: >-
        Unauthenticated by Bearer token: the caller is authenticated by Slack's
        request signature. Requests must carry X-Slack-Request-Timestamp and
        X-Slack-Signature (v0 HMAC-SHA256 of the raw body, keyed by
        SLACK_SIGNING_SECRET); timestamps outside a 5-minute window and
        replayed signatures are refused with 401. The Slack user is mapped to a
        Kryptkeeper user via the identity map, and the decision is applied
        through the normal approve/reject route as that user, so role,
        proposer-is-not-approver, tenant and quorum rules all apply. Every
        outcome is audited.
      tags: [ChatOps]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: 'Slack block_actions interaction JSON. The action_id is approve or reject and the value is approval:ID or action:ID.' }
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionResult" }
        "202":
          description: Approval recorded but the n-of-m quorum is not yet met; no state changed yet beyond recording this approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingDecision" }
        "400":
          description: Unreadable body, invalid interaction payload or action
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "401":
          description: Missing, invalid, stale (over 5 minutes) or replayed Slack signature
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Slack user unmapped or deprovisioned, proposer cannot approve, or lacks the approver capability
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "404":
          description: Approval or pending action not found
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "409":
          description: Request is no longer pending
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "413":
          description: Request body too large
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "502":
          description: The approve route answered unexpectedly
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: Identity map or user directory unavailable
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }

  /chatops/teams/activities:
    post:
      operationId: teamsChatopsActivity
      summary: Receive a Teams Adaptive Card approve/reject action (Bot Framework JWT auth, W32-23)
      description: >-
        Unauthenticated by Bearer token: the Authorization header carries the
        Bot Framework JWT, validated against the public Bot Framework key set,
        the TEAMS_APP_ID audience and the activity's serviceUrl. Activities
        older than 5 minutes and replayed activity ids are refused with 401.
        Non-message activities are acknowledged with status ignored. The AAD
        user is mapped through the identity map and the decision is applied
        through the normal approve/reject route as that user. Every outcome is
        audited.
      tags: [ChatOps]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Bot Framework Activity (type message with a value carrying kk_action, kind and id).
              additionalProperties: true
      responses:
        "200":
          description: Decision applied, or a non-message activity ignored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionResult" }
        "202":
          description: Approval recorded but the n-of-m quorum is not yet met; no state changed yet beyond recording this approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingDecision" }
        "400":
          description: Invalid interaction action
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "401":
          description: Invalid, missing, stale or replayed Bot Framework token or activity
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Teams user unmapped or deprovisioned, proposer cannot approve, or lacks the approver capability
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "404":
          description: Approval or pending action not found
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "409":
          description: Request is no longer pending
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "413":
          description: Request body too large
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "502":
          description: The approve route answered unexpectedly
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: Identity map or user directory unavailable
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }

  /chatops/identity-map:
    get:
      operationId: listChatopsIdentityMap
      summary: List chat identity mappings of the caller's tenant (admin role required, W32-21)
      tags: [ChatOps]
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChatopsMapping" }
        "401":
          description: Unauthenticated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Admin role required
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: Identity map unavailable
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
    put:
      operationId: setChatopsIdentityMapping
      summary: Map a Slack or Teams user to a Kryptkeeper user (admin role required, W32-21)
      description: >-
        Creates or replaces the mapping. kryptkeeper_user must be an existing
        user in the caller's tenant. A mapping that belongs to another tenant
        is refused. Every outcome is audited.
      tags: [ChatOps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, workspace, external_id, kryptkeeper_user]
              properties:
                platform: { type: string, enum: [slack, teams] }
                workspace: { type: string }
                external_id: { type: string }
                kryptkeeper_user: { type: string }
      responses:
        "200":
          description: Mapping stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ChatopsMapping" }
        "400":
          description: Invalid JSON, platform, workspace or external_id, or unknown user in this tenant
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "401":
          description: Unauthenticated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Admin role required, or the mapping belongs to another tenant
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: Identity map or user directory unavailable
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
    delete:
      operationId: deleteChatopsIdentityMapping
      summary: Remove a chat identity mapping (admin role required, W32-21)
      tags: [ChatOps]
      parameters:
        - { name: platform, in: query, required: true, schema: { type: string, enum: [slack, teams] } }
        - { name: workspace, in: query, required: true, schema: { type: string } }
        - { name: external_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [deleted] }
        "400":
          description: Invalid platform, workspace or external_id
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "401":
          description: Unauthenticated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "403":
          description: Admin role required
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "404":
          description: Mapping not found (including another tenant's)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
        "503":
          description: Identity map unavailable
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
            application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } }
