# W40-01: TLS frontend serving the combined chain+key PEM at /etc/haproxy/kk.pem.
global
    log stdout format raw local0

defaults
    mode http
    timeout client 10s
    timeout connect 5s
    timeout server 10s

frontend kk
    bind :443 ssl crt /etc/haproxy/kk.pem
    http-request return status 200 content-type text/plain string "kk-pqc-wave-haproxy\n"
