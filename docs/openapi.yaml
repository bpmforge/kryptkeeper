openapi: "3.1.0"
info:
  title: Kryptkeeper API
  version: "1.1.0"
  description: Enterprise PKI and Crypto Trust Platform REST API
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1
    description: Default

# Scope (W1-01/G-5): this document covers the hub's own JSON REST surface,
# served under /api/v1 (plus the root-scoped meta paths and /scim/v2/*
# below, which override `servers` per-path). It deliberately EXCLUDES the
# RFC-defined protocol servers mounted at /acme, /ocsp, /crl,
# /.well-known/est, /scep, /cmp (RFC 4210), /wstep (MS-WSTEP) and /xcep
# (MS-XCEP) — those use RFC/SOAP content-types and auth models, not this
# REST API's conventions, and don't fit an /api/v1-scoped contract
# document. /metrics (Prometheus text exposition) is excluded for the same
# reason: telemetry, not a JSON REST resource. /scim/v2/* (W6-02) is
# included despite being root-scoped and its own RFC (7644): it uses this
# API's JSON conventions (application/scim+json is JSON) and its own
# UserProvider, not a separate protocol engine, so it fits this document's
# shape even though its auth (scimBearerAuth) is deliberately separate.

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bootstrap token, JWT, OIDC, or API key (kk_<kid>_<secret>)
    scimBearerAuth:
      type: http
      scheme: bearer
      description: >-
        SCIM's own shared-secret token (APP_SCIM_TOKEN, W6-02) -- a trust
        boundary deliberately separate from bearerAuth. An ordinary operator
        session (bootstrap/JWT/OIDC/API key) is never accepted here.

  schemas:
    CredentialSourceConfig:
      type: object
      description: Everything about a source that is not secret.
      properties:
        base_url: { type: string, description: "vault_kv2: the Vault or OpenBao address." }
        namespace: { type: string, description: "vault_kv2: X-Vault-Namespace." }
        mount: { type: string, description: "vault_kv2: the KV v2 mount path (default secret)." }
        approle_mount: { type: string, description: "vault_kv2: the AppRole auth mount (default approle)." }
        ca_cert_pem: { type: string, description: "vault_kv2: pins a private server CA (public material)." }
        plugin_id: { type: string, description: "plugin: the enabled credentials plugin." }
        cache_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 300
          description: "0 (default) fetches at every use and keeps nothing; otherwise the fetched credential is held in memory this long."
    CredentialSource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [vault_kv2, plugin] }
        tenant: { type: string }
        credential_ref: { type: string }
        config: { $ref: "#/components/schemas/CredentialSourceConfig" }
        created_at: { type: string }
        updated_at: { type: string }
    PrivilegePreflight:
      type: object
      required: [checked_at, mode, rows, ok, privileged_all]
      properties:
        checked_at: { type: string, format: date-time }
        mode: { type: string, enum: [none, nopasswd, password, helper] }
        roles: { type: array, items: { type: string, enum: [scan, install] } }
        ok: { type: boolean }
        privileged_all: { type: boolean }
        rows:
          type: array
          items:
            type: object
            required: [capability, status]
            properties:
              capability: { type: string, description: "ssh_auth, sudo_present, requiretty, nopasswd, password, helper_present, helper_sha, helper_sudo, command:<name>, verb:<name>" }
              status: { type: string, enum: [ok, fail, skipped] }
              detail: { type: string }
              fix: { type: string }
    PrivilegeBundle:
      type: object
      required: [mode, user, sudoers, checklist, warnings]
      properties:
        mode: { type: string, enum: [helper, nopasswd, password] }
        user: { type: string }
        sudoers: { type: string }
        helper: { type: string, description: POSIX sh helper source (helper mode only) }
        helper_sha256: { type: string }
        helper_path: { type: string }
        checklist: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    ESTLabel:
      type: object
      description: A named EST endpoint bound to one template (W26-06).
      properties:
        label: { type: string }
        template_id: { type: string }
        description: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        url: { type: string, description: "<KRYPTKEEPER_BASE_URL>/.well-known/est/<label>/" }
    SCEPLabel:
      type: object
      description: A named SCEP endpoint in Intune challenge mode (W20-23).
      properties:
        label: { type: string }
        mode: { type: string, enum: [intune] }
        template_id: { type: string }
        intune_tenant_id: { type: string }
        intune_client_id: { type: string }
        credential_ref: { type: string, description: "Id of the outbound credential; never the secret" }
        issuing_authority: { type: string }
        description: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        url: { type: string, description: "<KRYPTKEEPER_BASE_URL>/scep/<label>" }
    ESTUser:
      type: object
      properties:
        username: { type: string }
        allowed_dns_suffixes: { type: array, items: { type: string } }
        disabled: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        password_rotated_at: { type: string, format: date-time, nullable: true }
        shadowed_by_file: { type: boolean, description: "A users-file user of the same name wins, so this stored user is never consulted" }
    ESTUserSecret:
      type: object
      properties:
        username: { type: string }
        password: { type: string, description: "Shown once; never stored or returned again" }
        allowed_dns_suffixes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    EstateReport:
      type: object
      required: [generated_at, org, total, by_state, by_origin, matrix, pqc, risk]
      properties:
        generated_at: { type: string }
        org: { type: string }
        total: { type: integer }
        by_state:
          type: object
          additionalProperties: { type: integer }
        by_origin:
          type: object
          additionalProperties: { type: integer }
        matrix:
          type: array
          description: Always 12 cells (4 origins x 3 management states).
          items:
            type: object
            required: [origin, management_state, count]
            properties:
              origin: { type: string, enum: [internal, imported, discovered, synced] }
              management_state: { type: string, enum: [managed, external, unmanaged] }
              count: { type: integer }
        pqc:
          type: object
          properties:
            quantum_safe: { type: integer }
            quantum_safe_leaf_only: { type: integer }
            migration_ready: { type: integer }
            vulnerable: { type: integer }
            not_applicable: { type: integer }
            pqc_score_percent: { type: integer }
            quantum_safe_percent: { type: integer }
        risk:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
    KeyPolicy:
      type: object
      properties:
        key_id: { type: string }
        owner: { type: string }
        acl: { type: array, items: { type: string } }
        max_age_days: { type: integer }
        rotated_at: { type: string, format: date-time }
        compromised_at: { type: string, format: date-time, nullable: true }
    Ceremony:
      type: object
      required: [id, ca_id, status, quorum, approvers, approvals, created_at, expires_at]
      properties:
        id: { type: string }
        ca_id: { type: string }
        ca_name: { type: string }
        common_name: { type: string }
        algorithm: { type: string }
        validity_days: { type: integer }
        initiator: { type: string }
        approvers: { type: array, items: { type: string } }
        quorum: { type: integer, minimum: 2 }
        approvals: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, completed, aborted, expired] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "created_at + ceremony TTL (default 72h); derived, not stored" }
    DualControlProposal:
      type: object
      description: >-
        Returned (202) by every private-key egress route while dual control is
        on (KRYPTKEEPER_KEY_DUAL_CONTROL, default on). No key material is
        included.
      properties:
        data:
          type: object
          required: [status, action_id]
          properties:
            status: { type: string, enum: [proposed] }
            action_id: { type: string }
            message: { type: string }
    IssuancePolicyRules:
      type: object
      properties:
        allowed_algorithms:
          type: array
          items:
            type: string
            enum: [RSA-2048, RSA-3072, RSA-4096, ECDSA-P256, ECDSA-P384, Ed25519, ML-DSA-44, ML-DSA-65, ML-DSA-87, Hybrid-ECDSA-P256-ML-DSA-65, Hybrid-ECDSA-P384-ML-DSA-87]
        min_rsa_bits: { type: integer, description: "0 or 2048-16384" }
        max_validity_days: { type: integer, description: "0 (unrestricted) to 3650" }
        allow_ca_certs: { type: boolean }
    IssuancePolicy:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        ca_id: { type: string, description: "Empty applies to every CA" }
        rules: { $ref: "#/components/schemas/IssuancePolicyRules" }
    IssuancePolicyVersion:
      type: object
      properties:
        policy_id: { type: string }
        version: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
        ca_id: { type: string }
        rules: { $ref: "#/components/schemas/IssuancePolicyRules" }
        changed_by: { type: string }
        change_kind: { type: string, enum: [create, update, loosen, revert] }
        created_at: { type: string }
    IssuancePolicyWrite:
      type: object
      description: POST requires name; PATCH takes any subset.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        ca_id: { type: string }
        rules: { $ref: "#/components/schemas/IssuancePolicyRules" }
        revert_to: { type: integer, minimum: 1, description: "PATCH only, alone in the body: restore that version (audited as policy.revert). A restore that would loosen returns 202." }

    TeamPolicy:
      type: object
      required: [tenant, team, allowed_cas, allowed_templates, allowed_dns_suffixes, allowed_dns_names, max_validity_days, monthly_quota, version]
      properties:
        tenant: { type: string }
        team: { type: string }
        allowed_cas: { type: array, items: { type: string } }
        allowed_templates: { type: array, items: { type: string } }
        allowed_dns_suffixes: { type: array, items: { type: string } }
        allowed_dns_names: { type: array, items: { type: string } }
        max_validity_days: { type: integer, minimum: 0, maximum: 3650, description: 0 means no cap }
        monthly_quota: { type: integer, minimum: 0, maximum: 1000000, description: 0 means unlimited }
        version: { type: integer }
        updated_by: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    TeamPolicyWrite:
      type: object
      description: >-
        POST requires team; PATCH takes any subset (team cannot change). An empty list places no
        restriction on that axis, max_validity_days 0 is no cap and monthly_quota 0 is unlimited.
      properties:
        team: { type: string, minLength: 1, maxLength: 120 }
        allowed_cas: { type: array, maxItems: 100, items: { type: string } }
        allowed_templates: { type: array, maxItems: 100, items: { type: string } }
        allowed_dns_suffixes: { type: array, maxItems: 100, items: { type: string } }
        allowed_dns_names: { type: array, maxItems: 100, items: { type: string } }
        max_validity_days: { type: integer, minimum: 0, maximum: 3650 }
        monthly_quota: { type: integer, minimum: 0, maximum: 1000000 }
    TeamPolicyPending:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [pending_approval] }
            pending_action_id: { type: string }
            reasons: { type: array, items: { type: string } }

    Error:
      type: object
      properties:
        error:
          type: string
        error_code:
          type: string
          description: |
            Present on 403 refusals (W33-21). Certificate-access denials use `team_scope_mismatch` or
            `tenant_visibility`; team-policy refusals use `team_policy_missing`, `team_policy_ca_not_allowed`,
            `team_policy_template_not_allowed`, `team_policy_name_not_allowed`, `team_policy_validity_exceeded`
            or `team_quota_exceeded`.
        message:
          type: string

    TrustBundleSummary:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        action: {type: string, enum: [add, remove]}
        certs:
          type: array
          items:
            type: object
            properties:
              sha256: {type: string}
              subject: {type: string}
              issuer: {type: string}
              not_after: {type: string, format: date-time}
              root: {type: boolean}
        selector:
          type: object
          properties:
            agent_ids: {type: array, items: {type: string}}
            agent_types: {type: array, items: {type: string}}
            all: {type: boolean}
        agent_ids: {type: array, items: {type: string}}
        created_by: {type: string}
        approved_by: {type: string}
        action_id: {type: string}
        created_at: {type: string, format: date-time}
        targets: {type: integer}
        applied: {type: integer}
        refused_not_opted_in: {type: integer}
        failed: {type: integer}
        pending: {type: integer}
    TrustHostStatus:
      type: object
      properties:
        agent_id: {type: string}
        agent_name: {type: string}
        outcome: {type: string, enum: [applied, refused_not_opted_in, failed, pending]}
        detail: {type: string}
        reported_at: {type: string, format: date-time}
    CodesignTrustRule:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }
        issuer: { type: string }
        audience: { type: string }
        repo_pattern: { type: string }
        ref_pattern: { type: string }
        ca_id: { type: string }
        tenant: { type: string }
        created_by: { type: string }
        approved_by: { type: string }
        created_at: { type: string }
    ProblemDetails:
      type: object
      description: >-
        RFC 7807 error body, emitted as application/problem+json when
        APP_ERROR_FORMAT is problem or rfc7807 (otherwise the Error envelope).
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    PendingDecision:
      type: object
      description: n-of-m quorum not yet met; no state changed yet beyond recording this approval.
      required: [data]
      properties:
        data:
          type: object
          required: [status, approvals, required]
          properties:
            status: { type: string, enum: [pending] }
            approvals: { type: integer }
            required: { type: integer }
    DecisionResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [approved, rejected, ignored], description: "ignored is returned by the Teams endpoint for non-message activities." }
    ChatopsMapping:
      type: object
      required: [platform, workspace, external_id, kryptkeeper_user, tenant, created_at]
      properties:
        platform: { type: string, enum: [slack, teams] }
        workspace: { type: string, description: "Slack team id or Azure AD tenant id; 1-64 chars of [A-Za-z0-9_.-]." }
        external_id: { type: string, description: "Slack user id or AAD object id; 1-64 chars of [A-Za-z0-9_.-]." }
        kryptkeeper_user: { type: string }
        tenant: { type: string }
        created_at: { type: string, format: date-time }

    CertificateRevokeResult:
      type: object
      properties:
        fingerprint_sha256: { type: string }
        renewal_status: { type: string }
        revoked_at: { type: string, format: date-time }
        revocation_reason: { type: integer }
        revocation_scope:
          type: string
          enum: [ca, inventory_only, upstream]
          description: >-
            `ca`: recorded against the issuing CA, so CRL and OCSP reflect it.
            `upstream`: the issuing CA is external (or the certificate has a
            renewal connector that can revoke) and it accepted the revocation
            first; relying parties see it through that CA's own CRL and OCSP.
            `inventory_only`: the certificate has no issuing CA in this hub
            (imported, discovered or synced); only the hub inventory was
            marked, and the operator must still revoke it at the real issuer.

    CertificateItem:
      type: object
      properties:
        fingerprint_sha256:
          type: string
        serial_number:
          type: string
        common_name:
          type: string
        ownership_source:
          type: string
          enum: [manual, cmdb, import, agent]
          description: >-
            Who assigned `owner_team` (W22-24). Omitted when the certificate
            is unowned. Server-assigned; a PATCH body cannot set it.
        # D-107 (2026-09-11, locked): subject_alt_names and uri_sans are
        # BOTH intentionally present, not a duplication bug. subject_alt_names
        # is the flat list of every SAN kind as strings (DNS, IP, URI,
        # email — W18-14); uri_sans is the typed subset carrying only URI
        # SANs (e.g. SPIFFE IDs), unchanged since before W18-14. No consumer
        # merges or reconciles them — see D-107 for why the flat list must
        # stay as-is (the renewal CSR rebuild in
        # internal/bootstrap/renewal_executor.go's splitSubjectAltNames
        # depends on it carrying every SAN kind).
        subject_alt_names:
          type: array
          items:
            type: string
        uri_sans:
          type: array
          items:
            type: string
        issuer_cn:
          type: string
        template_revision:
          type: integer
          description: >-
            Revision of the issuing template in force when the certificate was
            issued (W23-44). Absent for certificates issued before it was
            recorded, imported and discovered ones.
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        grade:
          type: string
          enum: [A, B, C, D, F]
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        renewal_status:
          type: string
          enum: [active, renewed, revoked, expired, reissue_required]
        ca_id:
          type: string
          description: Issuing CA in this hub; empty for imported, discovered or synced certificates.
        origin:
          type: string
          enum: [internal, imported, discovered, synced]
          description: Where the certificate came from.
        management_state:
          type: string
          enum: [managed, external, unmanaged]
        renewal_connector_id:
          type: string
          description: >-
            Issuer connector that renews (and, when it supports it, revokes)
            this certificate. Absent for the internal renewal path.
        trust_class:
          $ref: "#/components/schemas/TrustClass"
        chain_complete:
          type: boolean
          description: >-
            The chain as this hub issued or ingested it. ABSENT for
            discovery-found certs (`origin` = discovered): whether a served
            chain is complete is a fact about an endpoint, so it is reported
            per endpoint (`mapped_certs[].chain_complete` on
            /discovery/endpoints) and never as a certificate-level value that
            could contradict it. A hub-issued cert served without its
            intermediate is complete here and incomplete on that endpoint.
        chain_trusted:
          type: boolean
          description: >-
            Same contract as `chain_complete`: the chain as issued/ingested by
            the hub, absent for discovered certs (see
            `mapped_certs[].chain_trusted` on /discovery/endpoints).
        risk_flags:
          type: array
          items: { type: string }
          description: >-
            Certificate-intrinsic flags only (EXPIRED, WEAK_KEY, SELF_SIGNED,
            ...). HOSTNAME_MISMATCH, INCOMPLETE_CHAIN and UNTRUSTED_ROOT depend
            on the endpoint serving the certificate and are reported on
            `mapped_certs[].risk_flags` of /discovery/endpoints.

    TrustClass:
      type: string
      enum: [managed, public, private_other, self_signed, unknown]
      # Generated SDKs put enum constants in one namespace; prefix them so
      # TrustClass and InventoryClass (both have managed/self_signed) do not collide.
      x-enum-varnames: [TRUST_MANAGED, TRUST_PUBLIC, TRUST_PRIVATE_OTHER, TRUST_SELF_SIGNED, TRUST_UNKNOWN]
      description: >-
        Whose certificate this is, from a real x509 verification of the chain
        the server presented (never the permissive TLS handshake). managed =
        chains to one of this hub's CAs (also any hub-managed certificate);
        public = chains to a system root; private_other = neither, issued by
        some other CA; self_signed = the leaf vouches only for itself;
        unknown = could not be classified. Empty/absent on certificates that
        discovery did not find.

    TrustClassCounts:
      type: object
      description: >-
        Distinct leaf certificates seen on the network (at least one active
        endpoint mapping) per effective trust class, hub-issued certificates
        included under `managed`. A certificate served on several endpoints
        counts once; the classes sum to `mapped_certificates`. Intermediates
        and roots captured from a served chain are not counted.
      properties:
        managed: { type: integer }
        public: { type: integer }
        private_other: { type: integer }
        self_signed: { type: integer }
        unknown: { type: integer }
      required: [managed, public, private_other, self_signed, unknown]

    InventoryClass:
      type: string
      enum: [managed, ours_unmanaged, authorized_external, unknown_issuer, self_signed]
      x-enum-varnames: [INVENTORY_MANAGED, INVENTORY_OURS_UNMANAGED, INVENTORY_AUTHORIZED_EXTERNAL, INVENTORY_UNKNOWN_ISSUER, INVENTORY_SELF_SIGNED]
      description: >-
        Headline classification of a discovered leaf certificate (W34-06).
        managed = the hub renews it; ours_unmanaged = issued by this hub's CAs
        but nobody renews it; authorized_external = issued by a CA the operator
        declared under /discovery/authorized-issuers; unknown_issuer = public,
        private or unclassifiable issuer nobody declared; self_signed = the
        leaf vouches only for itself. Derived from management_state and
        issuer_class, never stored. An endpoint presenting several leaves
        reports the least-trusted class (unknown_issuer first).

    InventoryClassCounts:
      type: object
      description: >-
        Distinct leaf certificates seen on the network per inventory class;
        the classes sum to `mapped_certificates`.
      properties:
        managed: { type: integer }
        ours_unmanaged: { type: integer }
        authorized_external: { type: integer }
        unknown_issuer: { type: integer }
        self_signed: { type: integer }
      required: [managed, ours_unmanaged, authorized_external, unknown_issuer, self_signed]

    AuthorizedIssuer:
      type: object
      description: >-
        A CA group the operator accepts certificates from (D-205). kind
        ca_cert holds PEM CA certificates and matches by chain verification;
        issuer_dn matches a leaf's immediate issuer name; spki_sha256 matches
        the public-key hash of a CA certificate the server served (so it
        cannot match a lone leaf).
      required: [id, name, kind, value, created_by, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ca_cert, issuer_dn, spki_sha256] }
        value: { type: string }
        notes: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    CAItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [root, intermediate]
        status:
          type: string
          # "expired" is derived at read time from the CA certificate's own
          # validity, not stored (S-43): a CA whose certificate has lapsed
          # keeps status=active in the database, so every /cas response
          # projects it to "expired" rather than advertising it as active.
          enum: [active, suspended, expired]
        revocation_signing:
          type: string
          enum: [classical, ml-dsa]

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        next_cursor:
          type: integer
          nullable: true
        prev_cursor:
          type: integer
          nullable: true

    NotificationRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        threshold_days: { type: integer, description: Absolute-days rule threshold; omitted for percent rules. }
        threshold_pct: { type: integer, minimum: 0, maximum: 100, description: Percent of the certificate's own lifetime remaining; 0 means EXPIRED. Omitted for days rules. }
        template_id: { type: string, description: Rule applies only to certificates of this template; omitted when it applies to every template. }
        channel: { type: string }
        target: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificationSilence:
      type: object
      properties:
        id: { type: string }
        target_type: { type: string, enum: [certificate, ca, template] }
        target_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    NotificationTeamRoute:
      type: object
      properties:
        id: { type: string }
        owner_team: { type: string, description: "Owner team, or * for the global inbox." }
        channel: { type: string, enum: [email, slack, pagerduty, webhook] }
        target: { type: string }

    AuditEntry:
      type: object
      description: One append-only audit record. resource_name is the only field not stored with the record.
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string }
        action: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        resource_type: { type: string }
        resource_id:
          type: string
          description: Authoritative reference to the resource (e.g. a certificate fingerprint). Pre-issue failure and pending-approval certificate.issue rows carry the collection name "certificates" because no certificate exists yet.
        resource_name:
          type: string
          description: Human-readable name resolved at read time (certificate common name, CA/template display name, "<template> for <CN or requester>" for approvals, notification rule name, scan target). Omitted when the resource no longer exists, is not resolvable, or the caller may not read it. Never stored.
        trace_id: { type: string }
        outcome: { type: string }
        source_ip: { type: string }
        user_agent: { type: string }
        session_id: { type: string }
        change_summary: { type: string }
        tenant: { type: string }
      required: [id, timestamp, action, actor_type, actor_id, resource_type, resource_id, outcome]
    UserRecord:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string, enum: [active, invited, deactivated] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
        tenant:
          type: string
          description: Owning tenant. Empty means the default tenant.

    SCIMUser:
      type: object
      description: SCIM 2.0 core User (subset), W6-02.
      properties:
        schemas:
          type: array
          items: { type: string }
        id: { type: string }
        userName: { type: string }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string, format: email }
              primary: { type: boolean }
        active: { type: boolean }
        kryptkeeperRole:
          type: string
          description: Non-standard extension attribute; sets the account's Kryptkeeper role directly.
        meta:
          type: object
          properties:
            resourceType: { type: string }
            location: { type: string }

    SCIMGroup:
      type: object
      description: SCIM 2.0 core Group (subset), W6-02.
      properties:
        schemas:
          type: array
          items: { type: string }
        id: { type: string }
        displayName: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
        meta:
          type: object
          properties:
            resourceType: { type: string }
            location: { type: string }

    UserPrefs:
      type: object
      required: [onboarding_dismissed]
      properties:
        onboarding_dismissed: { type: boolean }
    EffectiveSetting:
      type: object
      description: >-
        A registered runtime setting merged with its current source. Secret
        keys never populate value -- only configured reports whether a
        value exists (env default or DB override).
      properties:
        key: { type: string }
        category: { type: string, enum: [notifications, renewal_policy, discovery, sso, saml, scim, key_backend, slo, agentless] }
        env_var: { type: string }
        secret: { type: boolean }
        source: { type: string, enum: [database, env_default, unset] }
        value: { type: string }
        configured: { type: boolean }
        effective_source: { type: string, enum: [env, override], description: "override when a DB override supplies the value, else env." }
        restart_required: { type: boolean, description: "True when the setting only takes effect after a process restart." }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    TemplateRecord:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        validity_period: { type: string, description: "ISO 8601 duration, e.g. P90D" }
        key_usage:
          type: array
          items: { type: string }
        extended_key_usage:
          type: array
          items: { type: string }
        allowed_algorithms:
          type: array
          items: { type: string }
          description: >-
            Vocabulary: RSA-2048|RSA-3072|RSA-4096|ECDSA-P256|ECDSA-P384|Ed25519|
            ML-DSA-44|ML-DSA-65|ML-DSA-87|
            Hybrid-ECDSA-P256-ML-DSA-65|Hybrid-ECDSA-P384-ML-DSA-87.
            A bare family name (RSA, ECDSA, Ed25519) allows any size/curve of
            that family. Editable via PATCH /api/v1/templates/{id}.
        min_key_size: { type: integer }
        auto_enroll: { type: boolean }
        enrollee_type:
          type: string
          enum: [machine, user]
          description: >-
            Who the template is for (W20-17). XCEP offers a machine only
            machine templates and a user only user templates, and WSTEP
            refuses the other kind. Defaults to machine; set on create or
            replace (PUT), not PATCH.
        active: { type: boolean }
        require_approval:
          type: boolean
          description: Issuance requests against this template wait in the approval queue.
        approval_roles:
          type: array
          items: { type: string }
          description: Roles allowed to approve; empty means pki-admin only.
        ssh_policy:
          $ref: "#/components/schemas/SSHPolicy"
        name_policy:
          $ref: "#/components/schemas/NamePolicy"
        enrollment_permissions:
          $ref: "#/components/schemas/EnrollmentPermissions"
        device_attestation:
          type: boolean
          description: >-
            Explicitly allows ACME device-attest-01 issuance from this template
            (W40-02, D-317). Needs attestation roots configured on the hub and
            the device in the inventory (/acme/devices). Set on create or
            replace (PUT), not PATCH; a clone starts without it.
        revision: { type: integer }

    TemplateRevision:
      type: object
      properties:
        revision: { type: integer }
        changed_at: { type: string, format: date-time }
        snapshot:
          $ref: "#/components/schemas/TemplateRecord"
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              old: {}
              new: {}

    EnrollmentPermissions:
      type: object
      description: >-
        Roles allowed to issue from a template (W23-42). Absent or an empty
        enroll list means any role. Enforced on API/wizard issuance
        (POST /certificates); a caller whose role is not listed gets 403 and an
        issuance.denied_template_role audit row. Roles are lowercased,
        deduplicated and must match ^[a-z0-9][a-z0-9_.:-]{0,63}$ (max 32). Set
        on create, replace (PUT; omitting clears it) or PATCH. Windows
        autoenrollment enforces the list only when it holds at least one
        protocol:wstep entry (API roles alone leave XCEP/WSTEP unrestricted);
        then XCEP offers, and WSTEP issues, the template only to a caller
        named by protocol:wstep (every Windows client) or
        protocol:wstep:<host fqdn> (that machine, e.g. a domain controller).
        protocol:wstep:restricted matches no caller. An ADCS migration writes
        [pki-admin, protocol:wstep:restricted] on DC, Kerberos and RAS
        templates.
      properties:
        enroll:
          type: array
          maxItems: 32
          items: { type: string }

    NamePolicy:
      type: object
      description: >-
        Restricts the names certificates issued under a template may carry
        (SUP-A04-3). Enforced on the names about to be signed, on every
        issuance path that passes the template (API, renewal, bulk reissue,
        WSTEP). A template without name_policy is unrestricted. When present,
        IP and URI SANs are refused unless allowed; DNS names are restricted
        only when allowed_dns_suffixes or allowed_dns_names is non-empty. Set
        on create or replace (PUT); omitting it on PUT clears it.
      properties:
        allowed_dns_suffixes:
          type: array
          items: { type: string }
          description: >-
            ".x" matches any name below x (not x itself); "x" without a
            leading dot matches x and any subdomain. A wildcard SAN is judged
            as the shallowest name it can stand for.
        allowed_dns_names:
          type: array
          items: { type: string }
          description: Exact names (case-insensitive).
        allow_ip_sans: { type: boolean, default: false }
        allow_uri_sans: { type: boolean, default: false }
        allowed_uri_prefixes:
          type: array
          items: { type: string }
          description: >-
            Limits URI SANs to these prefixes (e.g. spiffe://prod.example/).
            Requires allow_uri_sans.
        cn_must_be_san:
          type: boolean
          default: false
          description: A non-empty subject CN must equal one of the SANs.

    SSHPolicy:
      type: object
      required: [cert_types, max_ttl_hours]
      description: >-
        Makes a template usable for SSH certificate issuance (A01S-4 /
        FR-P70). POST /ssh/certificates signs only what a template's policy
        lists; a template without ssh_policy cannot sign SSH certificates.
        Set on create or replace (PUT); omitting it on PUT clears it.
      properties:
        cert_types:
          type: array
          minItems: 1
          items: { type: string, enum: [user, host] }
        allowed_principals:
          type: array
          items: { type: string, pattern: "^[a-zA-Z0-9._-]{1,64}$" }
          description: Exact login names, no wildcards. Required when cert_types includes user.
        host_patterns:
          type: array
          items: { type: string }
          description: >-
            Lowercase DNS names, or a single leading "*." label that matches
            exactly one extra label. Required when cert_types includes host.
        max_ttl_hours:
          type: number
          exclusiveMinimum: 0
          maximum: 720
          description: Above this a request is refused, never clamped. At most 24 when cert_types includes user, 720 for host.

    MigrationFieldReport:
      type: object
      required: [field, status]
      properties:
        field: { type: string }
        status: { type: string, enum: [mapped, partial, unmapped] }
        target: { type: string }
        note: { type: string }
    MigrationDiffEntry:
      type: object
      required: [source_key, name, action, fields]
      properties:
        source_key: { type: string }
        name: { type: string }
        action:
          type: string
          enum: [create, skip, conflict, update]
          description: >-
            update replaces, in place, a template an earlier batch of this
            source made (its mapping or the policy floor changed) or a
            template with the same name and OID (it is reactivated).
        reason: { type: string }
        notes:
          type: array
          items: { type: string }
          description: >-
            Deliberate changes the import makes, e.g. "key size raised from
            2048 to 3072 to meet policy \"Baseline\"" when the mapped RSA
            minimum is below the active issuance policies' floor (the policy
            is never weakened).
        fields:
          type: array
          items: { $ref: "#/components/schemas/MigrationFieldReport" }
    MigrationDiff:
      type: object
      description: >-
        Dry-run result. Carries no timestamps or ids, so two runs over the same
        input and state are byte-identical.
      required: [source, entries, counts, unmapped, unsupported]
      properties:
        source: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MigrationDiffEntry" }
        counts:
          type: object
          required: [create, skip, conflict, update]
          properties:
            create: { type: integer }
            skip: { type: integer }
            conflict: { type: integer }
            update: { type: integer }
        unmapped: { type: integer }
        unsupported: { type: integer }
    MigrationReportEntry:
      allOf:
        - $ref: "#/components/schemas/MigrationDiffEntry"
        - type: object
          required: [template_id]
          properties:
            template_id: { type: string }
    MigrationReport:
      type: object
      required: [batch_id, created, updated, entries]
      properties:
        batch_id: { type: string }
        created: { type: integer }
        updated: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MigrationReportEntry" }
    MigrationBatch:
      type: object
      required: [id, source, status, created_by, created_at]
      properties:
        id: { type: string }
        source: { type: string }
        status: { type: string, enum: [applied, rolled_back] }
        created_by: { type: string }
        created_at: { type: string }
        rolled_back_at: { type: string }
        items: { type: integer, description: Templates the batch created or updated. }
    MigrationRollbackResult:
      type: object
      required: [batch_id, already_rolled_back, disabled, kept, items]
      properties:
        batch_id: { type: string }
        already_rolled_back: { type: boolean }
        disabled: { type: integer, description: Templates the batch created, now disabled. }
        restored: { type: integer, description: Templates the batch updated, restored to their pre-update state. }
        kept: { type: integer, description: Templates left as they are because they have pending approvals. }
        items:
          type: array
          items:
            type: object
            required: [name, template_id, outcome]
            properties:
              name: { type: string }
              template_id: { type: string }
              outcome: { type: string, enum: [disabled, restored, kept, already_disabled] }
              reason: { type: string }
    MigrationRequest:
      type: object
      required: [source]
      properties:
        source: { type: string, description: "Importer name from GET /migration/sources." }
        content: { type: string, description: "The raw export text. Omit for a live read (importers that support it)." }
        credential_ref: { type: string, description: "Stored credential used for a live read. Only the reference is kept." }
        options: { type: object, additionalProperties: { type: string } }
    PluginCatalogueEntry:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        publisher: { type: string }
        version: { type: string }
        description: { type: string }
        manifest_url: { type: string }
        wasm_url: { type: string }
        bundle_url: { type: string }
        sha256: { type: string }
        capabilities: { type: array, items: { type: string } }
        min_hub_version: { type: string }
        status: { type: string, enum: [available, installed, upgradable] }
        installed_version: { type: string }
        compatible: { type: boolean }
    DeliveryPluginVersion:
      type: object
      properties:
        plugin_id: { type: string }
        kind: { type: string, enum: [delivery, notify, ticket, dns01, inventory, credentials], description: "What the plugin does (manifest kind; absent in a manifest means delivery). The hub runs delivery and notify plugins today." }
        version: { type: string }
        sha256: { type: string }
        trust_tier: { type: string, enum: [first-party, verified, community] }
        capability_tier: { type: string, enum: [critical, high, standard] }
        status: { type: string, enum: [installed, pending_approval, enabled, superseded, disabled] }
        manifest: { type: object, description: "The plugin's manifest.json" }
        installed_by: { type: string }
        installed_at: { type: string }
        approved_by: { type: string }
        approved_at: { type: string }
        pending_action_id: { type: string }
        signer_key_id: { type: string, description: "sha256 of the PKIX public key that verified the signature; absent when unsigned" }

    ACMEProvisionerInput:
      type: object
      required: [ca_id, allow_names]
      properties:
        name: { type: string, description: "Create only. Lowercase letters, digits, hyphens (1-32); reserved ACME path words are refused" }
        ca_id: { type: string }
        template_id: { type: string, description: "Optional enrollment template gating issuance" }
        allow_names:
          type: array
          maxItems: 100
          minItems: 1
          items: { type: string }
          description: Lowercase exact names or *.suffix entries
        challenges:
          type: array
          items: { type: string, enum: [http-01, dns-01, device-attest-01] }
          description: >-
            Empty means http-01 and dns-01 (and device-attest-01 when the
            template allows it and roots are configured)
    ACMEDevice:
      type: object
      required: [identifier, tenant_id, created_by, created_at]
      properties:
        identifier: { type: string }
        label: { type: string }
        tenant_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    ACMEProvisioner:
      type: object
      required: [name, ca_id, allow_names, challenges, directory_url]
      properties:
        name: { type: string }
        ca_id: { type: string }
        template_id: { type: string }
        allow_names: { type: array, items: { type: string } }
        challenges: { type: array, items: { type: string } }
        directory_url: { type: string }
    ItsmEventClass:
      type: object
      required: [class, ticket_type]
      properties:
        class: { type: string, enum: [renewal_failed, approval_pending, expiry_no_owner] }
        ticket_type:
          type: string
          description: >-
            ServiceNow incident or change_request; Jira an issue-type name
            (default Task when omitted on create); a plugin connection takes
            free text the ticket plugin interprets (empty means its default).
    ItsmConnection:
      type: object
      required: [id, kind, name, base_url, credential_ref, event_classes, enabled, tenant, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [servicenow, jira, plugin] }
        name: { type: string }
        base_url: { type: string, description: "Empty for a plugin connection; the credential holds the service address." }
        credential_ref: { type: string }
        plugin_id: { type: string, description: "The ticket plugin of a plugin connection (D-326); absent for ServiceNow and Jira." }
        event_classes:
          type: array
          items: { $ref: "#/components/schemas/ItsmEventClass" }
        enabled: { type: boolean }
        tenant: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItsmPrincipalMapping:
      type: object
      required: [kind, external_id, user_id, tenant]
      properties:
        kind: { type: string, enum: [servicenow, jira] }
        external_id: { type: string, description: The approver identity the connector reports for the ticket. }
        user_id: { type: string }
        tenant: { type: string }
    ItsmEvent:
      type: object
      required: [event_id, connection_id, class, fingerprint, status, ticket_key, ticket_url, attempts, next_attempt_at, last_error, recreated, tenant, created_at, updated_at]
      properties:
        event_id: { type: string }
        connection_id: { type: string }
        class: { type: string }
        fingerprint: { type: string }
        status: { type: string, enum: [pending, created, resolved, failed] }
        ticket_key: { type: string }
        ticket_url: { type: string }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_error: { type: string }
        recreated: { type: boolean, description: The ticket was deleted externally and recreated once }
        tenant: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeliveryPlugin:
      type: object
      properties:
        id: { type: string }
        enabled_version: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/DeliveryPluginVersion" }

    SCEPChallenge:
      type: object
      properties:
        id: { type: string }
        ca_id: { type: string }
        common_name: { type: string }
        dns_names: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time, nullable: true }

    AgentInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [linux, mac, windows] }
        registered_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, stale, offline] }
        inventory_count: { type: integer }
        version:
          type: string
          description: Agent build last reported via X-Agent-Version; empty if never reported.
        host_report:
          type: object
          description: >-
            The agent's latest host pass (W34-09). `posture_known` is false for
            an agent that predates privilege reporting: its files are unknown,
            never assumed standard. Absent until the agent has pushed inventory.
          required: [received_at, posture_known, unreadable_count, listener_count, listeners_hidden]
          properties:
            received_at: { type: string, format: date-time }
            posture_known: { type: boolean }
            privilege_mode: { type: string, enum: [none, nopasswd, helper] }
            scan_user: { type: string }
            unreadable_count: { type: integer, description: Paths the agent could not read for lack of privilege. }
            unreadable_paths:
              type: array
              description: At most 10 of them.
              items:
                type: object
                required: [path, error]
                properties:
                  path: { type: string }
                  error: { type: string }
            findings:
              type: array
              description: >-
                INSUFFICIENT_PRIVILEGE (with the fix for the mode) and the per-file
                posture findings, "CODE: detail" as on SSH targets.
              items: { type: string }
            files:
              type: array
              description: Files with a non-standard posture or a finding, at most 200.
              items:
                type: object
                required: [path, kind, posture]
                properties:
                  path: { type: string }
                  kind: { type: string, enum: [pem, jks, p12, key, config] }
                  owner: { type: string }
                  group: { type: string }
                  mode: { type: string }
                  posture: { type: string, enum: [standard, privileged, root_service, unknown] }
                  service_tech: { type: string }
                  findings: { type: array, items: { type: string } }
            posture_counts:
              type: object
              additionalProperties: { type: integer }
            listener_count: { type: integer }
            listeners_hidden: { type: integer, description: Listeners whose owning process the agent could not see. }

    CTFinding:
      type: object
      description: >-
        A certificate observed in CT for an owned domain and absent from the
        inventory (W24-19). `ours` is true when the issuer is one of this
        hub's CAs; `revoke_url` then points at the Certificates page, where
        the operator revokes through the normal (dual-control) dialog. This
        API never revokes.
      required: [id, log_id, domain, ca, serial, source, status, ours]
      properties:
        id: { type: string, description: "source:entry-id" }
        log_id: { type: string, description: "Source-scoped entry id; crt.sh aggregates logs so there is no per-log id" }
        domain: { type: string }
        common_name: { type: string }
        dns_names: { type: array, items: { type: string } }
        ca: { type: string, description: "Issuer DN as reported by the CT source" }
        serial: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        source: { type: string }
        status: { type: string, enum: [open, acknowledged, known_issuer] }
        resolved_by: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        ours: { type: boolean }
        revoke_url: { type: string, description: "Present only when ours; /certificates?q=<serial>" }

    ManagedTarget:
      type: object
      description: >-
        A declared fleet target (W5-09, D-062, FR-P24): a host plus how it is
        discovered / installed / renewed. renewal_threshold_days (W8-15,
        FR-P33) is the per-target override for the renewal scheduler's
        env-configured RENEWAL_THRESHOLD_DAYS default -- omitted or 0 means
        "no override, use the process default."
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        discovery_mode: { type: string, enum: [agent, network, cloud, winrm, none] }
        install_mode: { type: string, enum: [agent, ssh, f5, citrix, k8s, iis, sqlserver, rdp, exchange, keychain, cloud, acme, plugin] }
        renewal_method: { type: string, enum: [acme, est, scep, manual] }
        plugin_id: { type: string, description: "Delivery plugin for install_mode=plugin (W20-20)" }
        key_handling_mode: { type: string, enum: [client_csr, hub_generated, hsm_resident_ca, macos_non_extractable], description: "W23-46: where the private key is created and held; omit to derive from install_mode. windows_cng and tpm are rejected (planned for v1.x). client_csr needs agent/acme/cloud, hub_generated needs ssh/f5/citrix/k8s/iis/sqlserver/rdp/plugin, macos_non_extractable needs keychain; hsm_resident_ca is a label accepted with any install_mode." }
        effective_key_handling_mode: { type: string, readOnly: true, enum: [client_csr, hub_generated, hsm_resident_ca, macos_non_extractable], description: "The explicit key_handling_mode, else the one derived from install_mode (W23-46). Never accepted in a request body." }
        credential_privileged: { type: boolean, readOnly: true, description: "The target's credential carries the privileged flag (W34-11). Response only." }
        renewal_privilege_required: { type: boolean, readOnly: true, description: "The latest scan found a service-attributed file that needs root to replace (W34-08). Response only." }
        last_privilege_mode: { type: string, readOnly: true, enum: [none, nopasswd, password, helper], description: "Privilege mode of the latest scan. Response only." }
        unreadable_count: { type: integer, readOnly: true, description: "Paths the latest scan could not read for lack of privilege. Response only." }
        last_scanned_at: { type: string, readOnly: true, format: date-time }
        blocked:
          type: object
          readOnly: true
          description: >-
            Present when renewal is Blocked. `privilege`: the target auto-renews, a
            file needs root to replace and the credential has sudo_mode none (the
            scheduler refuses to schedule it; clears when the credential gains a
            sudo mode or a scan sees the files standard). `rollback`: a failed
            rollback left the host in an unknown state (clears with
            POST /targets/{id}/unblock).
          required: [kind, reason, fix]
          properties:
            kind: { type: string, enum: [privilege, rollback] }
            reason: { type: string }
            fix: { type: string, description: The recipe that clears the block. }
            since: { type: string }
        plugin_settings: { type: object, additionalProperties: { type: string } }
        renewal_threshold_days:
          type: integer
          nullable: true
          description: >-
            Per-target auto-renew threshold in days, 1 to 365. 0 or omitted
            falls back to the scheduler's RENEWAL_THRESHOLD_DAYS env default.
            A hub-renewed successor is never held to more than half its own
            lifetime, so a large value cannot renew it on every tick.
        credential_ref: { type: string }
        schedule: { type: string }
        install_server_type: { type: string, enum: [nginx, apache, haproxy, tomcat, ""] }
        install_cert_path: { type: string }
        install_key_path: { type: string }
        install_reload_method: { type: string }
        verify_host_port: { type: string, description: "Optional host:port that scheduled renewals dial to verify the served leaf after install; default <host>:443." }
        auto_renew:
          type: boolean
          description: >-
            S-17: explicit opt-in for the hub-side renewal sweep. Requires
            credential_ref, plus for install_mode=ssh a complete install
            profile (server_type/cert_path/key_path); install_mode=keychain
            (macOS, W18-05) needs no profile. Other modes are not swept; the
            scheduler only notifies.
            Turning it on, naming a credential_ref or plugin_id, and (on an
            armed target) changing host or the install profile need
            certificate.renew; credential_ref needs pki-admin. The scheduler
            only pushes to a target whose auto_renew_set_by is set.
        auto_renew_set_by:
          type: string
          readOnly: true
          description: >-
            Principal that last configured this target's key egress while
            holding certificate.renew (RC1-A-01). Server-stamped; empty on a
            target armed before this field existed, which the scheduler then
            skips until auto_renew=true is saved again by an authorized
            principal.
        ssh_host_key: { type: string, description: "Confirmed SSH host key pin, authorized_keys format (W24-09)." }
        ssh_host_key_fingerprint: { type: string, readOnly: true, description: "SHA256 fingerprint of ssh_host_key; derived, never stored." }
        tenant: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CertTargetBinding:
      type: object
      description: >-
        W27-02: an operator's authorization to renew one certificate onto one
        managed target and push its private key there. The renewal scheduler
        auto-renews only bound pairs; a CN/SAN equal to the target host no
        longer arms anything. served_fingerprint is the certificate currently
        installed on the target and advances on every renewal.
      required: [cert_fingerprint, target_id, served_fingerprint, tenant, source, created_by, created_at, updated_at]
      properties:
        cert_fingerprint: { type: string, description: "SHA-256 fingerprint (64 hex) of the certificate bound" }
        target_id: { type: string }
        served_fingerprint: { type: string }
        tenant: { type: string }
        source: { type: string, enum: [operator, backfill], description: "backfill = migrated from a pre-W27-02 CN/SAN host match" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TargetGroup:
      type: object
      description: >-
        W27-04: a named set of targets sharing one renewal threshold. Members
        inherit renewal_threshold_days unless they carry their own
        (target > group > global default). A target belongs to at most one
        group; names are unique per tenant.
      required: [name, tenant, renewal_threshold_days, target_ids]
      properties:
        name: { type: string }
        tenant: { type: string }
        renewal_threshold_days: { type: integer, minimum: 1, maximum: 398 }
        target_ids: { type: array, items: { type: string } }

    TargetPolicyRow:
      type: object
      description: One target's effective renewal threshold and where it came from (W27-04).
      required: [target_id, name, host, group, own_days, group_days, default_days, effective_days, source]
      properties:
        target_id: { type: string }
        name: { type: string }
        host: { type: string }
        group: { type: string, description: "Empty when the target is in no group" }
        own_days: { type: integer, description: "The target's own override; 0 = none" }
        group_days: { type: integer, description: "The group's threshold; 0 = no group" }
        default_days: { type: integer, description: "The scheduler's global default now" }
        effective_days: { type: integer }
        source: { type: string, enum: [target, group, default] }

    ManagedTargetEndpointMatch:
      type: object
      description: >-
        One endpoint (scanned or agent-reported) whose observed host matches
        a managed target's declared host -- a heuristic string-equality
        join, not a foreign key.
      properties:
        source: { type: string, enum: [scanned, agent] }
        endpoint_id: { type: string }
        agent_id: { type: string }
        host: { type: string }
        port: { type: integer, nullable: true }
        server_type: { type: string }

    CryptoPostureReport:
      type: object
      properties:
        total_certs: { type: integer }
        generated_at: { type: string, format: date-time }
        pqc_readiness:
          type: object
          properties:
            quantum_safe: { type: integer, description: Full chain PQC (leaf key and every signature to the root). }
            quantum_safe_leaf_only: { type: integer, description: PQC subject key under a classical issuing chain; never counted as quantum_safe. }
            migration_ready: { type: integer, description: Short-lived classical certificates plus hybrid certificates. }
            vulnerable: { type: integer }
            not_applicable: { type: integer }
            pqc_score_percent: { type: integer, description: "PQC readiness: (quantum_safe + quantum_safe_leaf_only + migration_ready) / total_certs, integer percent." }
            quantum_safe_percent: { type: integer, description: "Full-chain quantum_safe / total_certs, integer percent." }
        expiry_buckets:
          type: object
          properties:
            expired: { type: integer }
            expiring_47d: { type: integer }
            expiring_90d: { type: integer }
            expiring_200d: { type: integer }
            expiring_1yr: { type: integer }
            unknown: { type: integer, description: Certificates whose valid_until is empty or unparseable. }
        grade_distribution:
          type: object
          additionalProperties: { type: integer }
        automation_coverage:
          type: object
          properties:
            automated: { type: integer }
            manual: { type: integer }
            automation_percent: { type: integer }
        risk_breakdown:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"

    AlgorithmSunsetReport:
      type: object
      description: >-
        Certificates grouped by the deprecation status of their signature
        algorithm. The path had no schema until S-39, so `gen:api-types` could
        not see it and the UI hand-rolled its own type behind an `as` cast --
        which drifted. Two field names are load-bearing and easy to get wrong:
        the Go field is `SunsetSummary` but serialises as `summary`, and
        `Recommended` serialises as `recommended_replacement`.
        Source of truth: internal/bootstrap/handlers_reports.go:1236.
      properties:
        generated_at: { type: string, format: date-time }
        total_certs: { type: integer }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SunsetAlgoGroup" }
        summary: { $ref: "#/components/schemas/SunsetAlgoSummary" }

    SunsetAlgoGroup:
      type: object
      properties:
        id:
          type: string
          description: Stable group key; the `sunset_group` filter of GET /certificates.
        algorithm: { type: string }
        deadline: { type: string, format: date-time, description: RFC 3339 date of ban }
        standard: { type: string }
        status: { type: string, enum: [banned, sunset_2030, sunset_2026, current] }
        urgency: { type: string, enum: [immediate, high, medium, low] }
        count: { type: integer }
        recommended_replacement: { type: string }
        fingerprints:
          type: array
          description: up to 20 examples
          items: { type: string }

    SunsetAlgoSummary:
      type: object
      properties:
        banned_now: { type: integer }
        sunset_2030: { type: integer }
        compliant: { type: integer }

    IssuanceVelocityReport:
      type: object
      description: >-
        Issuance velocity report with 7/30/90-day windows and anomaly
        detection. Anomaly detection requires a minimum sample of 5
        certificates in the last 30 days to avoid false positives on small
        deployments.
      properties:
        generated_at: { type: string, format: date-time }
        total_issued: { type: integer }
        windows:
          type: object
          properties:
            last_7d: { type: integer }
            last_30d: { type: integer }
            last_90d: { type: integer }
        daily_buckets:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        by_ca:
          type: object
          additionalProperties: { type: integer }
        by_team:
          type: object
          additionalProperties: { type: integer }
        by_template:
          type: object
          additionalProperties: { type: integer }
        anomaly_days:
          type: array
          description: Days with issuance > 2× the 30-day average (empty if sample < minimum)
          items: { type: string, format: date }
        anomaly_minimum_sample: { type: integer, description: Minimum number of certificates required in 30-day window for anomaly detection }
        anomaly_threshold_note: { type: string, description: Human-readable explanation of the anomaly threshold and whether detection is active }

    FindingFunnelSummary:
      type: object
      description: >-
        Finding funnel (docs/design/FINDING_ECONOMICS.md): raw -> deduped ->
        in_scope -> effective -> suppressed. `raw` is every finding the source
        layer produces on every read (computeRiskFlags for crypto-posture,
        cipheraudit issues and certificate flags for discovery). `deduped`
        collapses repeats of the same finding on the same target to one
        persisted identity (W22-29: certificate fingerprint + finding code,
        and for discovery the endpoint's tenant). `in_scope` equals `deduped`
        today: every funnel surface is a super-admin aggregate or already
        scoped at the source. `suppressed` is the in-scope identities that
        carry an active accepted-risk exception (FindingException, W2-06) and
        `effective` = in_scope - suppressed. Invariants:
        raw >= deduped >= in_scope >= effective, and
        effective + suppressed == in_scope. Raw is never replaced or omitted.
        Applicability re-checks remain future work. Exceptions are created
        through POST /exceptions and take effect only after a second approver
        approves them. Persisted posture snapshots written before W22-29 lack
        `deduped` and `in_scope` (they decode as 0): treat 0 alongside a
        non-zero `raw` as unknown.
      properties:
        raw: { type: integer }
        deduped: { type: integer }
        in_scope: { type: integer }
        effective: { type: integer }
        suppressed:
          type: integer
          description: >-
            In-scope findings covered by an active, approved accepted-risk
            exception (see /exceptions).

    ExecutiveSummary:
      type: object
      description: >-
        Matches internal/bootstrap/handlers_executive_summary.go's
        ExecutiveSummary struct — a board-readable one-pager composed from
        the crypto-posture and compliance-evidence computes. findings
        (W2-12) is the same exception-aware funnel CryptoPostureReport
        carries.
      properties:
        generated_at: { type: string, format: date-time }
        org: { type: string }
        total_certs: { type: integer }
        pqc_score_percent: { type: integer, description: "PQC readiness: (quantum_safe + quantum_safe_leaf_only + migration_ready) / total_certs, integer percent." }
        quantum_safe_percent: { type: integer, description: "Full-chain quantum_safe / total_certs, integer percent." }
        automation_percent: { type: integer }
        compliance_pass_percent: { type: integer }
        compliance:
          type: object
          properties:
            pass: { type: integer }
            warn: { type: integer }
            fail: { type: integer }
        expired: { type: integer }
        expiring_47d: { type: integer }
        expiry_unknown: { type: integer, description: Certificates whose valid_until is empty or unparseable. }
        risk_critical: { type: integer }
        risk_high: { type: integer }
        top_risks:
          type: array
          items: { type: string }
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"
        privileged_credentials: { $ref: "#/components/schemas/PrivilegedCredentialsSummary" }
        key_pqc:
          type: object
          description: >-
            Post-quantum readiness of cloud KMS and SSH keys from the unified
            key inventory. Omitted for tenant-scoped principals (keys are
            hub-wide). JSON only; the PDF one-pager does not render it.
          properties:
            ready: { type: integer, description: quantum_safe keys. }
            not_ready: { type: integer, description: Keys vulnerable to a quantum adversary. }
            unknown: { type: integer }
            total: { type: integer }
            errors:
              type: array
              items: { type: string }
              description: >-
                Providers that could not be read, as
                "cloud key inventory unavailable: <provider>".
        trend:
          type: object
          description: >-
            Posture trend, last 90 days, grade counts per snapshot (same
            snapshots as /reports/crypto-posture/trend). Omitted for
            tenant-scoped principals (snapshots are fleet-wide).
          properties:
            days: { type: integer }
            points:
              type: array
              items:
                type: object
                properties:
                  captured_at: { type: string, format: date-time }
                  total_certs: { type: integer }
                  grades:
                    type: object
                    additionalProperties: { type: integer }

    PQCMigrationTimeline:
      type: object
      description: >-
        Matches internal/pqc/planner.go's Timeline. Certificates are bucketed
        by the quarter their validity ends (their natural rotation point),
        from the current quarter through the quarter containing the CNSA 2.0
        deadline (2030-Q1). due = hybrid/migration_ready/vulnerable certs
        still to migrate; migrated = full-chain quantum_safe certs.
        quantum_safe_leaf_only and not_applicable certs are in neither.
        expire_before_2030 / expire_after_2030 split the due population by
        validity end relative to the deadline.
      required: [quarters, expire_before_2030, expire_after_2030]
      properties:
        quarters:
          type: array
          items:
            type: object
            required: [quarter, due, migrated]
            properties:
              quarter: { type: string, example: "2027-Q3" }
              due: { type: integer }
              migrated: { type: integer }
        expire_before_2030: { type: integer }
        expire_after_2030: { type: integer }

    PQCMigrationRoadmap:
      type: object
      description: Matches internal/pqc/planner.go's MigrationRoadmap.
      properties:
        generated_at: { type: string, format: date-time }
        total_certs: { type: integer }
        vulnerable: { type: integer }
        migration_ready: { type: integer }
        quantum_safe: { type: integer }
        quantum_safe_leaf_only: { type: integer }
        not_applicable: { type: integer }
        pqc_score_percent: { type: integer }
        quantum_safe_percent: { type: integer }
        items:
          type: array
          nullable: true
          items:
            type: object
            properties:
              fingerprint: { type: string }
              common_name: { type: string }
              priority: { type: string, enum: [critical, high, medium, low] }
              reason: { type: string }
              action: { type: string }
              deadline: { type: string, format: date-time }
        timeline:
          $ref: "#/components/schemas/PQCMigrationTimeline"

    PQCCountdownReport:
      type: object
      description: >-
        Matches internal/bootstrap/handlers_pqc_countdown.go's
        PQCCountdownReport struct — PQC readiness against the CNSA 2.0 /
        NIST 800-131A deadlines, trending over time. findings (W2-12) is the
        same exception-aware funnel CryptoPostureReport carries.
      properties:
        generated_at: { type: string, format: date-time }
        org: { type: string }
        total_certs: { type: integer }
        vulnerable: { type: integer }
        migration_ready: { type: integer }
        quantum_safe: { type: integer }
        quantum_safe_leaf_only: { type: integer }
        pqc_score_percent: { type: integer, description: "PQC readiness: (quantum_safe + quantum_safe_leaf_only + migration_ready) / total_certs, integer percent." }
        quantum_safe_percent: { type: integer, description: "Full-chain quantum_safe / total_certs, integer percent." }
        status: { type: string, enum: [complete, on_track, at_risk, behind] }
        deadlines:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              date: { type: string, format: date }
              days_remaining: { type: integer }
              passed: { type: boolean }
        trend:
          type: array
          items:
            type: object
            properties:
              captured_at: { type: string, format: date-time }
              pqc_score_percent: { type: integer }
        waves:
          type: array
          items:
            $ref: "#/components/schemas/MigrationWave"
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"

    ApprovalRequest:
      type: object
      properties:
        id: { type: string }
        template_id: { type: string }
        ca_id: { type: string }
        requester: { type: string }
        team_id: { type: string }
        on_behalf_of: { type: string, description: "W33-23: the delegator a delegate filed this request for; requester is the delegate and team_id is the delegator" }
        status: { type: string, enum: [pending, approved, rejected] }
        kind: { type: string, enum: [x509, ssh], description: "ssh = a pending POST /ssh/certificates request (no CA or CSR; ca_id and csr_pem are empty)" }
        requested_at: { type: string, format: date-time }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time, nullable: true }
        reason: { type: string }

    AcceptedRisk:
      type: object
      description: An active accepted-risk exception shown in the evidence pack (W22-32).
      properties:
        id: { type: string }
        target_type: { type: string, enum: [certificate, ca, target_file] }
        target_id: { type: string }
        finding_code: { type: string }
        justification_code: { type: string }
        justification_note: { type: string }
        owner_team: { type: string, description: Empty for CA targets and unowned certificates }
        owner_email: { type: string }
        target_label: { type: string, description: "host:path of a target_file exception's file" }
        created_by: { type: string }
        created_at: { type: string }
        expires_at: { type: string }

    ComplianceEvidenceReport:
      type: object
      properties:
        generated_at: { type: string }
        framework: { type: string }
        controls:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              framework: { type: string }
              title: { type: string }
              status: { type: string, enum: [pass, warn, fail, attested, pending], description: "attested and pending apply to type manual controls only" }
              evidence: { type: string }
              remediation: { type: string }
              type: { type: string, enum: [manual], description: "Present for human-attested controls; they never count toward summary" }
              attester: { type: string, description: Named attester of a current manual attestation }
              attested_at: { type: string, description: RFC3339 time of the current attestation }
              rule: { type: string, description: The pass/warn/fail rule applied to this control }
              artifacts:
                type: array
                description: Evidence artifacts that substantiate the control
                items:
                  type: object
                  properties:
                    kind: { type: string, enum: [inventory_export, findings_export, audit_extract, custody_report, cbom, ca_health] }
                    id: { type: string }
                    url: { type: string }
        summary:
          type: object
          properties:
            pass: { type: integer }
            warn: { type: integer }
            fail: { type: integer }
        key_custody:
          type: object
          nullable: true
          description: Key custody section (same shape as /reports/key-custody data); tenant-filtered; absent when key_custody_note is set.
          additionalProperties: true
        key_custody_note: { type: string, description: Why key_custody is absent }
        accepted_risks:
          type: array
          description: Every active accepted-risk exception in the caller's scope (tenant-scoped); [] when none.
          items:
            $ref: "#/components/schemas/AcceptedRisk"

    ComplianceAttestation:
      type: object
      properties:
        id: { type: string }
        control_id: { type: string }
        attester_name: { type: string }
        attested_by: { type: string, description: Principal that recorded the attestation }
        note: { type: string }
        attested_at: { type: string }

    ExceptionRequest:
      type: object
      required: [target_type, target_id, finding_code, justification_code, expires_at]
      properties:
        target_type: { type: string, enum: [certificate, ca, target_file] }
        target_id: { type: string, description: Certificate fingerprint, CA id, or (target_file) the discovered file id from install_posture.file_id; wildcards are refused }
        finding_code: { type: string }
        justification_code:
          type: string
          enum: [risk_accepted, compensating_control, false_positive, planned_remediation, not_applicable]
        justification_note: { type: string, maxLength: 1000 }
        expires_at: { type: string, format: date-time }

    Exception:
      type: object
      properties:
        id: { type: string }
        target_type: { type: string, enum: [certificate, ca, target_file] }
        target_id: { type: string }
        finding_code: { type: string }
        justification_code: { type: string }
        justification_note: { type: string }
        created_by: { type: string }
        created_at: { type: string }
        expires_at: { type: string }
        status: { type: string, enum: [active, pending] }
        pending_action_id: { type: string }
        target_label: { type: string, description: "host:path of a target_file exception's file" }

    PendingAction:
      type: object
      properties:
        id: { type: string }
        action_type: { type: string, enum: [revoke, bulk_revoke] }
        params: { type: object }
        rationale: { type: string }
        proposed_by: { type: string }
        status: { type: string, enum: [pending, approved, rejected, failed] }
        tenant: { type: string }
        quorum_n: { type: integer, minimum: 1, description: Distinct human approvals required; stamped at proposal time from APPROVAL_QUORUM_POLICY (default 1). }
        quorum_m: { type: integer, minimum: 1 }
        approvals_count: { type: integer, minimum: 0, description: Distinct humans who have approved so far. }
        created_at: { type: string, format: date-time }

    ApprovalInboxItem:
      type: object
      properties:
        type: { type: string, enum: [certificate_approval, pending_action] }
        id: { type: string }
        summary: { type: string }
        requester: { type: string }
        tenant: { type: string }
        created_at: { type: string, format: date-time }
        age_seconds: { type: integer }
        action_type: { type: string }

    ApprovalDelegation:
      type: object
      properties:
        delegator: { type: string }
        delegate: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        tenant: { type: string }

    KeyMetadata:
      type: object
      properties:
        id: { type: string }
        algorithm: { type: string }
        created_at: { type: string, format: date-time }
        rotated_at: { type: string, format: date-time, nullable: true }
        state:
          type: string
          enum: [pending_deletion]
          description: >-
            Absent for a live key. `pending_deletion` marks a cloud-KMS key inside
            its provider recovery window; cancel it at POST /keys/{id}/cancel-deletion.
        deletion_scheduled_at:
          type: string
          format: date-time
          description: When the provider purges a pending_deletion key for good.

    DiscoverySchedule:
      type: object
      required: [key, scan_type, target, source, interval_seconds, effective_interval_seconds, last_run, next_run, running, running_job_id]
      properties:
        key: { type: string }
        scan_type: { type: string, enum: [targeted, winrm, ssh] }
        target: { type: string }
        source: { type: string, enum: [env, managed] }
        name: { type: string, description: Managed target name }
        interval_seconds: { type: integer, nullable: true, description: This target's own interval; null follows the global one }
        effective_interval_seconds: { type: integer, nullable: true }
        last_run: { type: string, format: date-time, nullable: true }
        next_run: { type: string, format: date-time, nullable: true }
        running: { type: boolean }
        running_job_id: { type: string }

    DiscoveryScanJob:
      type: object
      description: >-
        Matches internal/bootstrap/discovery_provider.go's DiscoveryScanJob
        struct. All three provider implementations (db/file/scanner) now
        emit exactly this canonical status set (G-87/S-23 normalized a
        "complete" vs "completed" inconsistency in the db-mode provider).
      properties:
        id: { type: string }
        scan_type: { type: string }
        target: { type: string }
        status:
          type: string
          enum: [queued, running, completed, completed_with_errors, failed, cancelled]
          description: >-
            `completed_with_errors`: the scan ran and recorded what it found,
            but some hosts answered and failed (plain HTTP on a TLS port, a
            failed handshake) -- see `error` for which.
        queued_at: { type: string, format: date-time }
        error:
          type: string
          description: >-
            Why a job failed, or for `completed_with_errors` which hosts
            answered but could not be read and how many closed ports were not
            recorded. Absent for a clean run. Truncated to 500 characters.

    OperationEvent:
      type: object
      description: >-
        Matches internal/bootstrap/event_bus.go's Event struct -- the stable
        envelope every GET /events `data:` line carries (W8-14). `status`
        reuses DiscoveryScanJob.status's vocabulary verbatim rather than a
        parallel one. `op_id` is the id the client already holds from the
        call that started the operation (e.g. DiscoveryScanJob.id from POST
        /discovery/scans) -- correlation needs no new lookup. Producers: `scan`
        (discovery scan create/cancel/requeue), `renew` (op_id is the
        certificate fingerprint), `install` (op_id is the agent task id) and
        `migrate` (op_id is the PQC wave id) (W30-13). Each frame also
        carries an SSE `id:` line for Last-Event-ID resume; the id is not
        part of this envelope.
      required: [op_id, kind, status, progress, message, ts]
      properties:
        op_id: { type: string }
        kind: { type: string, enum: [scan, renew, install, migrate] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        progress:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Null when the operation cannot report a percentage.
        message: { type: string }
        ts: { type: string, format: date-time }

    DiscoverySummary:
      type: object
      description: >-
        Matches internal/bootstrap/discovery_provider.go's DiscoverySummary
        struct returned by DiscoveryProvider.GetSummary, including its
        `findings` sub-object (json tag "findings", same nesting
        CryptoPostureReport uses). IMPORTANT (W2-11): raw/effective/suppressed
        are computed correctly server-side by the db-mode discovery provider
        (dbDiscoveryProvider.GetSummary), sourced from EndpointTLSConfig.Issues
        (internal/cipheraudit) per docs/design/FINDING_ECONOMICS.md — see
        FindingFunnelSummary for what those three fields mean and don't mean.
        `findings` is declared here, and deliberately left out of `required`,
        so ui/'s generated TypeScript type carries the field for W3-02 to
        build against. Both GET /discovery/summary (data.findings) and
        GET /dashboard/summary (data.discovery.findings) copy this field
        into their response body as of W2-11. File-store/scanner-backed
        discovery providers (non-"db" APP_DISCOVERY_PROVIDER modes) leave
        `findings` zero-valued — only the db-mode provider populates it.
      properties:
        discovered_endpoints: { type: integer }
        mapped_certificates: { type: integer }
        risky_endpoints: { type: integer }
        active_scan_jobs: { type: integer }
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"
        trust_classes:
          $ref: "#/components/schemas/TrustClassCounts"
        inventory_classes:
          $ref: "#/components/schemas/InventoryClassCounts"

    DashboardSummary:
      type: object
      description: >-
        Matches internal/bootstrap/handlers_dashboard.go's GET
        /dashboard/summary response struct. `discovery` is a narrower
        projection of DiscoverySummary (no mapped_certificates) but carries
        the same `findings` sub-object (W2-11) — see FindingFunnelSummary.
      properties:
        resource: { type: string }
        principal: { type: string }
        certificates:
          type: object
          properties:
            total:
              type: integer
              description: >-
                Active certificates: not revoked and not superseded by a
                renewal. Expiring/expired counts use the same rule.
            revoked:
              type: integer
              description: Revoked certificates, reported separately from `total`.
            expiring_30_days: { type: integer }
            expired: { type: integer }
            unowned:
              type: integer
              description: >-
                Active certificates with no owner team (W22-24). Equals the
                `meta.total` of `GET /certificates?owner=unassigned`.
            source: { type: string }
        discovery:
          type: object
          properties:
            discovered_endpoints: { type: integer }
            risky_endpoints: { type: integer }
            active_scan_jobs: { type: integer }
            findings:
              $ref: "#/components/schemas/FindingFunnelSummary"
            trust_classes:
              $ref: "#/components/schemas/TrustClassCounts"
        notifications:
          type: object
          properties:
            pending_notifications: { type: integer }
            escalations: { type: integer }

    RenewalSloBudget:
      type: object
      description: 30-day error budget and burn rates for one ratio SLO (history is in-memory; a hub restart restarts the window)
      required: [name, objective, window_days, has_data, budget_remaining_pct, burn_rate_1h, burn_rate_6h, breached]
      properties:
        name: { type: string }
        objective: { type: number }
        window_days: { type: integer }
        has_data: { type: boolean }
        budget_remaining_pct: { type: number, minimum: 0, maximum: 100 }
        burn_rate_1h: { type: number }
        burn_rate_6h: { type: number }
        breached: { type: boolean }

    RenewalSloReport:
      type: object
      required: [slos]
      properties:
        generated_at: { type: string }
        agents_total: { type: integer }
        agents_active: { type: integer }
        endpoints_managed: { type: integer }
        outcomes:
          type: object
          additionalProperties: { type: integer }
        total_renewals: { type: integer }
        success_rate_percent: { type: integer }
        mean_time_to_renew_secs: { type: integer }
        mttr_samples: { type: integer }
        failed_renewals:
          type: array
          items: { type: object, additionalProperties: true }
        queue:
          type: object
          additionalProperties: true
          description: W27-33 renewal sweep backlog and per-connector throttle state
        slos:
          type: array
          items:
            $ref: "#/components/schemas/RenewalSloBudget"

    EvidenceSchedule:
      type: object
      properties:
        id: { type: string }
        framework: { type: string }
        cadence: { type: string, enum: [weekly, monthly], description: "Unknown values are treated as weekly." }
        recipients:
          type: array
          items: { type: string, format: email }
        enabled: { type: boolean, default: true, description: "Omitted means enabled." }
        last_sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ReportSchedule:
      type: object
      required: [report, format, recipients]
      properties:
        id: { type: string }
        report: { type: string, description: A report name from GET /reports/schedules/catalog }
        format: { type: string, enum: [csv, xlsx, pdf] }
        cadence: { type: string, enum: [daily, weekly, monthly], default: monthly }
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: email }
        enabled: { type: boolean, default: true }
        last_sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    MigrationWave:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        owner: { type: string }
        target_date: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [proposed, accepted, in_progress, done, regressed] }
        members:
          type: array
          items:
            type: object
            properties:
              fingerprint: { type: string }
              common_name: { type: string }
              delivery_status: { type: string, enum: [delivery_unsupported, failed], description: "Latest wave-execution delivery outcome; present only when the successor was issued but not delivered (W31-21)." }
        total: { type: integer }
        migrated: { type: integer, description: "Members whose current certificate is PQC and not undelivered." }
        undelivered: { type: integer, description: "Members whose latest wave execution issued a successor that was not delivered to its endpoint (delivery_unsupported or failed); never counted as migrated, and the wave cannot reach done while any exist (W31-21, D-105)." }
        leaf_only: { type: integer, description: "Members whose current certificate is a PQC leaf under a classical chain (D-104); a wave with any never reports done." }
        progress_percent: { type: integer }

    Tenant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }

    APIKeyRecord:
      type: object
      properties:
        name: { type: string }
        kid: { type: string }
        key_prefix: { type: string }
        principal_id: { type: string }
        role: { type: string }
        scopes:
          type: array
          items: { type: string }
        active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, description: "Stamped at most once a minute; omitted for a never-used key. Config-loaded keys lose it on restart." }
        tenant: { type: string }
    AccessReviewPrincipal:
      type: object
      required: [kind, id, name, role, tenant, source, status, dormant, approver_capable]
      properties:
        kind: { type: string, enum: [user, api_key] }
        id: { type: string, description: "User id, or the API key id (kid)." }
        name: { type: string, description: "User email or API key name." }
        role: { type: string }
        tenant: { type: string, description: "The principal's own tenant (DefaultTenant when none was stamped)." }
        source: { type: string, enum: [local, sso, scim], description: "Derived from the audit trail; API keys are always local." }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string }
        created_by: { type: string }
        last_activity_at: { type: string, description: "RFC 3339; omitted when the principal has never been active." }
        dormant: { type: boolean, description: "Active, and idle for more than the dormant threshold (never-active accounts age from creation)." }
        approver_capable: { type: boolean, description: "The role holds action.approve." }
    AccessReviewRoleChange:
      type: object
      required: [timestamp, action, actor, resource_type, resource_id, outcome]
      properties:
        timestamp: { type: string, format: date-time }
        action: { type: string }
        actor: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        outcome: { type: string }
    PrivilegedCredentialsSummary:
      type: object
      description: >-
        Outbound credentials flagged high-impact on the hosts they reach
        (W34-11, D-208), with those hosts. Flag and audit only; no approval gate.
      required: [count, host_count, credentials]
      properties:
        count: { type: integer }
        host_count: { type: integer }
        credentials:
          type: array
          items:
            type: object
            required: [id, name, source, hosts]
            properties:
              id: { type: string }
              name: { type: string }
              reason: { type: string }
              source: { type: string, enum: [auto, manual] }
              set_at: { type: string }
              hosts: { type: array, items: { type: string } }
              last_used: { type: string, description: Latest scan of a target that uses the credential. }
    AccessReviewReport:
      type: object
      required: [generated_at, period_start, period_end, dormant_days, principals, role_changes, totals]
      properties:
        generated_at: { type: string, format: date-time }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        dormant_days: { type: integer }
        principals:
          type: array
          items: { $ref: "#/components/schemas/AccessReviewPrincipal" }
        role_changes:
          type: array
          items: { $ref: "#/components/schemas/AccessReviewRoleChange" }
        totals:
          type: object
          required: [users, api_keys, dormant, role_changes]
          properties:
            users: { type: integer }
            api_keys: { type: integer }
            dormant: { type: integer }
            role_changes: { type: integer }
        truncated: { type: boolean, description: "Role changes were capped at 5000 rows." }
        privileged_credentials: { $ref: "#/components/schemas/PrivilegedCredentialsSummary" }
    AccessReviewEntry:
      allOf:
        - $ref: "#/components/schemas/AccessReviewPrincipal"
        - type: object
          required: [entry_id, executed, decision_status]
          properties:
            entry_id: { type: string, description: "kind:id, e.g. user:u1 or api_key:kid." }
            decision: { type: string, enum: [keep, revoke, modify] }
            new_role: { type: string }
            note: { type: string }
            decided_by: { type: string, description: "Canonical human of the first reviewer." }
            decided_at: { type: string, format: date-time }
            second_reviewer: { type: string, description: "Set when a held revoke of an approver-capable user was completed by a different human." }
            executed: { type: boolean }
            decision_status: { type: string, enum: [undecided, pending_second, decided] }
    AccessReviewCampaign:
      type: object
      required: [id, name, status, tenant, period_start, period_end, opened_by, opened_at]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [open, closing, closed] }
        tenant: { type: string, description: "Owning tenant, or '*' for an instance-wide campaign opened by an unscoped super-admin (visible to super-admins only)." }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        opened_by: { type: string }
        opened_at: { type: string, format: date-time }
        closed_by: { type: string }
        closed_at: { type: string, format: date-time }
        report_sha256: { type: string, description: "SHA-256 of the CSV export, recorded in the access_review.close audit row." }
        entries:
          type: array
          items: { $ref: "#/components/schemas/AccessReviewEntry" }
    BreakGlassActivation:
      type: object
      required: [id, reason, status, requested_by, requested_at]
      properties:
        id: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending, active, expired] }
        requested_by: { type: string, description: "Canonical human of the first holder." }
        confirmed_by: { type: string, description: "Canonical human of the second, different holder." }
        requested_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "activated_at + 4 h." }
    BreakGlassReview:
      type: object
      required: [id, activation_id, status, opened_at, due_at, use_count, actors, overdue]
      properties:
        id: { type: string }
        activation_id: { type: string, description: "The review scope: act-<activation id>, or local-login for the break-glass local login." }
        status: { type: string, enum: [open, completed] }
        opened_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time, description: "opened_at + 24 h." }
        completed_by: { type: string }
        completed_at: { type: string, format: date-time }
        outcome: { type: string, enum: [justified, unjustified] }
        notes: { type: string }
        use_count: { type: integer }
        actors: { type: array, items: { type: string }, description: "Principals whose use opened or extended the review; none of them may complete it." }
        overdue: { type: boolean }

paths:
  # ── Meta / infra (root-scoped, not /api/v1) ─────────────────────────────────

  /:
    servers:
      - url: /
    get:
      operationId: getRootBanner
      summary: Root banner (plain text)
      tags: [Meta]
      security: []
      responses:
        "200":
          description: Plain-text banner

  /healthz:
    servers:
      - url: /
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [Meta]
      security: []
      responses:
        "200":
          description: '{"status":"ok"}'

  /readyz:
    servers:
      - url: /
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags: [Meta]
      security: []
      responses:
        "200":
          description: '{"status":"ready"}'

  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: This API's OpenAPI document
      description: Serves the exact docs/openapi.yaml the hub was built from. Unauthenticated, read-only, not audited.
      tags: [Meta]
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
  /meta:
    get:
      operationId: getServiceMeta
      summary: Service metadata
      tags: [Meta]
      security: []
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string
                    description: >-
                      Deployment environment name from KRYPTKEEPER_ENV (APP_ENV when unset).
                      `kryptkeeper demo seed` refuses a hub that reports `production`.
                  fips:
                    type: object
                    description: Live FIPS 140-3 posture of this process (W23-32).
                    properties:
                      mode_140_3:
                        type: boolean
                      enforced:
                        type: boolean
                      module_version:
                        type: string
                      root_hsm_required:
                        type: boolean

  /demo/status:
    get:
      operationId: getDemoStatus
      summary: Whether this hub holds demo data (W37-07)
      description: >-
        `demo` is true after `kryptkeeper demo seed` has set the `demo.seeded_at`
        runtime setting and false after `kryptkeeper demo reset` cleared it. The UI
        shows its Demo data banner from this. The marker is written through
        `PUT /config/demo.seeded_at` (audited as config.set and demo.marker.update),
        which a hub with KRYPTKEEPER_ENV=production refuses with 409.
      tags: [Meta]
      responses:
        "200":
          description: Demo marker
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      demo: { type: boolean }
                      seeded_at: { type: string, format: date-time, description: Present when demo is true. }
        "401":
          description: Unauthorized
        "503":
          description: Config store unavailable

  # ── Certificates ──────────────────────────────────────────────────────────

  /certificate-requests:
    post:
      operationId: createCertificateRequestOnBehalf
      summary: File a certificate request on behalf of another principal's team (W33-23)
      description: |
        A delegate with an active, tenant-scoped approval delegation from
        `on_behalf_of` files a request that always goes to approval. The request
        is enforced against, and consumes the quota of, the delegator's team.
        The audit trail records the requester (delegate), `on_behalf_of` and the
        approver. 403 `error_code`: `obo_no_delegation`, or a team policy code.
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ca_id, template_id, csr_pem, on_behalf_of]
              properties:
                ca_id: { type: string }
                template_id: { type: string }
                csr_pem: { type: string }
                on_behalf_of: { type: string, description: "The delegator's principal id (also their team_id)" }
      responses:
        "202":
          description: Pending approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending_approval] }
                  approval_id: { type: string }
                  message: { type: string }
        "400":
          description: Invalid body, or on_behalf_of names the caller
        "401":
          description: Unauthenticated
        "403":
          description: No active delegation (obo_no_delegation), tenant visibility, or team policy / quota refusal

  /certificates:
    get:
      operationId: listCertificates
      summary: List certificates
      tags: [Certificates]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: integer }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: ca_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked] }
        # W11-01 estate model (V5/D-106): every certificate carries
        # origin + management_state; both are filterable and returned on
        # every certificate object.
        - name: origin
          in: query
          schema: { type: string, enum: [internal, imported, discovered, synced] }
        - name: management_state
          in: query
          schema: { type: string, enum: [managed, external, unmanaged] }
        - name: owner
          in: query
          description: >-
            `unassigned` keeps active certificates with no owner team (W22-24);
            the dashboard `certificates.unowned` count is the same predicate.
          schema: { type: string, enum: [unassigned] }
        - name: trust_class
          in: query
          description: >-
            Keep certificates of one trust class. Served-chain intermediates
            and roots (discovery) are never listed.
          schema:
            $ref: "#/components/schemas/TrustClass"
        - name: sunset_group
          in: query
          description: >-
            Keep the active certificates of one Algorithm Sunset group, by the
            `id` of a `groups[]` entry of GET /reports/algorithm-sunset. The
            list total equals that group's `count`. An unknown id is a 400.
          schema:
            type: string
            enum: [weak_signature, weak_rsa_key, rsa2048_post2030, ecc224_post2030, validity_397_days, pqc_vulnerable]
      responses:
        "200":
          description: >-
            Certificate list. Each item includes `origin`
            (internal|imported|discovered|synced) and `management_state`
            (managed|external|unmanaged) — the W11-01 estate model. The
            dashboard summary carries the matching managed/external/unmanaged
            counts.
        "401":
          description: Unauthorized

    post:
      operationId: issueCertificate
      summary: Issue certificate from CSR
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ca_id, template_id, csr_pem]
              properties:
                ca_id: { type: string }
                template_id: { type: string }
                csr_pem:
                  type: string
                  description: |
                    PEM-encoded PKCS#10 request. Accepted labels: `CERTIFICATE REQUEST`
                    (RSA, ECDSA, Ed25519, and ML-DSA-44/65/87 as emitted by OpenSSL 3.5+;
                    ML-DSA is detected from the public-key algorithm OID, not the label),
                    `ML-DSA CERTIFICATE REQUEST`, and `HYBRID CERTIFICATE REQUEST`.
                    The request's self-signature is always verified.
                team_id: { type: string }
                metadata:
                  type: object
                  additionalProperties: true
                  description: |
                    Optional request metadata. With `KRYPTKEEPER_CODESIGN_PROTECTED=true`, a CSR for a
                    code-signing template must carry `attestation` (FR-P92); the hub refuses it with 422
                    unless the attestation chains to a trusted vendor root and attests the CSR's own key.
                  properties:
                    attestation:
                      type: object
                      required: [format, certificate_pem]
                      properties:
                        format: { type: string, enum: [yubikey-piv] }
                        certificate_pem: { type: string, description: "PIV slot attestation certificate (max 16 KiB)." }
                        intermediates_pem:
                          type: array
                          maxItems: 3
                          items: { type: string, description: "Intermediate (for YubiKey, the f9 certificate)." }
      responses:
        "200":
          description: >-
            Idempotent repeat: the same public key, CA, template, team, subject CN and SAN set already
            has an unrevoked certificate with at least a third of its validity left, so that certificate
            is returned (same body shape as 201, no new serial). Audited as certificate.issue success with
            detail {"reused":true,"serial":...}. Policy checks run first; a refused request is still refused.
        "201":
          description: Certificate issued
        "202":
          description: >-
            Pending approval (template requires an approval gate). A repeat POST for the same CA, template,
            public key and requester returns the same approval_id instead of queuing a second one.
        "400":
          description: Invalid request body, or a CSR whose signature does not verify or whose key type is unsupported
        "401":
          description: Unauthorized
        "403":
          description: >-
            Team/tenant scope denied, the caller's role is not in the template's enrollment_permissions
            (audited as issuance.denied_template_role), or the team's policy or monthly quota refuses the
            request (W33-21). The body carries a non-empty `error_code` and a specific `message`. A policy
            refusal is audited as certificate.issue denied; an exhausted quota as request.quota_exceeded.
        "409":
          description: The issuing CA is not active or has no signing key (imported without a private key)
        "503":
          description: Team policy or quota could not be evaluated; issuance is refused (fail closed).
        "429":
          description: The external CA's upstream is rate limiting (error upstream_rate_limited); Retry-After when the upstream sent one.
        "502":
          description: >-
            External CA (W36): upstream_issue_failed when the upstream refused or could not be reached, or
            upstream_response_rejected when it returned a certificate that does not match the request
            (audited as certificate.issue.upstream_rejected). Nothing is stored.
        "422":
          description: >-
            Refused by template or issuance policy (for example a key below min_key_size, a disallowed
            EKU or SAN). Body is {"error":"policy_violation","message":"..."} and the message names the
            rule. Nothing is signed. 422, not 400: the request is well-formed but policy refuses it.
            Includes a missing, forged or key-mismatched hardware attestation in protected
            code-signing mode.

  /certificates/quota:
    get:
      operationId: getCertificateQuota
      summary: Team issuance quota usage for the current UTC month
      description: >-
        A team principal reads its own team; an admin names the team with `team_id` (and optionally
        `tenant`). A team with no policy, or a quota of 0 (unlimited), reports limit 0 and remaining null.
      tags: [Certificates]
      parameters:
        - { name: team_id, in: query, required: false, schema: { type: string }, description: Required for admins. }
        - { name: tenant, in: query, required: false, schema: { type: string }, description: Tenant-bypass principals only. }
      responses:
        "200":
          description: Quota usage
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [team_id, period, limit, used, remaining, warn, resets_at]
                    properties:
                      team_id: { type: string }
                      period: { type: string, description: UTC month YYYY-MM }
                      limit: { type: integer }
                      used: { type: integer }
                      remaining: { type: [integer, "null"], description: Null when the quota is unlimited (limit 0). }
                      warn: { type: boolean, description: True at or above 80 percent of the limit. }
                      resets_at: { type: string, format: date-time }
        "400": { description: team_id missing for an admin }
        "401": { description: Unauthorized }
        "503": { description: Quota could not be read }

  /certificates/import:
    post:
      operationId: importCertificate
      summary: Import an externally-issued certificate
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                certificate_pem: { type: string }
                team_id: { type: string }
      responses:
        "201":
          description: Certificate imported
        "409":
          description: Fingerprint already exists

  /certificates/{fingerprint}:
    get:
      operationId: getCertificate
      summary: Get certificate detail
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Certificate detail
        "304":
          description: Not modified (If-None-Match matched)
        "404":
          description: Not found

  /certificates/{fingerprint}/chain:
    get:
      operationId: getCertificateChain
      summary: Get certificate's issuance chain
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Chain
        "404":
          description: Not found

  /certificates/{fingerprint}/revoke:
    post:
      operationId: revokeCertificate
      summary: Revoke certificate
      description: >-
        D-306: a certificate issued through an external CA, or renewed through
        a connector that can revoke, is revoked at the upstream CA first. If
        the upstream accepts, the certificate is marked revoked with
        `revocation_scope` `upstream`. If it refuses or is unreachable the
        certificate is NOT marked revoked (502). `scope=inventory_only`
        (admin only) records the revocation here without asking the upstream,
        for an operator who already revoked it at the CA.
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [inventory_only] }
          description: Record the revocation in this hub only. Admin only.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: integer }
                reason_text: { type: string, maxLength: 500 }
                scope:
                  type: string
                  enum: [inventory_only]
                  description: Same as the `scope` query parameter; the query wins when both are sent.
      responses:
        "200":
          description: Revoked (see `data.revocation_scope`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CertificateRevokeResult" }
        "403":
          description: A non-admin set `scope`
        "409":
          description: >-
            Already revoked, or the connector cannot revoke upstream (error
            `upstream_revoke_unsupported`; use `scope=inventory_only`)
        "502":
          description: >-
            The upstream CA refused or could not be reached (error
            `upstream_revoke_failed`, message scrubbed of secrets). The
            certificate is not marked revoked.

  /connectors:
    get:
      operationId: listConnectors
      summary: List issuer connectors with live health (W11-03)
      tags: [Connectors]
      responses:
        "200":
          description: >-
            Connector rows, each with a live health probe (status
            healthy|degraded|unknown + detail). A type with no runtime
            implementation yet reports unknown with a reason — a visible
            state, never a dropped row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type: { type: string, enum: [internal, acme, digicert, scep, est, wstep, vault_pki, ejbca, aws_pca, gcp_cas, sectigo, globalsign, entrust] }
                        config_json: { type: string }
                        credential_ref: { type: string }
                        tenant: { type: string }
                        health:
                          type: object
                          properties:
                            status: { type: string, enum: [healthy, degraded, unknown] }
                            detail: { type: string }
    post:
      operationId: createConnector
      summary: Create an issuer connector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [internal, acme, digicert, scep, est, wstep, vault_pki, ejbca, aws_pca, gcp_cas, sectigo, globalsign, entrust] }
                config_json: { type: string, description: "No secrets — credentials go in credential_ref (W5-10 store). For acme connectors with dns-01: optional dns_propagation (auto|authoritative|resolver|doh|none), dns_resolver, dns_doh_url, dns_propagation_timeout (max 10m), dns_propagation_delay; see docs/ops/ACME_UPSTREAM.md. Upstream types (W27-35), all non-secret: digicert {base_url?, organization_id, product_name_id?, validity_years?}; scep {endpoint_url}; est {base_url, username}; wstep {endpoint_url, username, template_name}. W36 upstream CAs: vault_pki {base_url, role, mount?, namespace?, ttl?, approle_mount?, ca_cert_pem?}; ejbca {base_url, certificate_profile_name, end_entity_profile_name, certificate_authority_name, username_prefix?, ca_cert_pem?}; aws_pca {certificate_authority_arn, region, signing_algorithm?, validity_days?, template_arn?, endpoint_url?, auth? static|ambient}; gcp_cas {project, location, ca_pool, certificate_authority_id?, certificate_template?, lifetime_days?, auth? service_account|ambient}; sectigo {base_url?, customer_uri, org_id, cert_type, term_days}; globalsign {base_url?, validity_days?, ca_cert_pem?}; entrust {base_url?, client_id, cert_type, validity_days|cert_lifetime, requester_name, requester_email, requester_phone}. Secrets and mTLS client cert/key go in the credential store (docs/ops/UPSTREAM_CAS.md). api_key, password, secret or token anywhere in config_json is refused 400." }
                credential_ref: { type: string }
      responses:
        "201":
          description: Connector created
        "400":
          description: Invalid name, type, config (missing required field, forbidden secret key) or credential_ref (required for digicert, est and wstep; secrets - digicert {api_key}, est/wstep {password} - live only in the credential store)

  /connectors/dcv-validations:
    get:
      operationId: listDcvValidations
      summary: Per-domain DCV validation lifetime (W27-24)
      description: >-
        When each domain was last validated through an ACME connector, the
        days left on the CA/B Forum reuse schedule, and the schedule itself.
        warn is true once 20% or less of the reuse period remains; a
        dcv.expiry_warning audit event fires once per validation at that point.
      tags: [Connectors]
      responses:
        "200":
          description: Validations visible to the caller's tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        domain: { type: string }
                        connector_id: { type: string }
                        validated_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        reuse_days: { type: integer }
                        days_remaining: { type: integer }
                        warn: { type: boolean }
                  schedule:
                    type: array
                    items:
                      type: object
                      properties:
                        effective: { type: string, format: date }
                        days: { type: integer }
                  current_reuse_days: { type: integer }
        "401":
          description: Unauthenticated
        "503":
          description: DCV store not configured

  /connectors/{id}:
    delete:
      operationId: deleteConnector
      summary: Delete an issuer connector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Connector not found
        "409":
          description: Referenced by an external CA or takeover; the message names the referencing object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /connectors/{id}/test:
    post:
      operationId: testConnector
      summary: Test an issuer connection (health plus a dry run where the vendor has one; pki-admin)
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, degraded, unknown] }
                  detail: { type: string }
        "403": { description: Not a pki-admin }
        "404": { description: Connector not found (or in another tenant) }

  # ── Issuance policy (W22-14, FR-P8) ─────────────────────────────────────────
  # Instance-global: pki-admin only, and the platform super-admin when
  # multi-tenancy is on (a policy governs every tenant's issuance).

  /policies:
    get:
      operationId: listIssuancePolicies
      summary: List issuance policies
      tags: [Policies]
      responses:
        "200":
          description: Every issuance policy row
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/IssuancePolicy" }
        "401": { description: Missing or invalid token }
        "403": { description: "Not a pki-admin (or, with multi-tenancy on, not the super-admin)" }
    post:
      operationId: createIssuancePolicy
      summary: Create an issuance policy (audited as policy.create)
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssuancePolicyWrite" }
      responses:
        "201":
          description: Created; enforced on the very next issuance, no restart
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/IssuancePolicy" }
        "400": { description: "Invalid name, algorithm, min_rsa_bits or max_validity_days" }
        "403": { description: Not permitted }

  /policies/dry-run:
    post:
      operationId: dryRunIssuancePolicy
      summary: Evaluate a hypothetical or CSR-derived request without issuing
      description: >-
        With csr_pem, algorithm and RSA size come from the CSR's key (client
        strings are ignored, exactly as on the real issue path). Never signs
        and writes no audit row.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ca_id: { type: string }
                csr_pem: { type: string }
                algorithm: { type: string }
                rsa_bits: { type: integer }
                validity_days: { type: integer }
                is_ca: { type: boolean }
      responses:
        "200":
          description: Verdict with every violated rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [allowed, evaluated_policies, violations]
                    properties:
                      allowed: { type: boolean }
                      evaluated_policies:
                        type: array
                        items: { type: string }
                      violations:
                        type: array
                        items:
                          type: object
                          properties:
                            policy_id: { type: string }
                            policy: { type: string }
                            rule: { type: string }
                            detail: { type: string }
                            observed: { type: string }
        "400": { description: "Neither csr_pem nor algorithm, or invalid input" }
        "403": { description: Not permitted }

  /policies/draft:
    post:
      operationId: draftIssuancePolicy
      summary: Parse plain English into a disabled issuance-policy draft (persists nothing)
      description: >-
        Deterministic phrase extraction, no LLM. Every clause that could not
        be turned into a rule is returned in unrecognized, never dropped. The
        draft is always enabled=false, whatever the text asks for.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, text]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                text: { type: string, minLength: 1, maxLength: 2000 }
                ca_id: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Parsed draft; nothing stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [policy, explanation, unrecognized, persisted]
                    properties:
                      policy: { type: object }
                      explanation:
                        type: array
                        items: { type: string }
                      unrecognized:
                        type: array
                        items: { type: string }
                      persisted: { type: boolean }
        "400": { description: "Invalid body, name, text or ca_id" }
        "403": { description: Not permitted }
        "404": { description: ca_id not found }
        "422": { description: Draft violates policy field limits }

  /policies/draft/submit:
    post:
      operationId: submitIssuancePolicyDraft
      summary: Store a draft DISABLED and file a policy.activate approval
      description: >-
        Re-parses the text server-side (client rules and enabled flags are
        never accepted). The policy stays disabled until a different approver
        approves the pending action through /pending-actions/{id}/approve.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, text]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                text: { type: string, minLength: 1, maxLength: 2000 }
                ca_id: { type: string, maxLength: 128 }
      responses:
        "202":
          description: Draft stored disabled; awaiting a second approver
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      policy_id: { type: string }
                      pending_action_id: { type: string }
                      status: { type: string, enum: [pending_approval] }
                      enabled: { type: boolean }
                      unrecognized:
                        type: array
                        items: { type: string }
        "400": { description: "Invalid body, name, text or ca_id" }
        "403": { description: Not permitted }
        "404": { description: ca_id not found }
        "409": { description: A policy with that name already exists }
        "422": { description: "No rules recognized in the text, or draft violates field limits" }
        "503": { description: Policy or approval store unavailable }

  /policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getIssuancePolicy
      summary: Get one issuance policy
      tags: [Policies]
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/IssuancePolicy" }
        "404": { description: Unknown policy }
    patch:
      operationId: updateIssuancePolicy
      summary: Partially update an issuance policy (audited as policy.update)
      description: >-
        Omitted fields are unchanged. A change that tightens applies at once
        (200). A change that loosens (longer validity, lower RSA floor, new
        algorithm, CA certificates allowed, policy disabled or narrowed to a
        specific CA) is parked for a second approver and returns 202; it is
        applied when approved, and fails if the policy changed in between.
        revert_to restores a prior version under the same rule.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssuancePolicyWrite" }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/IssuancePolicy" }
        "202":
          description: Loosening queued for approval; the policy is unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [pending_approval] }
                      pending_action_id: { type: string }
                      reasons: { type: array, items: { type: string } }
        "400": { description: "Invalid field, or revert_to combined with other fields" }
        "404": { description: Unknown policy or version }
    delete:
      operationId: deleteIssuancePolicy
      summary: Delete an issuance policy (audited as policy.delete)
      tags: [Policies]
      responses:
        "204": { description: Deleted }
        "404": { description: Unknown policy }

  /policies/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listIssuancePolicyVersions
      summary: Version history of an issuance policy
      tags: [Policies]
      responses:
        "200":
          description: Applied versions, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/IssuancePolicyVersion" }
        "404": { description: Unknown policy }

  /team-policies:
    get:
      operationId: listTeamPolicies
      summary: List team issuance policies (W33-20)
      description: Tenant-scoped; an unscoped super-admin sees every tenant, or one with ?tenant=.
      tags: [Policies]
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string }, description: Honored only for an unscoped super-admin }
      responses:
        "200":
          description: Team policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TeamPolicy" }
        "401": { description: Missing or invalid token }
    post:
      operationId: createTeamPolicy
      summary: Create a team policy (audited as team_policy.create)
      description: >-
        A team with no policy is unrestricted, so creating one only restricts
        and applies at once (201). Within a policy an empty list places no
        restriction on that axis, max_validity_days 0 is no cap and
        monthly_quota 0 is unlimited.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamPolicyWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TeamPolicy" }
        "400": { description: "Invalid team, list entry, validity, quota, or a CA/template outside the tenant" }
        "403": { description: Not a pki-admin }
        "409": { description: The team already has a policy }

  /team-policies/{team}:
    parameters:
      - name: team
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTeamPolicy
      summary: Get one team policy
      tags: [Policies]
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TeamPolicy" }
        "404": { description: "Unknown team, or a team of another tenant" }
    patch:
      operationId: updateTeamPolicy
      summary: Partially update a team policy (audited as team_policy.update)
      description: >-
        Omitted fields are unchanged; a list field replaces the whole list. A
        tightening applies at once (200): filling an empty list, narrowing a
        list while keeping an entry, lowering a non-zero cap or quota, or
        setting 0 to a non-zero value. A loosening is parked for a second
        approver (202): emptying a non-empty list, adding an entry to a
        non-empty list, raising a cap or quota, or setting a non-zero cap or
        quota to 0. It fails at approval if the policy changed in between.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamPolicyWrite" }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TeamPolicy" }
        "202":
          description: Loosening queued for approval; the policy is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPolicyPending" }
        "400": { description: Invalid field or a CA/template outside the tenant }
        "403": { description: Not a pki-admin }
        "404": { description: "Unknown team, or a team of another tenant" }
        "409": { description: The policy changed concurrently }
    delete:
      operationId: deleteTeamPolicy
      summary: Delete a team policy (audited as team_policy.delete)
      description: >-
        An absent policy means the team is unrestricted, so deleting always loosens: the request is
        parked for a second approver (202) and the policy keeps applying until it is approved.
      tags: [Policies]
      responses:
        "202":
          description: Deletion queued for approval; the policy is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPolicyPending" }
        "403": { description: Not a pki-admin }
        "404": { description: "Unknown team, or a team of another tenant" }

  /ssh/ca:
    get:
      operationId: getSSHCA
      summary: SSH CA public key (W11-07) — for sshd TrustedUserCAKeys / known_hosts @cert-authority
      tags: [SSH]
      responses:
        "200":
          description: "{authority_line, authority_fingerprint}"
        "503":
          description: No keystore configured (APP_CERTIFICATE_PROVIDER=ca required)

  /ssh/certificates:
    get:
      operationId: listSSHCertificates
      summary: List issued SSH certificates
      tags: [SSH]
      parameters:
        - name: subject_fingerprint
          in: query
          schema: { type: string, description: "SHA256:... — the sshkeys-inventory link" }
      responses:
        "200":
          description: Issued SSH certificates (newest first, 200 max)
    post:
      operationId: issueSSHCertificate
      summary: Issue a short-lived SSH certificate (W11-07)
      tags: [SSH]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, public_key, cert_type, key_id, principals]
              properties:
                template_id:
                  type: string
                  description: >-
                    Certificate template whose ssh_policy authorises this
                    request (A01S-4). Refused (400) when missing, unknown,
                    inactive or without an ssh_policy, or when cert_type, a
                    principal (user: exact match in allowed_principals; host:
                    matches a host_patterns entry) or ttl_hours falls outside
                    the policy.
                public_key: { type: string, description: "Subject key, authorized_keys format" }
                cert_type: { type: string, enum: [user, host] }
                key_id: { type: string }
                principals:
                  type: array
                  items: { type: string }
                ttl_hours:
                  type: number
                  description: >-
                    Default 8h user / 30d host, lowered to the template's
                    max_ttl_hours; above the ceiling (24h user / 30d host) or
                    the template maximum is REFUSED, never clamped.
      responses:
        "201":
          description: >-
            Signed certificate (authorized_keys line) + record. Audited as
            ssh_certificate.issue with template_id:serial:key_id. The
            record carries template_id.
        "202":
          description: >-
            The template requires approval (require_approval): nothing is
            signed. Returns {status: pending_approval, approval_id, message};
            a second principal approves via POST /approvals/{id}/approve
            (self-approval is refused, 403), which issues the certificate.
            Audited as ssh_certificate.issue with outcome pending_approval.
        "400":
          description: Invalid request, template/policy refusal, or TTL above the ceiling or template maximum
        "503":
          description: No keystore configured

  /inventory-sources:
    get:
      operationId: listInventorySources
      summary: List direct-CA inventory sources (W11-05)
      tags: [Connectors]
      responses:
        "200":
          description: >-
            Sources with their last sync time and result. Types: adcs_export
            (a certutil/ldifde export path) and digicert (CertCentral API;
            key via credential_ref). Synced certs enter the estate as
            origin=synced / management_state=external.
    post:
      operationId: createInventorySource
      summary: Create an inventory source
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [adcs_export, adcs_live, digicert, sectigo, entrust, aws_pca, gcp_cas] }
                config_json: { type: string }
                credential_ref: { type: string }
                schedule_minutes: { type: integer, description: "0 = manual-only" }
      responses:
        "201":
          description: Source created
        "400":
          description: Invalid name, type, config (missing required field, forbidden secret key) or credential_ref (required for digicert, est and wstep; secrets - digicert {api_key}, est/wstep {password} - live only in the credential store)

  /inventory-sources/{id}:
    delete:
      operationId: deleteInventorySource
      summary: Delete an inventory source
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory-sources/{id}/sync:
    post:
      operationId: syncInventorySource
      summary: Run one sync now and return the report
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Sync report {synced, skipped, revoked_marked, failed[]} —
            idempotent by fingerprint; upstream revocation propagates to
            renewal_status.
        "404":
          description: Not found

  /estate/takeover:
    post:
      operationId: estateTakeover
      summary: Take an unmanaged/external certificate under management (W11-03/W11-06)
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, renewal_path]
              properties:
                fingerprint: { type: string }
                owner_email: { type: string }
                owner_team: { type: string }
                service_name: { type: string }
                renewal_path:
                  type: object
                  required: [mode]
                  properties:
                    mode: { type: string, enum: [internal, connector] }
                    connector_id: { type: string }
      responses:
        "200":
          description: >-
            Certificate now managed: ownership set, management_state=managed,
            renewal path recorded (renewal_method + renewal_connector_id).
            Audit-logged as estate.takeover. An unknown connector_id fails
            whole before anything mutates.
        "400":
          description: Invalid renewal path or unknown connector
        "404":
          description: Certificate not found

  /estate/takeover/bulk:
    post:
      operationId: estateTakeoverBulk
      summary: Take up to 500 unmanaged certificates under management (W24-31, W27-12)
      description: >-
        All-or-nothing on request validity: an invalid renewal_path or a
        connector_id that names no connector fails the whole call with 400
        and performs no mutation. Otherwise per-row results in request order;
        a failing row (unknown fingerprint, duplicate) mutates nothing and
        never stops later rows. Rows that must not be touched are skipped with
        a reason (already_managed, other_tenant, not_permitted). Audit-only
        like single takeover (D-127, no approval gate): one estate.takeover
        row per successful item plus an estate.takeover.bulk summary.
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [fingerprint, renewal_path]
                    properties:
                      fingerprint: { type: string }
                      owner_email: { type: string }
                      owner_team: { type: string }
                      service_name: { type: string }
                      renewal_path:
                        type: object
                        required: [mode]
                        properties:
                          mode: { type: string, enum: [internal, connector] }
                          connector_id: { type: string }
      responses:
        "200":
          description: Per-row outcome
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [total, succeeded, failed, skipped, results]
                    properties:
                      total: { type: integer }
                      succeeded: { type: integer }
                      failed: { type: integer }
                      skipped: { type: integer }
                      results:
                        type: array
                        items:
                          type: object
                          required: [fingerprint, status]
                          properties:
                            fingerprint: { type: string }
                            status: { type: string, enum: [ok, error, skipped] }
                            code: { type: string }
                            error: { type: string }
                            reason:
                              type: string
                              enum: [already_managed, other_tenant, not_permitted]
        "400":
          description: Empty items, more than 500 items, invalid body or renewal_path, or unknown connector(s); nothing was changed

  /estate/takeover/suggestions:
    get:
      operationId: estateTakeoverSuggestions
      summary: Owner suggestion per certificate for takeover (W27-12)
      description: >-
        Read-only. Per fingerprint (request order): the certificate's own
        ownership (existing_ownership, high), else the most common owner of
        visible certificates sharing its CommonName or a SAN
        (sibling_certificate, medium when 2 or more agree, else low), else
        none. Unknown or inaccessible fingerprints return source unavailable
        with empty owner fields. Audited as estate.takeover.suggest.
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: query
          required: true
          description: Repeatable, 1 to 500 values.
          schema:
            type: array
            minItems: 1
            maxItems: 500
            items: { type: string }
          style: form
          explode: true
      responses:
        "200":
          description: One suggestion per requested fingerprint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [fingerprint, owner_email, owner_team, service_name, source, confidence]
                      properties:
                        fingerprint: { type: string }
                        owner_email: { type: string }
                        owner_team: { type: string }
                        service_name: { type: string }
                        source: { type: string, enum: [existing_ownership, sibling_certificate, none, unavailable] }
                        confidence: { type: string, enum: [high, medium, low, none] }
        "400":
          description: No fingerprint, a blank fingerprint, or more than 500
        "401":
          description: Unauthenticated

  /estate/revert:
    post:
      operationId: estateRevert
      summary: Return a managed certificate to its pre-takeover state (W24-31)
      description: >-
        Changes only management_state, back to what it was before takeover:
        external for a certificate an inventory source synced (origin synced),
        unmanaged otherwise. Any recorded renewal method/connector remains as
        stale metadata. Audit-logged as estate.takeover.revert with
        {"from","to"} states.
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              properties:
                fingerprint: { type: string }
      responses:
        "200":
          description: Certificate is now external (origin synced) or unmanaged
        "400":
          description: Fingerprint missing
        "404":
          description: Certificate not found
        "409":
          description: Certificate is not managed

  /reports/estate:
    get:
      operationId: getEstateReport
      summary: Estate board report, origin x management_state (W24-36)
      description: >-
        Counts active certificates (same rule as the dashboard) by origin and
        management state, plus the PQC split and risk summary. format=pdf
        returns the board one-pager.
      tags: [Reports]
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, pdf] }
      responses:
        "200":
          description: Estate report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/EstateReport"
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          description: Unauthorized

  /renewal/execute:
    post:
      operationId: executeRenewal
      summary: Hub-side renewal execution (W5-13) — generate key/CSR, renew, install over SSH
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, target_id]
              properties:
                fingerprint: { type: string }
                target_id: { type: string }
                jit_sudo_password:
                  type: string
                  writeOnly: true
                  maxLength: 256
                  description: >-
                    One-off sudo password for this run only. Held in process memory,
                    zeroized when the job ends, never stored, logged or audited (the audit
                    detail records privilege_source=jit). Used when the target's credential has sudo_mode none or password.
                install:
                  type: object
                  description: >-
                    Optional override of the target's stored install profile
                    (install_server_type, install_cert_path, install_key_path,
                    install_reload_method, verify_host_port). pki-admin only:
                    any other caller gets 403 and the stored profile is used
                    when this is omitted.
                  properties:
                    server_type: { type: string, enum: [nginx, apache] }
                    cert_path: { type: string }
                    key_path: { type: string }
                    reload_method: { type: string }
                    verify_host_port: { type: string }
      responses:
        "200":
          description: >-
            Renewal executed. renewed=true with a non-verified install_outcome
            means the successor certificate exists but the install failed —
            partial state is reported, never hidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      predecessor_fingerprint: { type: string }
                      new_fingerprint: { type: string }
                      renewed: { type: boolean }
                      install_outcome: { type: string }
                      install_detail: { type: string, maxLength: 1024, description: "Install failure detail, redacted then truncated to 1 KB (config-test stack traces are ~4 KB)." }
                      verified: { type: boolean }
        "202":
          description: Renewal requires approval; execute again once granted
        "400":
          description: Invalid request, non-ssh target, or bad credential payload
        "403":
          description: Certificate or target not visible to the caller, or an install override sent without the pki-admin role
        "404":
          description: Certificate or target not found
        "409":
          description: Certificate already has a successor (body names it as successor_fingerprint)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [conflict] }
                  message: { type: string }
                  successor_fingerprint:
                    type: string
                    description: >-
                      The successor an earlier (halted or rolled-back) attempt
                      already minted. The hub never re-mints or reuses key
                      material implicitly; roll this certificate out instead.
        "429":
          description: The issuing connector is rate limited (upstream 429 or the hub's per-connector throttle); retry after the Retry-After interval
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer, minimum: 1 }

  /renewal/retry:
    post:
      operationId: retryRenewalNow
      summary: Re-queue a failed scheduled renewal now (W27-19)
      description: >-
        Requires certificate.renew. Resets the certificate's scheduled-attempt
        budget (failures recorded before this call stop counting, so a gave-up
        certificate gets a fresh renewalInstallMaxAttempts and attempt numbers
        restart at 1) and wakes the scheduler for an immediate scan. The
        certificate must have an execute_failure entry in the renewal failure
        queue. The retry backoff doubles from renewal_policy.retry_base_minutes
        (default 5) up to renewal_policy.retry_cap_hours (default 6).
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              properties:
                fingerprint: { type: string }
      responses:
        "202":
          description: Retry queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fingerprint: { type: string }
                      status: { type: string, enum: [queued] }
        "400":
          description: fingerprint is required
        "401":
          description: Unauthorized
        "403":
          description: Certificate not visible to the caller (team or tenant), or caller lacks certificate.renew
        "404":
          description: Certificate not found, or no failed renewal is queued for it
        "503":
          description: Certificate store, failure queue or audit log unavailable

  /certificates/{fingerprint}/renew:
    post:
      operationId: renewCertificate
      summary: Renew certificate
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [csr_pem]
              properties:
                csr_pem:
                  type: string
                  description: |
                    PEM-encoded PKCS#10 request for the renewed key. Same accepted labels and
                    key types as `POST /certificates` (including ML-DSA under `CERTIFICATE REQUEST`).
      responses:
        "201":
          description: Renewed
        "400":
          description: Invalid request body, or a CSR whose signature does not verify or whose key type is unsupported
        "409":
          description: Already renewed, or the issuing CA is not active or has no signing key

  /certificates/{fingerprint}/ownership:
    patch:
      operationId: updateCertificateOwnership
      summary: Update a certificate's owner metadata
      description: >-
        Records `ownership_source=manual` (cleared when `owner_team` is
        emptied) and writes the source into the `certificate.ownership_update`
        audit row.
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_email: { type: string, format: email }
                owner_team: { type: string }
                service_name: { type: string }
                labels:
                  type: array
                  items: { type: string }
                  description: Free-form labels; omitted leaves them untouched. Demo data carries `demo=true` (W37-07).
      responses:
        "200":
          description: Updated

  /certificates/{fingerprint}/download:
    get:
      operationId: downloadCertificate
      summary: Download certificate (PEM/DER, optionally with chain)
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [pem, der] }
        - name: include_chain
          in: query
          description: >-
            PEM only. true returns a conventional fullchain: the leaf followed
            by the issuing intermediates, nearest first. The self-signed root
            is never included (relying parties already hold it), so a leaf
            issued directly by a root downloads as a single certificate. Fetch
            the root with GET /cas/{id}/chain?format=pem. DER is always one
            certificate.
          schema: { type: boolean }
      responses:
        "200":
          description: Certificate bytes

  /certificates/bulk-import:
    post:
      operationId: bulkImportCertificates
      summary: Bulk-import certificates (W11-02) — PEM bundle, base64 DER list, or CSV
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              properties:
                format:
                  type: string
                  enum: [pem, der_b64, csv]
                  description: >-
                    pem (default): concatenated PEM blocks. der_b64:
                    whitespace-separated base64 DER. csv: header
                    cert_b64[,owner_email,owner_team,service_name].
                    PKCS#7/CMS input is deliberately unsupported pending a
                    vetted CMS dependency (see spec W11-02).
                bundle: { type: string }
                team_id: { type: string }
                owner_email: { type: string }
                owner_team: { type: string }
                service_name: { type: string }
      responses:
        "200":
          description: >-
            Import report. Duplicates (by SHA-256 fingerprint against the
            whole inventory) are skipped and counted, never errors; per-item
            failures (capped at 50) do not sink the batch. Imported rows
            enter the estate as origin=imported / management_state=unmanaged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported: { type: integer }
                      skipped_duplicates: { type: integer }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            index: { type: integer }
                            reason: { type: string }
                      fingerprints:
                        type: array
                        items: { type: string }
        "400":
          description: >-
            Invalid bundle, over the 8 MiB / 1000-cert limits, or the bundle
            contains private key material (rejected whole — nothing imports).

  /ownership/cmdb-import:
    post:
      operationId: importOwnershipFromCMDB
      summary: One-shot CMDB ownership import — host/IP/CIDR/fingerprint rules to owner team (W22-25)
      description: >-
        Applies the rules once, in file order (first matching rule wins), to
        the certificates visible to the caller's tenant; rules are not stored,
        so certificates issued later are not auto-assigned. Matching is
        against the certificate CN and SAN entries only. Assigned certificates
        get `ownership_source=cmdb`. A certificate whose owner was set by a
        person (`manual`, or an owner with no recorded source) or by bulk
        import/agent is never overwritten; re-importing over earlier `cmdb`
        values is allowed. A `fingerprint` row naming a certificate the
        caller cannot see (or that does not exist) is rejected with the same
        reason, per row, and is not applied. Writes one `ownership.cmdb_import`
        audit row (none for `dry_run`). Requires a certificate-admin role.
      tags: [Certificates]
      parameters:
        - name: dry_run
          in: query
          description: Count what would be assigned; change nothing and write no audit row.
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [match, value, owner_team]
                    properties:
                      match: { type: string, enum: [host, ip, cidr, fingerprint] }
                      value:
                        type: string
                        description: >-
                          host: DNS name or leading `*.suffix`; ip: address;
                          cidr: network; fingerprint: SHA-256 hex.
                      owner_team: { type: string }
                      owner_email: { type: string, format: email }
          text/csv:
            schema:
              type: string
              description: Header `match,value,owner_team[,owner_email]`, then one rule per row.
      responses:
        "200":
          description: Import report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rules: { type: integer }
                      matched: { type: integer }
                      assigned: { type: integer }
                      skipped_manual: { type: integer }
                      skipped_other: { type: integer }
                      failed: { type: integer }
                      dry_run: { type: boolean }
                      rejected:
                        type: array
                        items:
                          type: object
                          properties:
                            row: { type: integer, description: 1-based rule position }
                            reason: { type: string }
        "400":
          description: Bad match type, unparseable IP/CIDR, empty owner_team, bad email, bad CSV header, or over 1000 rules.
        "401":
          description: Unauthorized
        "403":
          description: Caller lacks a certificate-admin role.

  /ownership/orphans:
    get:
      operationId: listOrphanedOwners
      summary: Deactivated users that still own certificates (W22-26)
      description: >-
        Lists users whose account is deactivated (SCIM or admin) and whose
        `owner_email` still appears on at least one non-revoked certificate.
        Counts include only certificates visible to the caller's tenant, so a
        tenant admin never learns about another tenant's inventory. An email
        shared with an active account is never reported. Requires a
        certificate-admin role.
      tags: [Certificates]
      responses:
        "200":
          description: Orphaned owners (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [user_id, owner_email, cert_count]
                      properties:
                        user_id: { type: string }
                        owner_email: { type: string }
                        cert_count: { type: integer }
        "401":
          description: Unauthorized
        "403":
          description: Caller lacks a certificate-admin role.
        "503":
          description: User store or inventory unavailable.

  /ownership/reassign:
    post:
      operationId: reassignOrphanedOwner
      summary: Move every certificate of a departed owner to a new owner (W22-26)
      description: >-
        Reassigns all non-revoked certificates visible to the caller whose
        owner is `from_email`, which must belong to a deactivated user (400
        otherwise, including when every such certificate belongs to another
        tenant). Preserves each certificate's service name and records the
        assignment as `manual`. Writes one `certificate.ownership_update` audit
        row per certificate plus one `ownership.reassign` summary row. Requires
        a certificate-admin role.
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_email, to_team]
              properties:
                from_email: { type: string }
                to_team: { type: string }
                to_email: { type: string, description: Optional new owner email. }
      responses:
        "200":
          description: Number of certificates moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reassigned: { type: integer }
        "400":
          description: Missing to_team, or from_email is not an orphaned owner.
        "401":
          description: Unauthorized
        "403":
          description: Caller lacks a certificate-admin role.

  /certificates/bulk-revoke:
    post:
      operationId: bulkRevokeCertificates
      summary: Revoke multiple certificates
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprints:
                  type: array
                  items: { type: string }
                reason_code: { type: integer }
      responses:
        "200":
          description: >-
            Bulk revoke result (per-item outcomes). Each `succeeded` item
            carries `revocation_scope` (`ca`, `inventory_only` or `upstream`);
            a `failed` item whose upstream refused carries
            `revocation_scope: upstream_failed`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: array
                    items:
                      type: object
                      properties:
                        fingerprint: { type: string }
                        revocation_scope: { type: string, enum: [ca, inventory_only, upstream] }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        fingerprint: { type: string }
                        error: { type: string }
                        revocation_scope: { type: string, enum: [upstream_failed] }

  /certificates/bulk-reissue:
    post:
      operationId: bulkReissueCertificates
      summary: Reissue multiple certificates
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprints:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Bulk reissue result (per-item outcomes)

  # ── Certificate Authorities ───────────────────────────────────────────────

  /cas/external:
    post:
      operationId: createExternalCA
      summary: Create an external CA that issues through an issuer connector (pki-admin)
      tags: [CAs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, connector_id, trust_pem]
              properties:
                name: { type: string }
                connector_id: { type: string }
                trust_pem: { type: string, description: "CA certificate chain (PEM) that upstream responses must chain to." }
                approved_action_id: { type: string, description: "Pending action approved by a different human (dual control)." }
      description: >-
        Admin only. D-122 dual control: when on, the first call proposes (202 +
        `data.action_id`), a different human approves it in the pending-actions
        queue, and the proposer repeats the call with `approved_action_id` (201).
      responses:
        "202":
          description: Dual control proposal filed; body carries `data.action_id`
        "201":
          description: Created; a CA list item with type external and connector_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      type: { type: string, enum: [external] }
                      connector_id: { type: string }
                      status: { type: string }
        "400": { description: Invalid name, unknown connector, tenant mismatch or unparseable trust_pem }
        "401": { description: Unauthenticated }
        "403": { description: Not an admin, or the approved action is not redeemable by this caller }
        "503": { description: External CAs are not supported by this provider, or creation failed }

  /cas:
    get:
      operationId: listCAs
      summary: List Certificate Authorities
      tags: [CAs]
      responses:
        "200":
          description: CA list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        display_name: { type: string }
                        type: { type: string, enum: [root, intermediate, issuing, external] }
                        connector_id: { type: string, description: "Issuer connector that signs for an external CA; absent for hub CAs." }
                        status: { type: string, enum: [active, suspended, revoked, expired, pending_ceremony, pending_certificate] }
                        csr_pem: { type: string, description: "PKCS#10 request of an issuing CA in status pending_certificate; absent otherwise." }
                        key_storage_type: { type: string, enum: [software, pkcs11, vault, cloud_kms, external], description: "Key backend that holds the CA key; immutable after creation (PATCH returns 422)." }
                        revocation_signing: { type: string, enum: [classical, ml-dsa], description: "How this CA signs its CRLs and OCSP responses: ml-dsa when the CA key is ML-DSA (hand-encoded, signed with the ML-DSA key), otherwise classical. OpenSSL interop for ML-DSA responses is not guaranteed." }
                        warnings: { type: array, items: { type: string }, description: "Advisory compatibility notes, e.g. Ed25519 chains are not validated by Windows/ADCS clients. Omitted when empty." }
                        parent_ca_id: { type: string, nullable: true }
                        certificate_fingerprint_sha256: { type: string }
                        # S-72: count of certificates with renewal_status
                        # 'active' issued by this CA; 0 when the inventory
                        # is unavailable.
                        active_issued_certificates: { type: integer }
    post:
      operationId: createCA
      summary: Create a Certificate Authority
      tags: [CAs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_cn]
              properties:
                name: { type: string }
                type: { type: string, enum: [root, intermediate] }
                algorithm:
                  type: string
                  description: >-
                    CA key algorithm; case and separators are ignored
                    (ML-DSA-65, mldsa65 and ml-dsa-65 are equivalent). ML-DSA
                    CAs require the software key backend (HSM-held ML-DSA keys
                    are refused, see ADR_PQC_KEYS_SOFTWARE_ONLY).
                  enum: [ECDSA-P256, ECDSA-P384, RSA-2048, RSA-3072, RSA-4096, Ed25519, ML-DSA-44, ML-DSA-65, ML-DSA-87]
                subject_cn: { type: string }
                key_storage_type:
                  type: string
                  enum: [software, pkcs11, vault, cloud_kms]
                  description: >-
                    Key backend for this CA's key (optional; empty uses the hub
                    default). Only backends enabled through
                    KRYPTKEEPER_KEY_BACKENDS can be selected; otherwise 422.
      responses:
        "201":
          description: >-
            CA created. An intermediate whose parent is an imported keyless
            root is created `pending_certificate`: the hub generates the key
            and the body carries `csr_pem` to sign offline (see
            `/cas/{id}/certificate`).
        "400":
          description: >-
            Unsupported or unknown algorithm (e.g. DSA). The body carries
            `supported_algorithms`, the full list the hub accepts.
        "422":
          description: The engine or key backend refused the request (e.g. Ed25519 on a PKCS#11 or cloud KMS backend)

  /cas/import:
    post:
      operationId: importCA
      summary: Import an external self-signed root CA as a keyless trust anchor (dual control)
      description: >-
        D-122 dual control: the first call proposes (202 + action_id), a
        different human approves it in the pending-actions queue, and the
        proposer repeats the call with `approved_action_id` (201). The root is
        stored without a private key (key_storage_type external); issuing from
        it fails with 422 "no signing key available".
      tags: [CAs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, key_storage_type, certificate_pem]
              properties:
                name: { type: string }
                type: { type: string, enum: [root] }
                key_storage_type: { type: string, enum: [external] }
                certificate_pem: { type: string }
                approved_action_id: { type: string }
      responses:
        "201":
          description: Root imported (or a previously removed trust anchor reactivated)
        "202":
          description: Proposal filed; body carries `data.action_id`
        "400":
          description: Not a self-signed CA certificate (use chain import for intermediates), or bad type/key_storage_type
        "403":
          description: Admin role required, or the approved action is not redeemable by this caller
        "409":
          description: This root certificate is already imported

  /cas/{id}:
    get:
      operationId: getCA
      summary: Get CA detail
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CA detail
        "404":
          description: Not found
    patch:
      operationId: updateCA
      summary: Update mutable CA fields (display_name, crl_distribution_points, ocsp_service_url)
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
        "422":
          description: Attempted to modify an immutable field
    delete:
      operationId: deleteCA
      summary: Delete a CA (must be revoked/expired first), or remove an imported trust anchor (dual control)
      description: >-
        On the engine-backed provider this removes an imported keyless root
        under D-122 dual control: 202 + action_id on the first call, then
        repeat with `approved_action_id` once a different human approved.
        Removal is soft (status revoked); re-importing the same certificate
        reactivates it.
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: approved_action_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "202":
          description: Trust-anchor removal proposed; body carries `data.action_id`
        "204":
          description: Deleted / trust anchor removed
        "403":
          description: Admin role required, or the approved action is not redeemable by this caller
        "404":
          description: Not found
        "409":
          description: CA has active certificates, or the trust anchor still has active child CAs
        "422":
          description: Only an imported keyless root CA can be removed as a trust anchor

  /cas/{id}/revoke:
    post:
      operationId: revokeCA
      summary: Revoke a CA (irreversible, always dual control)
      description: >-
        Admin only. Always returns 202 with `data.action_id`; nothing is
        revoked until a different human approves the action in
        `/pending-actions` (there is no env bypass). The reason is always
        `cACompromise`. An intermediate is added to its parent's revocation
        list; a root is status-only. The audit event `ca.revoke` records the
        blast radius (active certificates and descendant CAs). A revoked CA
        refuses issuance, as do its descendants.
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [cACompromise] }
                rationale: { type: string }
      responses:
        "202":
          description: Proposal filed; awaiting a second approver.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      action_id: { type: string }
                      message: { type: string }
        "400": { description: Unsupported reason }
        "403": { description: "Not an admin, or CA not visible to the tenant" }
        "404": { description: CA not found }
        "409": { description: CA is already revoked }

  /cas/{id}/rotate-key:
    post:
      operationId: rotateCAKey
      summary: Re-key a CA, optionally cross-signed (dual control)
      description: >-
        Admin only. Under D-122 dual control the first call returns 202 with
        `data.action_id`; after a different human approves it in
        `/pending-actions`, the proposer repeats the same request (same `mode`
        and `algorithm`) with `approved_action_id`. The grant is single-use and
        bound to mode and algorithm. `mode=cross-sign` re-keys and returns the
        bridge certificate (new identity, old signature) and the retired
        certificate; the hub verifies a probe leaf against both anchors before
        returning. Default and `mode=rekey` re-key without a bridge.
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [rekey, cross-sign] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm: { type: string, description: "Optional new key algorithm; defaults to the current one." }
                approved_action_id: { type: string }
      responses:
        "200":
          description: Rotated. `data` carries the rotation result; with `mode=cross-sign` also `cross_cert_pem`, `old_cert_pem`, `old_key_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string }
                      key_id: { type: string }
                      rotated_at: { type: string }
                      ledger_id: { type: string }
                      ledger_persisted: { type: boolean }
                      cross_cert_pem: { type: string }
                      old_cert_pem: { type: string }
                      old_key_id: { type: string }
        "202":
          description: Rotation proposed; body carries `data.action_id`
        "400":
          description: mode must be rekey or cross-sign, or invalid body
        "403":
          description: Admin role required, or the approved action is not redeemable by this caller
        "404":
          description: Not found
        "503":
          description: Rotation not supported by this provider, or rotation failed

  /cas/{id}/csr:
    get:
      operationId: getCACSR
      summary: Get the CSR of an issuing CA awaiting its signed certificate
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`data.ca_id` and `data.csr_pem` (PKCS#10)"
        "403":
          description: Admin role required
        "404":
          description: Not found
        "409":
          description: The CA is not awaiting a certificate

  /cas/{id}/certificate:
    post:
      operationId: completeCA
      summary: Upload the offline-signed certificate for a pending issuing CA
      description: >-
        The certificate must certify exactly this CA's key, be signed by the
        CA's parent, be a currently valid CA certificate that does not outlive
        the parent, and respect the parent's path length. Anything else is 400
        and the CA stays pending_certificate.
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate_pem]
              properties:
                certificate_pem: { type: string }
      responses:
        "200":
          description: CA activated
        "400":
          description: Certificate rejected (key mismatch, wrong issuer, expired, bad path length, not a CA)
        "403":
          description: Admin role required
        "404":
          description: Not found
        "409":
          description: The CA is not awaiting a certificate

  /cas/{id}/suspend:
    post:
      operationId: suspendCA
      summary: Suspend a CA
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Suspended
        "409":
          description: State conflict

  /cas/{id}/activate:
    post:
      operationId: activateCA
      summary: Activate a suspended CA
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activated
        "409":
          description: State conflict

  /cas/{id}/chain:
    get:
      operationId: getCAChain
      summary: Get a CA's certificate chain
      tags: [CAs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          description: >-
            json (default) returns chain metadata only. pem returns
            application/x-pem-file: the CA's own certificate followed by its
            parents up to and including the root -- the public certificate
            only, never key material. For a root CA this is the root
            certificate itself, i.e. the trust anchor for openssl verify
            -CAfile.
          schema: { type: string, enum: [json, pem] }
      responses:
        "200":
          description: Chain

  # ── Templates ──────────────────────────────────────────────────────────────

  /templates:
    get:
      operationId: listTemplates
      summary: List certificate templates
      tags: [Templates]
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TemplateRecord"
    post:
      operationId: createTemplate
      summary: Create a certificate template
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRecord"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TemplateRecord"

  /templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      operationId: getTemplate
      summary: Get a template by ID
      tags: [Templates]
      responses:
        "200":
          description: Template
        "404":
          description: Not found
    put:
      operationId: replaceTemplate
      summary: Replace a template (requires If-Match revision header)
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRecord"
      responses:
        "200":
          description: Updated
        "412":
          description: If-Match missing or revision mismatch
    patch:
      operationId: patchTemplate
      summary: Patch mutable template fields (display_name, auto_enroll, active, allowed_algorithms, enrollment_permissions)
      tags: [Templates]
      responses:
        "200":
          description: Updated
        "422":
          description: Attempted to modify an immutable field
    delete:
      operationId: deleteTemplate
      summary: Delete a template
      tags: [Templates]
      responses:
        "204":
          description: Deleted
        "409":
          description: Template has issued certificates, or is referenced by an in-flight (pending) approval request - disable it with PATCH active=false instead

  /templates/{id}/revisions:
    get:
      operationId: listTemplateRevisions
      summary: List a template's revisions with per-revision field diffs
      description: >-
        Revisions ascending, each with a snapshot and the changes against the
        previous revision (empty for the first). A template that predates
        history starts at its revision on first use: earlier revisions are
        unknowable. A clone restarts at revision 1.
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateRevision"
        "403":
          description: Template not visible to the caller's tenant
        "404":
          description: Not found
        "503":
          description: Revision history not supported by this provider

  /templates/{id}/clone:
    post:
      operationId: cloneTemplate
      summary: Clone a template under a new name
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, display_name]
              properties:
                name: { type: string }
                display_name: { type: string }
      responses:
        "201":
          description: Cloned

  # ── Approvals ────────────────────────────────────────────────────────────

  /approvals:
    get:
      operationId: listApprovals
      summary: List approval requests (own requests plus those the caller's role may decide; all for admins)
      description: >
        pki-admin sees every request in its tenant scope. Any other role sees the requests it raised and the
        requests on templates whose `approval_roles` name its role (the ones it can approve or reject). Tenant
        scoping applies on top of this.
      tags: [Approvals]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalRequest"

  /approvals/delegation:
    get:
      operationId: getApprovalDelegation
      summary: The caller's own approval delegation, or null
      tags: [Approvals]
      responses:
        "200":
          description: Delegation or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/ApprovalDelegation"
        "401":
          description: Unauthenticated
        "403":
          description: Caller cannot approve
    put:
      operationId: setApprovalDelegation
      summary: Delegate approval rights to another approver for up to 30 days (replaces any existing delegation)
      tags: [Approvals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegate, starts_at, ends_at]
              properties:
                delegate: { type: string, description: Principal id of the delegate }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        "200":
          description: Delegation stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ApprovalDelegation"
        "400":
          description: Bad body, bad times, range over 30 days, or delegate is the caller
        "401":
          description: Unauthenticated
        "403":
          description: Caller cannot approve, or the delegate lacks approve capability
    delete:
      operationId: clearApprovalDelegation
      summary: Clear the caller's delegation
      tags: [Approvals]
      responses:
        "204":
          description: Cleared
        "401":
          description: Unauthenticated
        "403":
          description: Caller cannot approve

  /approvals/inbox:
    get:
      operationId: listApprovalInbox
      summary: Unified inbox of pending certificate approvals and pending actions (tenant-scoped, oldest first)
      description: >
        Certificate approvals follow the same visibility as GET /approvals. Pending actions (key and CA dual
        control) are listed to pki-admin and pki-operator; any other role, including `approver`, sees only
        the ones it proposed.
      tags: [Approvals]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [certificate_approval, pending_action] }
        - name: min_age
          in: query
          description: Go duration (for example 24h); keeps items at least this old.
          schema: { type: string }
        - name: tenant
          in: query
          description: Honoured only for an unscoped (super-admin) caller; a tenant principal always sees only its own tenant.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Inbox page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalInboxItem"
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
        "400":
          description: Bad type or min_age
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden

  /approvals/inbox/{type}/{id}/approve:
    post:
      operationId: approveInboxItem
      summary: Approve an inbox item; delegates to the certificate-approval or pending-action approve handler, keeping all its refusals
      tags: [Approvals]
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [certificate_approval, pending_action] }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved and executed (pending action)
        "201":
          description: Certificate issued (certificate approval)
        "202":
          description: Approval recorded, quorum not yet met
        "401":
          description: Unauthenticated
        "403":
          description: Bootstrap credential, self-approval, role or tenant refusal
        "404":
          description: Unknown item or type, or item in another tenant
        "409":
          description: Not pending

  /approvals/inbox/{type}/{id}/reject:
    post:
      operationId: rejectInboxItem
      summary: Reject an inbox item; delegates to the source reject handler
      tags: [Approvals]
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [certificate_approval, pending_action] }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejected
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Unknown item or type, or item in another tenant
        "409":
          description: Not pending

  /approvals/{id}:
    get:
      operationId: getApproval
      summary: Get an approval request
      tags: [Approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approval request
        "404":
          description: Not found

  /approvals/{id}/approve:
    post:
      operationId: approveApproval
      summary: Approve a pending request and issue the certificate
      tags: [Approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: Optional. on_behalf_of names a delegator whose active delegation to the caller authorises this decision.
        content:
          application/json:
            schema:
              type: object
              properties:
                on_behalf_of: { type: string }
      responses:
        "201":
          description: >-
            Certificate issued. For an approval with kind "ssh" the body is
            {data: SSH certificate record} (as POST /ssh/certificates 201) and
            Location points at /ssh/certificates?subject_fingerprint=...
        "403":
          description: >-
            Role, self-approval or tenant refusal, or (W33-21) the requester's team policy no longer allows
            the request at approval time. The body carries `error_code` (see Error); the request stays pending.
        "409":
          description: Not pending
        "503":
          description: Team policy could not be re-evaluated; the request stays pending.

  /approvals/{id}/reject:
    post:
      operationId: rejectApproval
      summary: Reject a pending approval request
      tags: [Approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Rejected
        "409":
          description: Not pending

  # ── Accepted-risk exceptions (W22-28) ───────────────────────────────────────

  /exceptions:
    get:
      operationId: listExceptions
      summary: List active and pending accepted-risk exceptions (tenant-scoped)
      tags: [Exceptions]
      responses:
        "200":
          description: Exceptions visible to the caller's tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Exception"
    post:
      operationId: proposeException
      summary: Propose an accepted-risk exception (never takes effect without a second approver)
      description: >-
        Parks the proposal in the approval queue (so quorum, expiry and
        delegation apply). The exception row exists only once approved.
        Wildcard targets and an expiry beyond EXCEPTION_MAX_DAYS (default and
        maximum 365) are refused with 400.
      tags: [Exceptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionRequest"
      responses:
        "202":
          description: Queued for approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [pending] }
                      pending_action_id: { type: string }
        "400":
          description: Invalid request, wildcard target, or expiry beyond the maximum
        "403":
          description: Target is outside the caller's tenant or team scope
        "404":
          description: Target not found
        "409":
          description: An active or pending exception already exists for this target and finding

  /exceptions/{id}:
    delete:
      operationId: deleteException
      summary: Remove an active exception; the finding counts again immediately
      tags: [Exceptions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [deleted] }
        "404":
          description: Not found (or in another tenant)

  # ── Anomaly remediations (W30-08) ───────────────────────────────────────────

  /anomalies/remediations:
    get:
      operationId: listAnomalyRemediations
      summary: List anomaly remediation proposals (pending, approved, rejected; tenant-scoped)
      tags: [Anomalies]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Pending actions whose type is anomaly.*
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
        "403":
          description: Role may not read anomaly remediations
    post:
      operationId: proposeAnomalyRemediation
      summary: Propose a remediation for an anomaly finding (never executes without a second approver)
      description: >-
        Parks the proposal in the approval queue. Nothing is suspended, disabled
        or revoked until a different approver approves it through
        /pending-actions/{id}/approve. suspend_ca and disable_template apply
        instance-wide; reactivate_ca and enable_template are the rollback and
        take the same path. revoke_batch takes up to 100 fingerprints the
        requester issued in the last hour.
      tags: [Anomalies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [suspend_ca, reactivate_ca, disable_template, enable_template, revoke_batch]
                ca_id: { type: string }
                template_id: { type: string }
                requester: { type: string }
                finding_kind: { type: string }
                rationale: { type: string, maxLength: 1000 }
      responses:
        "202":
          description: Proposed; awaiting a second approver
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [proposed] }
                      pending_action_id: { type: string }
                      blast_radius:
                        type: object
                        properties:
                          cas: { type: integer }
                          templates: { type: integer }
                          certificates: { type: integer }
        "400":
          description: Unknown action, missing target id, or invalid body
        "403":
          description: Role may not propose remediations
        "404":
          description: Target not found (or in another tenant)
        "409":
          description: No recent issuance by that requester (revoke_batch)

  # ── Pending Actions (AI/agent-proposed) ─────────────────────────────────────

  /pending-actions:
    get:
      operationId: listPendingActions
      summary: List proposed actions
      tags: [PendingActions]
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Pending action list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingAction"
    post:
      operationId: proposePendingAction
      summary: Propose an action for approval (e.g. by an MCP agent)
      tags: [PendingActions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PendingAction"
      responses:
        "201":
          description: Proposed
        "413":
          description: Proposal body exceeds 64 KiB

  /pending-actions/{id}/approve:
    post:
      operationId: approvePendingAction
      summary: Approve and execute a proposed action (proposer cannot self-approve)
      tags: [PendingActions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: Optional. on_behalf_of names a delegator whose active delegation to the caller authorises this decision.
        content:
          application/json:
            schema:
              type: object
              properties:
                on_behalf_of: { type: string }
      responses:
        "200":
          description: Approved and executed
        "202":
          description: Approval recorded but the quorum is not yet met; the action stays pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [pending] }
                      approvals: { type: integer }
                      required: { type: integer }
        "403":
          description: Proposer cannot approve their own action
        "409":
          description: Not pending, or this approver (human) has already approved

  /pending-actions/{id}/reject:
    post:
      operationId: rejectPendingAction
      summary: Reject a proposed action
      tags: [PendingActions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Rejected
        "409":
          description: Not pending

  # ── CAs / Dashboard ──────────────────────────────────────────────────────

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Dashboard aggregate summary
      tags: [Dashboard]
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardSummary"

  /dashboard/actions:
    get:
      operationId: listDashboardActions
      summary: List actionable dashboard items
      tags: [Dashboard]
      responses:
        "200":
          description: Action list

  /dashboard/actions/history:
    get:
      operationId: getDashboardActionsHistory
      summary: History of acknowledged/resolved dashboard actions
      tags: [Dashboard]
      responses:
        "200":
          description: Action history

  /dashboard/actions/ack:
    post:
      operationId: ackDashboardAction
      summary: Acknowledge a dashboard action
      tags: [Dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id]
              properties:
                action_id: { type: string }
                note: { type: string }
      responses:
        "202":
          description: Acknowledged

  /dashboard/actions/resolve:
    post:
      operationId: resolveDashboardAction
      summary: Resolve a dashboard action
      tags: [Dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id]
              properties:
                action_id: { type: string }
                note: { type: string }
      responses:
        "202":
          description: Resolved

  # ── Discovery ────────────────────────────────────────────────────────────

  /discovery/summary:
    get:
      operationId: getDiscoverySummary
      summary: Discovery inventory summary
      tags: [Discovery]
      responses:
        "200":
          description: Discovery counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DiscoverySummary"

  /discovery/endpoints:
    get:
      operationId: listDiscoveryEndpoints
      summary: List discovered endpoints
      tags: [Discovery]
      parameters:
        - name: protocol
          in: query
          schema: { type: string }
        - name: risky_only
          in: query
          description: >-
            Keep risky endpoints: one with a currently-active certificate that
            scores 70 or more or carries EXPIRED, SELF_SIGNED, WEAK_KEY,
            WEAK_SIGNATURE or UNTRUSTED_ROOT, or with a NOT_TLS,
            TLS_HANDSHAKE_FAILED, POSTGRES_TLS_DISABLED, MSSQL_TLS_DISABLED,
            MYSQL_TLS_DISABLED or DEPRECATED_TLS_VERSION finding. `risky_endpoints` in the summaries
            counts the same set.
          schema: { type: boolean }
        - name: trust_class
          in: query
          description: >-
            Keep endpoints currently presenting a leaf certificate of this
            trust class. An unknown value is a 400.
          schema:
            $ref: "#/components/schemas/TrustClass"
        - name: inventory_class
          in: query
          description: >-
            Keep endpoints currently presenting a leaf certificate of this
            inventory class. An unknown value is a 400.
          schema:
            $ref: "#/components/schemas/InventoryClass"
      responses:
        "200":
          description: Endpoint list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      endpoints:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            hostname: { type: string }
                            port: { type: integer }
                            protocol: { type: string }
                            risk_score: { type: integer }
                            last_seen_at: { type: string }
                            server_tech:
                              type: string
                              description: Fingerprinted web/server technology (iis, apache, nginx, …).
                            recommended_install_mode:
                              type: string
                              description: install_mode the fingerprint or service protocol implies.
                            inventory_class:
                              $ref: "#/components/schemas/InventoryClass"
                            tech:
                              type: string
                              description: >-
                                Technology behind the endpoint (W34-01): a
                                closed vocabulary (apache, nginx, iis, tomcat,
                                mssql, postfix, openssh, …), `other:<token>`
                                for an unrecognised product, or `unknown`.
                                Absent for an endpoint no network scan has
                                fingerprinted. `server_tech` equals this when
                                it is a web server.
                            tech_confidence:
                              type: string
                              enum: [high, medium, low]
                              description: >-
                                How sure the scan is. An endpoint backed only
                                by its port number is `low` and never gets a
                                `recommended_install_mode`.
                            platform:
                              type: string
                              enum: [windows, linux, java, appliance, unknown]
                            tls_stack:
                              type: string
                              description: >-
                                schannel, openssl, jsse, go, boringssl, gnutls,
                                nss or unknown.
                            tech_evidence:
                              type: array
                              description: >-
                                The observations that voted for `tech`, heaviest
                                first. Values are redacted to the header or
                                banner line; no response body is stored.
                              items:
                                type: object
                                required: [signal, value, tech, weight]
                                properties:
                                  signal:
                                    type: string
                                    enum: [listener, http_header, banner, rootdse, tds_prelogin, cert_issuer, cert_subject, cert_ext, tls_stack, port]
                                  value: { type: string }
                                  tech: { type: string }
                                  weight: { type: integer }
                                  platform:
                                    type: string
                                    description: Explicit platform vote, when the row names one.
                            install_posture:
                              type: object
                              description: >-
                                Install posture of the discovered file that holds
                                this endpoint's served leaf (an agentless SSH scan
                                statted it). Absent when no host scan has seen the
                                file. When several files hold the leaf, the most
                                severe is shown.
                              required: [posture, path, host]
                              properties:
                                file_id:
                                  type: string
                                  description: discovered_files id; the target_id of a target_file exception.
                                accepted_findings:
                                  type: array
                                  items: { type: string }
                                  description: Finding codes with an active accepted-risk exception on this file.
                                posture:
                                  type: string
                                  enum: [standard, privileged, root_service, unknown]
                                  description: >-
                                    privileged = the file is root- or other-owned and
                                    the service runs as a non-root account that cannot
                                    replace it; root_service = the application server
                                    runs as uid 0.
                                path: { type: string }
                                host: { type: string }
                                owner: { type: string }
                                mode: { type: string, description: Octal permission bits. }
                                service_tech: { type: string }
                                findings:
                                  type: array
                                  description: >-
                                    PRIVILEGED_INSTALL_PATH, SERVICE_RUNS_AS_ROOT,
                                    KEY_WORLD_READABLE, HOME_DIR_KEYSTORE as "CODE: detail".
                                  items: { type: string }
                            ssh_banner:
                              type: string
                              description: SSH server banner (SSH endpoints only).
                            ssh_host_key_algorithms:
                              type: array
                              items: { type: string }
                              description: SSH server's advertised host-key algorithms.
                            crypto_posture:
                              type: object
                              description: On-the-wire TLS posture incl. ML-KEM hybrid detection.
                              properties:
                                negotiated_version: { type: string }
                                negotiated_cipher: { type: string }
                                negotiated_group: { type: string }
                                offered_versions:
                                  type: array
                                  items: { type: string }
                                weak_findings:
                                  type: array
                                  items: { type: string }
                                pqc:
                                  type: object
                                  properties:
                                    hybrid_negotiated: { type: boolean }
                                    hybrid_offered: { type: boolean }
                                    group: { type: string }
                            mapped_certs:
                              type: array
                              description: >-
                                Currently-active certificate mappings observed
                                on this endpoint by discovery scans.
                              items:
                                type: object
                                properties:
                                  fingerprint: { type: string }
                                  common_name: { type: string }
                                  valid_until: { type: string }
                                  source_path:
                                    type: string
                                    description: >-
                                      File the certificate was read from on the
                                      scanned host (agentless SSH discovery,
                                      W24-08); absent for network-scanned links.
                                  risk_score:
                                    type: integer
                                    description: >-
                                      The certificate's own score plus what
                                      serving it on THIS endpoint adds.
                                  risk_flags:
                                    type: array
                                    items: { type: string }
                                    description: >-
                                      The certificate's own flags plus the
                                      endpoint-scoped ones observed here
                                      (HOSTNAME_MISMATCH, INCOMPLETE_CHAIN,
                                      UNTRUSTED_ROOT).
                                  trust_class:
                                    $ref: "#/components/schemas/TrustClass"
                                  issuer_class:
                                    type: string
                                    enum: [hub, authorized, public, private_unknown, self_signed, unknown]
                                    description: >-
                                      trust_class refined with the operator's
                                      authorized issuers (W34-06).
                                  inventory_class:
                                    $ref: "#/components/schemas/InventoryClass"
                                  issuer_dn:
                                    type: string
                                    description: >-
                                      The issuer as observed; what authorizing
                                      this certificate's issuer declares.
                                  chain_ca:
                                    type: boolean
                                    description: >-
                                      An intermediate/root this endpoint served
                                      alongside its leaf.
                                  chain_complete:
                                    type: boolean
                                    description: >-
                                      Absent when completeness could not be
                                      judged for this endpoint (a private chain
                                      whose issuer the hub does not hold).
                                      false only when an intermediate is
                                      provably missing from what the server
                                      sent; omitting the root is normal.
                                  chain_trusted: { type: boolean }
                            risky:
                              type: boolean
                              description: >-
                                True when the endpoint matches the `risky_only`
                                rule (score >= 70, a high-severity flag such as
                                EXPIRED, SELF_SIGNED, WEAK_KEY, WEAK_SIGNATURE,
                                UNTRUSTED_ROOT or HOSTNAME_MISMATCH, or a
                                deprecated-TLS, not-TLS, failed-handshake or Postgres-TLS-disabled
                                finding). An endpoint with such a finding scores
                                at least 20. The UI badge reads this rather than
                                re-deriving it from `risk_score`.
                            issues:
                              type: array
                              items: { type: string }
                              description: >-
                                Endpoint findings: NOT_TLS, TLS_HANDSHAKE_FAILED,
                                POSTGRES_TLS_DISABLED (the server declined the
                                SSLRequest), MSSQL_TLS_DISABLED (ENCRYPT_NOT_SUP),
                                MYSQL_TLS_DISABLED (no SSL capability) or DEPRECATED_TLS_VERSION ("CODE: detail") for
                                a port that answered but could not be read as
                                modern TLS; otherwise cipheraudit findings for a
                                real (port != 0) TLS endpoint, or -- a port-less source (e.g.
                                a mesh/K8s-secret certificate source) -- a
                                "discovery-error: ..." entry recording a
                                reachability or permission failure (W19-22).

  /discovery/scan-jobs:
    get:
      operationId: listDiscoveryScanJobs
      summary: List discovery scan jobs
      tags: [Discovery]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, completed, completed_with_errors, failed, cancelled] }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, default: 25 }
        - name: cursor
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Scan job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scan_jobs:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiscoveryScanJob"

  /discovery/schedules:
    get:
      operationId: listDiscoverySchedules
      summary: Per-target discovery schedules with last and next run (W24-04)
      description: >-
        One row per scheduled discovery target: env network targets
        (KRYPTKEEPER_DISCOVERY_SCAN_TARGETS) and managed targets with a
        scheduled discovery mode. next_run is last_run plus the effective
        interval (now when never run, null when no interval applies) and is
        not advanced while a job for the target is running.
      tags: [Discovery]
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscoverySchedule"
        "403": { description: Forbidden }
        "503": { description: Schedule store unavailable }
    put:
      operationId: updateDiscoverySchedule
      summary: Set or clear a target's own scan interval (W24-04)
      description: >-
        The key travels in the body because CIDR keys contain "/". A null
        interval clears the override so the target follows
        KRYPTKEEPER_DISCOVERY_SCAN_INTERVAL again. The scheduler wakes at most
        once a minute, so an interval under a minute cannot fire more often.
      tags: [Discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, interval_seconds]
              properties:
                key: { type: string }
                interval_seconds:
                  type: integer
                  nullable: true
                  minimum: 60
                  maximum: 2592000
      responses:
        "200":
          description: The updated row
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DiscoverySchedule"
        "400": { description: "interval_seconds must be between 60 and 2592000, or null to use the global interval" }
        "403": { description: Forbidden }
        "404": { description: Unknown schedule key }

  /discovery/authorized-issuers:
    get:
      operationId: listAuthorizedIssuers
      summary: List the CA groups the operator authorizes (W34-06)
      description: >-
        Tenant-scoped: a tenant sees its own rows; an unscoped administrator
        sees every tenant's.
      tags: [Discovery]
      responses:
        "200":
          description: Authorized issuers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorizedIssuer"
        "403": { description: Forbidden }
        "503": { description: Store unavailable }
    post:
      operationId: createAuthorizedIssuer
      summary: Authorize an issuer (W34-06)
      description: >-
        Declares an issuer as a CA group the operator accepts. Public roots are
        never authorized implicitly (D-205); this is the only way a certificate
        becomes authorized_external. Stored certificates are re-judged
        immediately from the leaf; the next scan re-judges from the served chain.
      tags: [Discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, value]
              properties:
                name: { type: string, maxLength: 200 }
                kind: { type: string, enum: [ca_cert, issuer_dn, spki_sha256] }
                value: { type: string }
                notes: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AuthorizedIssuer"
        "400": { description: Invalid name, kind or value }
        "403": { description: Forbidden }
        "409": { description: That issuer is already authorized in this tenant }
        "503": { description: Store unavailable }

  /discovery/authorized-issuers/{id}:
    delete:
      operationId: deleteAuthorizedIssuer
      summary: Stop authorizing an issuer (W34-06)
      tags: [Discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }
        "403": { description: Forbidden }
        "404": { description: Not found (or another tenant's) }
        "503": { description: Store unavailable }

  /discovery/scans:
    post:
      operationId: createDiscoveryScan
      summary: Start a discovery scan (creates a scan job)
      tags: [Discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_type]
              properties:
                scan_type:
                  type: string
                  enum: [full, targeted, fast, deep, winrm, ssh, k8s-certmanager, cloud_acm, cloud_azure_kv, cloud_gcp_cm]
                  description: >-
                    Network scans (full/targeted/fast) require a target.
                    Cloud scans (W5-12) take no target — their scope is
                    the account the connector's credentials see. A winrm
                    scan (W18-12) takes a managed target id whose
                    discovery_mode is winrm and enumerates the host's
                    machine certificate stores with its stored credential.
                    An ssh scan (W24-08) takes a managed target id whose
                    install_mode is ssh (discovery_mode not none); it reads
                    certificates and keystores over SSH with the target's
                    ssh_key credential. Unreadable paths are warnings, not
                    failures. 404 for an unknown or other-tenant target,
                    400 for a target that is not ssh-mode or a ports list.
                    A k8s-certmanager scan (W19-17) takes no target either
                    — its scope is the cluster the KRYPTKEEPER_K8S_* env
                    vars point at (see internal/certmanager.ConfigFromEnv)
                    — and lists cert-manager Certificate resources.
                target: { type: string, description: "Host or CIDR; required for network scan types, forbidden for cloud and k8s-certmanager types" }
                jit_sudo_password:
                  type: string
                  writeOnly: true
                  maxLength: 256
                  description: >-
                    One-off sudo password for this run only. Held in process memory,
                    zeroized when the job ends, never stored, logged or audited (the audit
                    detail records privilege_source=jit). ssh scans only.
                ports:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 65535 }
                  maxItems: 128
                  description: >-
                    Optional custom ports merged with the scan type's port
                    list — for a service standardized on a non-standard port.
                    Ignored when target pins an explicit host:port.
      responses:
        "201":
          description: Scan queued (the handler has always answered 201; the spec said 202)
        "400":
          description: Invalid target, a target in a denied range (link-local always; plus KRYPTKEEPER_DISCOVERY_DENY_CIDRS), or a scan whose addresses x ports exceed KRYPTKEEPER_DISCOVERY_MAX_TARGETS (default 65536)

