              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PendingAction" }
        "400":
          description: Invalid body, unknown template, or a template without a PQC algorithm
        "403":
          description: The caller may not renew certificates
        "404":
          description: Wave not found

  /reports/pqc-waves/{id}/execute/{actionId}/approve:
    post:
      operationId: approvePQCWaveExecute
      summary: Approve and run a proposed wave migration (W4-03)
      description: >-
        Requires an approver role (pki-admin or pki-operator), and the
        proposer cannot approve their own action. Runs the migration and
        returns each member's result.
      tags: [Reports]
      parameters:
