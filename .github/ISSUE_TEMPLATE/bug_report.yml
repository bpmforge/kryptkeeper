name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, please search existing issues.
        For **security vulnerabilities**, use the [private advisory form](../security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the Hub with ...
        2. Issue a certificate via ...
        3. See error ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kryptkeeper version
      placeholder: "v1.0.0 or git SHA"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Kubernetes / Helm
        - Bare metal (binary)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
