# Registers the signer type so cert-manager's admission webhook accepts
# CertificateRequests (and approval/status updates) that reference
# group certmanager.kryptkeeper.io kind ClusterIssuer.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterissuers.certmanager.kryptkeeper.io
spec:
  group: certmanager.kryptkeeper.io
  scope: Cluster
  names:
    kind: ClusterIssuer
    listKind: ClusterIssuerList
    plural: clusterissuers
    singular: clusterissuer
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
