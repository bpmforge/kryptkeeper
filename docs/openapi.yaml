    post:
      operationId: proposePQCWaveExecute
      summary: Propose migrating every member of a wave (W4-03)
      description: >-
        Creates a pending pqc_migrate_wave action that re-issues each member
        on the given template (which must allow ML-DSA or a hybrid
        algorithm). Nothing runs until a different principal approves it at
        /reports/pqc-waves/{id}/execute/{actionId}/approve.
      tags: [Reports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                template_id: { type: string }
                target_algorithm:
                  type: string
                  description: >-
                    Optional re-issue algorithm (e.g. ECDSA-P384). Must appear
                    verbatim in the template's allowed_algorithms and be a
                    supported transition target; omitted keeps the PQC-only
                    behaviour.
      responses:
        "201":
          description: Proposed; data is the pending action (its id is the actionId to approve)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PendingAction" }
        "400":
          description: Invalid body, unknown template, or no allowed algorithm usable as the wave target
        "403":
          description: The caller may not renew certificates
        "404":
          description: Wave not found

  /reports/pqc-waves/{id}/execute/{actionId}/approve:
    post:
      operationId: approvePQCWaveExecute
      summary: Approve and run a proposed wave migration (W4-03)
      description: >-
        Requires an approver role (pki-admin or pki-operator), and the
        proposer cannot approve their own action. Runs the migration and
        returns each member's result.
      tags: [Reports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: actionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Migration ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            fingerprint: { type: string }
                            status: { type: string, enum: [migrated, failed, skipped, delivery_unsupported] }
                            new_fingerprint: { type: string }
                            error: { type: string }
                            reason: { type: string }
                            delivery: { type: string, enum: [none, verified, failed, unsupported] }
                            old_serial_served: { type: boolean, description: "Present only when delivery was attempted and rolled back; true when the target still serves the previous certificate." }
                      migrated: { type: integer }
                      failed: { type: integer }
                      skipped: { type: integer }
                      unsupported: { type: integer }
                      regressed: { type: boolean }
                      wave_status: { type: string }
        "403":
          description: Not an approver role, or the proposer approving their own action
        "404":
          description: No such pending action for this wave
        "409":
          description: The action is no longer pending

  /reports/renewal-slo:
    get:
      operationId: getRenewalSLOReport
      summary: Renewal SLO report (agent-reported + scheduler dead-letter failures)
      tags: [Reports]
      responses:
        "200":
          description: >-
            Renewal SLO. failed_renewals is one list of agent-reported failures
            (type agent_result) and the scheduler's durable failure queue
            (type execute_failure with attempt, max_attempts, next_attempt_at,
            gave_up; type notification_dead_letter once the notification retry
            budget is spent). Queue entries survive a hub restart.
            The queue object (W27-33) reports the sweep backlog: depth, eta_seconds
            (eta_known=false until one job has finished), workers, and per
            connector the throttle state (connectors: in_flight, max_concurrent,
            waiting, rate_limited_total, blocked_until, daily_budget, daily_used)
            repeated compactly as connector_budgets (connector_id, in_flight,
            cap, daily_used, daily_limit, and window_used, window_limit, window_seconds
            when a rolling issuance window is set, W27-39). Upstream 429/Retry-After responses
            back a connector off exponentially (30 s doubling, capped at 1 h) and
            are audited as connector.rate_limited; a throttled renewal is
            audited as certificate.renew_execute_deferred and does not consume
            an attempt.
            slos (W30-05) is the per-SLO 30-day error budget and 1h/6h burn rates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RenewalSloReport"
        "403":
          description: Tenant-scoped principals cannot read this aggregate report

