# W19-02 fixture: TLS vhost serving whatever the hub last installed at
# /etc/ssl/kk/*. Content is irrelevant to the UAT -- only the served leaf
# certificate is checked -- so this stays a one-line identity marker.
server {
    listen 443 ssl default_server;
    server_name kk-uat-nginx.local;

    ssl_certificate     /etc/ssl/kk/server.crt;
    ssl_certificate_key /etc/ssl/kk/server.key;

    location / {
        return 200 "kk-uat-nginx\n";
        add_header Content-Type text/plain;
    }
}
