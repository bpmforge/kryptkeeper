{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kryptkeeper-certmanager-issuer.serviceAccountName" . }}
  labels:
    {{- include "kryptkeeper-certmanager-issuer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kryptkeeper-certmanager-issuer.fullname" . }}
  labels:
    {{- include "kryptkeeper-certmanager-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kryptkeeper-certmanager-issuer.fullname" . }}
  labels:
    {{- include "kryptkeeper-certmanager-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kryptkeeper-certmanager-issuer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kryptkeeper-certmanager-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
