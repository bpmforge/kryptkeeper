openapi: "3.1.0"
info:
  title: Kryptkeeper API
  version: "0.9.0"
  description: Enterprise PKI and Crypto Trust Platform REST API
  license:
    name: Apache-2.0

servers:
  - url: /api/v1
    description: Default

# Scope (W1-01/G-5): this document covers the hub's own JSON REST surface,
# served under /api/v1 (plus the root-scoped meta paths and /scim/v2/*
# below, which override `servers` per-path). It deliberately EXCLUDES the
# RFC-defined protocol servers mounted at /acme, /ocsp, /crl,
# /.well-known/est, /scep, /cmp (RFC 4210), /wstep (MS-WSTEP) and /xcep
# (MS-XCEP) — those use RFC/SOAP content-types and auth models, not this
# REST API's conventions, and don't fit an /api/v1-scoped contract
# document. /metrics (Prometheus text exposition) is excluded for the same
# reason: telemetry, not a JSON REST resource. /scim/v2/* (W6-02) is
# included despite being root-scoped and its own RFC (7644): it uses this
# API's JSON conventions (application/scim+json is JSON) and its own
# UserProvider, not a separate protocol engine, so it fits this document's
# shape even though its auth (scimBearerAuth) is deliberately separate.

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bootstrap token, JWT, OIDC, or API key (kk_<kid>_<secret>)
    scimBearerAuth:
      type: http
      scheme: bearer
      description: >-
        SCIM's own shared-secret token (APP_SCIM_TOKEN, W6-02) -- a trust
        boundary deliberately separate from bearerAuth. An ordinary operator
        session (bootstrap/JWT/OIDC/API key) is never accepted here.

  schemas:
    DualControlProposal:
      type: object
      description: >-
        Returned (202) by every private-key egress route while dual control is
        on (KRYPTKEEPER_KEY_DUAL_CONTROL, default on). No key material is
        included.
      properties:
        data:
          type: object
          required: [status, action_id]
          properties:
            status: { type: string, enum: [proposed] }
            action_id: { type: string }
            message: { type: string }
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    CertificateItem:
      type: object
      properties:
        fingerprint_sha256:
          type: string
        serial_number:
          type: string
        common_name:
          type: string
        # D-107 (2026-09-11, locked): subject_alt_names and uri_sans are
        # BOTH intentionally present, not a duplication bug. subject_alt_names
        # is the flat list of every SAN kind as strings (DNS, IP, URI,
        # email — W18-14); uri_sans is the typed subset carrying only URI
        # SANs (e.g. SPIFFE IDs), unchanged since before W18-14. No consumer
        # merges or reconciles them — see D-107 for why the flat list must
        # stay as-is (the renewal CSR rebuild in
        # internal/bootstrap/renewal_executor.go's splitSubjectAltNames
        # depends on it carrying every SAN kind).
        subject_alt_names:
          type: array
          items:
            type: string
        uri_sans:
          type: array
          items:
            type: string
        issuer_cn:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        grade:
          type: string
          enum: [A, B, C, D, F]
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        renewal_status:
          type: string
          enum: [active, renewed, revoked, expired, reissue_required]

    CAItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [root, intermediate]
        status:
          type: string
          # "expired" is derived at read time from the CA certificate's own
          # validity, not stored (S-43): a CA whose certificate has lapsed
          # keeps status=active in the database, so every /cas response
          # projects it to "expired" rather than advertising it as active.
          enum: [active, suspended, expired]

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        next_cursor:
          type: integer
          nullable: true
        prev_cursor:
          type: integer
          nullable: true

    NotificationRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        threshold_days: { type: integer }
        channel: { type: string }
        target: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificationSilence:
      type: object
      properties:
        id: { type: string }
        target_type: { type: string, enum: [certificate, ca, template] }
        target_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    UserRecord:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string, enum: [active, invited, deactivated] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }

    SCIMUser:
      type: object
      description: SCIM 2.0 core User (subset), W6-02.
      properties:
        schemas:
          type: array
          items: { type: string }
        id: { type: string }
        userName: { type: string }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string, format: email }
              primary: { type: boolean }
        active: { type: boolean }
        kryptkeeperRole:
          type: string
          description: Non-standard extension attribute; sets the account's Kryptkeeper role directly.
        meta:
          type: object
          properties:
            resourceType: { type: string }
            location: { type: string }

    SCIMGroup:
      type: object
      description: SCIM 2.0 core Group (subset), W6-02.
      properties:
        schemas:
          type: array
          items: { type: string }
        id: { type: string }
        displayName: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
        meta:
          type: object
          properties:
            resourceType: { type: string }
            location: { type: string }

    EffectiveSetting:
      type: object
      description: >-
        A registered runtime setting merged with its current source. Secret
        keys never populate value -- only configured reports whether a
        value exists (env default or DB override).
      properties:
        key: { type: string }
        category: { type: string, enum: [notifications, renewal_policy, discovery, sso] }
        env_var: { type: string }
        secret: { type: boolean }
        source: { type: string, enum: [database, env_default, unset] }
        value: { type: string }
        configured: { type: boolean }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    TemplateRecord:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        validity_period: { type: string, description: "ISO 8601 duration, e.g. P90D" }
        key_usage:
          type: array
          items: { type: string }
        extended_key_usage:
          type: array
          items: { type: string }
        allowed_algorithms:
          type: array
          items: { type: string }
          description: >-
            Vocabulary: RSA-2048|RSA-4096|ECDSA-P256|ECDSA-P384|Ed25519|
            ML-DSA-44|ML-DSA-65|ML-DSA-87|
            Hybrid-ECDSA-P256-ML-DSA-65|Hybrid-ECDSA-P384-ML-DSA-87.
            A bare family name (RSA, ECDSA, Ed25519) allows any size/curve of
            that family. Editable via PATCH /api/v1/templates/{id}.
        min_key_size: { type: integer }
        auto_enroll: { type: boolean }
        enrollee_type:
          type: string
          enum: [machine, user]
          description: >-
            Who the template is for (W20-17). XCEP offers a machine only
            machine templates and a user only user templates, and WSTEP
            refuses the other kind. Defaults to machine; set on create or
            replace (PUT), not PATCH.
        active: { type: boolean }
        require_approval:
          type: boolean
          description: Issuance requests against this template wait in the approval queue.
        approval_roles:
          type: array
          items: { type: string }
          description: Roles allowed to approve; empty means pki-admin only.
        ssh_policy:
          $ref: "#/components/schemas/SSHPolicy"
        name_policy:
          $ref: "#/components/schemas/NamePolicy"
        revision: { type: integer }

    NamePolicy:
      type: object
      description: >-
        Restricts the names certificates issued under a template may carry
        (SUP-A04-3). Enforced on the names about to be signed, on every
        issuance path that passes the template (API, renewal, bulk reissue,
        WSTEP). A template without name_policy is unrestricted. When present,
        IP and URI SANs are refused unless allowed; DNS names are restricted
        only when allowed_dns_suffixes or allowed_dns_names is non-empty. Set
        on create or replace (PUT); omitting it on PUT clears it.
      properties:
        allowed_dns_suffixes:
          type: array
          items: { type: string }
          description: >-
            ".x" matches any name below x (not x itself); "x" without a
            leading dot matches x and any subdomain. A wildcard SAN is judged
            as the shallowest name it can stand for.
        allowed_dns_names:
          type: array
          items: { type: string }
          description: Exact names (case-insensitive).
        allow_ip_sans: { type: boolean, default: false }
        allow_uri_sans: { type: boolean, default: false }
        allowed_uri_prefixes:
          type: array
          items: { type: string }
          description: >-
            Limits URI SANs to these prefixes (e.g. spiffe://prod.example/).
            Requires allow_uri_sans.
        cn_must_be_san:
          type: boolean
          default: false
          description: A non-empty subject CN must equal one of the SANs.

    SSHPolicy:
      type: object
      required: [cert_types, max_ttl_hours]
      description: >-
        Makes a template usable for SSH certificate issuance (A01S-4 /
        FR-P70). POST /ssh/certificates signs only what a template's policy
        lists; a template without ssh_policy cannot sign SSH certificates.
        Set on create or replace (PUT); omitting it on PUT clears it.
      properties:
        cert_types:
          type: array
          minItems: 1
          items: { type: string, enum: [user, host] }
        allowed_principals:
          type: array
          items: { type: string, pattern: "^[a-zA-Z0-9._-]{1,64}$" }
          description: Exact login names, no wildcards. Required when cert_types includes user.
        host_patterns:
          type: array
          items: { type: string }
          description: >-
            Lowercase DNS names, or a single leading "*." label that matches
            exactly one extra label. Required when cert_types includes host.
        max_ttl_hours:
          type: number
          exclusiveMinimum: 0
          maximum: 720
          description: Above this a request is refused, never clamped. At most 24 when cert_types includes user, 720 for host.

    DeliveryPluginVersion:
      type: object
      properties:
        plugin_id: { type: string }
        version: { type: string }
        sha256: { type: string }
        trust_tier: { type: string, enum: [first-party, verified, community] }
        capability_tier: { type: string, enum: [critical, high, standard] }
        status: { type: string, enum: [installed, pending_approval, enabled, superseded, disabled] }
        manifest: { type: object, description: "The plugin's manifest.json" }
        installed_by: { type: string }
        installed_at: { type: string }
        approved_by: { type: string }
        approved_at: { type: string }
        pending_action_id: { type: string }
        signer_key_id: { type: string, description: "sha256 of the PKIX public key that verified the signature; absent when unsigned" }

    DeliveryPlugin:
      type: object
      properties:
        id: { type: string }
        enabled_version: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/DeliveryPluginVersion" }

    SCEPChallenge:
      type: object
      properties:
        id: { type: string }
        ca_id: { type: string }
        common_name: { type: string }
        dns_names: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time, nullable: true }

    AgentInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [linux, mac, windows] }
        registered_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, stale, offline] }
        inventory_count: { type: integer }

    ManagedTarget:
      type: object
      description: >-
        A declared fleet target (W5-09, D-062, FR-P24): a host plus how it is
        discovered / installed / renewed. renewal_threshold_days (W8-15,
        FR-P33) is the per-target override for the renewal scheduler's
        env-configured RENEWAL_THRESHOLD_DAYS default -- omitted or 0 means
        "no override, use the process default."
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        discovery_mode: { type: string, enum: [agent, network, cloud, winrm, none] }
        install_mode: { type: string, enum: [agent, ssh, f5, citrix, k8s, iis, keychain, cloud, acme, plugin] }
        renewal_method: { type: string, enum: [acme, est, scep, manual] }
        plugin_id: { type: string, description: "Delivery plugin for install_mode=plugin (W20-20)" }
        plugin_settings: { type: object, additionalProperties: { type: string } }
        renewal_threshold_days:
          type: integer
          nullable: true
          description: >-
            Per-target auto-renew threshold in days, 1 to 365. 0 or omitted
            falls back to the scheduler's RENEWAL_THRESHOLD_DAYS env default.
            A hub-renewed successor is never held to more than half its own
            lifetime, so a large value cannot renew it on every tick.
        credential_ref: { type: string }
        schedule: { type: string }
        install_server_type: { type: string, enum: [nginx, apache, ""] }
        install_cert_path: { type: string }
        install_key_path: { type: string }
        install_reload_method: { type: string }
        verify_host_port: { type: string, description: "Optional host:port that scheduled renewals dial to verify the served leaf after install; default <host>:443." }
        auto_renew:
          type: boolean
          description: >-
            S-17: explicit opt-in for the hub-side renewal sweep. Requires
            credential_ref, plus for install_mode=ssh a complete install
            profile (server_type/cert_path/key_path); install_mode=keychain
            (macOS, W18-05) needs no profile. Other modes are not swept; the
            scheduler only notifies.
            Turning it on, naming a credential_ref or plugin_id, and (on an
            armed target) changing host or the install profile need
            certificate.renew; credential_ref needs pki-admin. The scheduler
            only pushes to a target whose auto_renew_set_by is set.
        auto_renew_set_by:
          type: string
          readOnly: true
          description: >-
            Principal that last configured this target's key egress while
            holding certificate.renew (RC1-A-01). Server-stamped; empty on a
            target armed before this field existed, which the scheduler then
            skips until auto_renew=true is saved again by an authorized
            principal.
        tenant: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ManagedTargetEndpointMatch:
      type: object
      description: >-
        One endpoint (scanned or agent-reported) whose observed host matches
        a managed target's declared host -- a heuristic string-equality
        join, not a foreign key.
      properties:
        source: { type: string, enum: [scanned, agent] }
        endpoint_id: { type: string }
        agent_id: { type: string }
        host: { type: string }
        port: { type: integer, nullable: true }
        server_type: { type: string }

    CryptoPostureReport:
      type: object
      properties:
        total_certs: { type: integer }
        generated_at: { type: string, format: date-time }
        pqc_readiness:
          type: object
          properties:
            quantum_safe: { type: integer }
            hybrid_quantum_safe: { type: integer }
            migration_ready: { type: integer }
            vulnerable: { type: integer }
            not_applicable: { type: integer }
            pqc_score_percent: { type: integer, description: Includes migration-ready classical certs. }
            quantum_safe_percent: { type: integer, description: Only certificates that are post-quantum today. }
        expiry_buckets:
          type: object
          properties:
            expired: { type: integer }
            expiring_47d: { type: integer }
            expiring_90d: { type: integer }
            expiring_200d: { type: integer }
            expiring_1yr: { type: integer }
            unknown: { type: integer, description: Certificates whose valid_until is empty or unparseable. }
        grade_distribution:
          type: object
          additionalProperties: { type: integer }
        automation_coverage:
          type: object
          properties:
            automated: { type: integer }
            manual: { type: integer }
            automation_percent: { type: integer }
        risk_breakdown:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"

    AlgorithmSunsetReport:
      type: object
      description: >-
        Certificates grouped by the deprecation status of their signature
        algorithm. The path had no schema until S-39, so `gen:api-types` could
        not see it and the UI hand-rolled its own type behind an `as` cast --
        which drifted. Two field names are load-bearing and easy to get wrong:
        the Go field is `SunsetSummary` but serialises as `summary`, and
        `Recommended` serialises as `recommended_replacement`.
        Source of truth: internal/bootstrap/handlers_reports.go:1236.
      properties:
        generated_at: { type: string, format: date-time }
        total_certs: { type: integer }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SunsetAlgoGroup" }
        summary: { $ref: "#/components/schemas/SunsetAlgoSummary" }

    SunsetAlgoGroup:
      type: object
      properties:
        algorithm: { type: string }
        deadline: { type: string, format: date-time, description: RFC 3339 date of ban }
        standard: { type: string }
        status: { type: string, enum: [banned, sunset_2030, sunset_2026, current] }
        urgency: { type: string, enum: [immediate, high, medium, low] }
        count: { type: integer }
        recommended_replacement: { type: string }
        fingerprints:
          type: array
          description: up to 20 examples
          items: { type: string }

    SunsetAlgoSummary:
      type: object
      properties:
        banned_now: { type: integer }
        sunset_2030: { type: integer }
        compliant: { type: integer }

    IssuanceVelocityReport:
      type: object
      description: >-
        Issuance velocity report with 7/30/90-day windows and anomaly
        detection. Anomaly detection requires a minimum sample of 5
        certificates in the last 30 days to avoid false positives on small
        deployments.
      properties:
        generated_at: { type: string, format: date-time }
        total_issued: { type: integer }
        windows:
          type: object
          properties:
            last_7d: { type: integer }
            last_30d: { type: integer }
            last_90d: { type: integer }
        daily_buckets:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        by_ca:
          type: object
          additionalProperties: { type: integer }
        by_team:
          type: object
          additionalProperties: { type: integer }
        by_template:
          type: object
          additionalProperties: { type: integer }
        anomaly_days:
          type: array
          description: Days with issuance > 2× the 30-day average (empty if sample < minimum)
          items: { type: string, format: date }
        anomaly_minimum_sample: { type: integer, description: Minimum number of certificates required in 30-day window for anomaly detection }
        anomaly_threshold_note: { type: string, description: Human-readable explanation of the anomaly threshold and whether detection is active }

    FindingFunnelSummary:
      type: object
      description: >-
        Finding funnel (W2-11, docs/design/FINDING_ECONOMICS.md). Raw is
        every finding the source layer produces on every read, with no
        dedup or identity — computeRiskFlags for crypto-posture,
        EndpointTLSConfig.Issues (internal/cipheraudit) for discovery.
        NOTE (v0.9): finding exceptions (accepted-risk suppression) cannot
        be created yet — the feature is planned for v0.10 — so suppressed
        is always 0 and effective always equals raw. The text below
        describes the intended v0.10 semantics. Effective = raw minus every
        finding currently covered by an active accepted-risk exception
        (FindingException, W2-06). Suppressed is that subtracted count, reported alongside raw and effective rather
        than hidden behind them — raw is never replaced or omitted. This is
        NOT the full five-stage funnel the design doc describes
        (raw → dedup → scope → applicability → effective →
        suppressed(justified)): persisted dedup identity, tenant scope
        filtering, and applicability re-checks are explicitly out of scope
        for W2-11 and remain future work. As of W2-12, every posture-shaped
        surface is exception-aware: GET /reports/crypto-posture, the
        executive summary, the PQC countdown, and every persisted GET
        /reports/crypto-posture/trend snapshot (captured going forward —
        snapshots persisted before W2-12 shipped keep the raw==effective
        funnel they were captured with, since suppression is computed at
        capture time, not read time).
      properties:
        raw: { type: integer }
        effective: { type: integer }
        suppressed:
          type: integer
          description: >-
            Reserved; finding exceptions are not available in v0.9 (planned
            v0.10), always 0. Effective therefore equals raw.

    ExecutiveSummary:
      type: object
      description: >-
        Matches internal/bootstrap/handlers_executive_summary.go's
        ExecutiveSummary struct — a board-readable one-pager composed from
        the crypto-posture and compliance-evidence computes. findings
        (W2-12) is the same exception-aware funnel CryptoPostureReport
        carries.
      properties:
        generated_at: { type: string, format: date-time }
        org: { type: string }
        total_certs: { type: integer }
        pqc_score_percent: { type: integer, description: Includes migration-ready classical certs. }
        quantum_safe_percent: { type: integer, description: Only certificates that are post-quantum today. }
        automation_percent: { type: integer }
        compliance_pass_percent: { type: integer }
        compliance:
          type: object
          properties:
            pass: { type: integer }
            warn: { type: integer }
            fail: { type: integer }
        expired: { type: integer }
        expiring_47d: { type: integer }
        expiry_unknown: { type: integer, description: Certificates whose valid_until is empty or unparseable. }
        risk_critical: { type: integer }
        risk_high: { type: integer }
        top_risks:
          type: array
          items: { type: string }
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"

    PQCCountdownReport:
      type: object
      description: >-
        Matches internal/bootstrap/handlers_pqc_countdown.go's
        PQCCountdownReport struct — PQC readiness against the CNSA 2.0 /
        NIST 800-131A deadlines, trending over time. findings (W2-12) is the
        same exception-aware funnel CryptoPostureReport carries.
      properties:
        generated_at: { type: string, format: date-time }
        org: { type: string }
        total_certs: { type: integer }
        vulnerable: { type: integer }
        migration_ready: { type: integer }
        quantum_safe: { type: integer }
        quantum_safe_leaf_only: { type: integer }
        pqc_score_percent: { type: integer, description: Includes migration-ready classical certs. }
        quantum_safe_percent: { type: integer, description: Only certificates that are post-quantum today. }
        status: { type: string, enum: [complete, on_track, at_risk, behind] }
        deadlines:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              date: { type: string, format: date }
              days_remaining: { type: integer }
              passed: { type: boolean }
        trend:
          type: array
          items:
            type: object
            properties:
              captured_at: { type: string, format: date-time }
              pqc_score_percent: { type: integer }
        waves:
          type: array
          items:
            $ref: "#/components/schemas/MigrationWave"
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"

    ApprovalRequest:
      type: object
      properties:
        id: { type: string }
        template_id: { type: string }
        ca_id: { type: string }
        requester: { type: string }
        team_id: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        requested_at: { type: string, format: date-time }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time, nullable: true }
        reason: { type: string }

    PendingAction:
      type: object
      properties:
        id: { type: string }
        action_type: { type: string, enum: [revoke, bulk_revoke] }
        params: { type: object }
        rationale: { type: string }
        proposed_by: { type: string }
        status: { type: string, enum: [pending, approved, rejected, failed] }
        tenant: { type: string }
        created_at: { type: string, format: date-time }

    KeyMetadata:
      type: object
      properties:
        id: { type: string }
        algorithm: { type: string }
        created_at: { type: string, format: date-time }
        rotated_at: { type: string, format: date-time, nullable: true }

    DiscoveryScanJob:
      type: object
      description: >-
        Matches internal/bootstrap/discovery_provider.go's DiscoveryScanJob
        struct. All three provider implementations (db/file/scanner) now
        emit exactly this canonical status set (G-87/S-23 normalized a
        "complete" vs "completed" inconsistency in the db-mode provider).
      properties:
        id: { type: string }
        scan_type: { type: string }
        target: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        queued_at: { type: string, format: date-time }

    OperationEvent:
      type: object
      description: >-
        Matches internal/bootstrap/event_bus.go's Event struct -- the stable
        envelope every GET /events `data:` line carries (W8-14). `status`
        reuses DiscoveryScanJob.status's vocabulary verbatim rather than a
        parallel one. `op_id` is the id the client already holds from the
        call that started the operation (e.g. DiscoveryScanJob.id from POST
        /discovery/scans) -- correlation needs no new lookup. Only `scan` has
        a producer wired today (the discovery scan create/cancel/requeue
        endpoints); renew/install/migrate are follow-up tickets and reuse
        this same envelope once wired.
      required: [op_id, kind, status, progress, message, ts]
      properties:
        op_id: { type: string }
        kind: { type: string, enum: [scan, renew, install, migrate] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        progress:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Null when the operation cannot report a percentage.
        message: { type: string }
        ts: { type: string, format: date-time }

    DiscoverySummary:
      type: object
      description: >-
        Matches internal/bootstrap/discovery_provider.go's DiscoverySummary
        struct returned by DiscoveryProvider.GetSummary, including its
        `findings` sub-object (json tag "findings", same nesting
        CryptoPostureReport uses). IMPORTANT (W2-11): raw/effective/suppressed
        are computed correctly server-side by the db-mode discovery provider
        (dbDiscoveryProvider.GetSummary), sourced from EndpointTLSConfig.Issues
        (internal/cipheraudit) per docs/design/FINDING_ECONOMICS.md — see
        FindingFunnelSummary for what those three fields mean and don't mean.
        `findings` is declared here, and deliberately left out of `required`,
        so ui/'s generated TypeScript type carries the field for W3-02 to
        build against. Both GET /discovery/summary (data.findings) and
        GET /dashboard/summary (data.discovery.findings) copy this field
        into their response body as of W2-11. File-store/scanner-backed
        discovery providers (non-"db" APP_DISCOVERY_PROVIDER modes) leave
        `findings` zero-valued — only the db-mode provider populates it.
      properties:
        discovered_endpoints: { type: integer }
        mapped_certificates: { type: integer }
        risky_endpoints: { type: integer }
        active_scan_jobs: { type: integer }
        findings:
          $ref: "#/components/schemas/FindingFunnelSummary"

    DashboardSummary:
      type: object
      description: >-
        Matches internal/bootstrap/handlers_dashboard.go's GET
        /dashboard/summary response struct. `discovery` is a narrower
        projection of DiscoverySummary (no mapped_certificates) but carries
        the same `findings` sub-object (W2-11) — see FindingFunnelSummary.
      properties:
        resource: { type: string }
        principal: { type: string }
        certificates:
          type: object
          properties:
            total: { type: integer }
            expiring_30_days: { type: integer }
            expired: { type: integer }
            source: { type: string }
        discovery:
          type: object
          properties:
            discovered_endpoints: { type: integer }
            risky_endpoints: { type: integer }
            active_scan_jobs: { type: integer }
            findings:
              $ref: "#/components/schemas/FindingFunnelSummary"
        notifications:
          type: object
          properties:
            pending_notifications: { type: integer }
            escalations: { type: integer }

    EvidenceSchedule:
      type: object
      properties:
        id: { type: string }
        framework: { type: string }
        cadence: { type: string, enum: [monthly, quarterly, annual] }
        recipients:
          type: array
          items: { type: string, format: email }

    MigrationWave:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        owner: { type: string }
        target_date: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [proposed, accepted, in_progress, done, regressed] }
        members:
          type: array
          items:
            type: object
            properties:
              fingerprint: { type: string }
        total: { type: integer }
        migrated: { type: integer }
        progress_percent: { type: integer }

    Tenant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }

    APIKeyRecord:
      type: object
      properties:
        name: { type: string }
        kid: { type: string }
        key_prefix: { type: string }
        principal_id: { type: string }
        role: { type: string }
        scopes:
          type: array
          items: { type: string }
        active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        tenant: { type: string }

paths:
  # ── Meta / infra (root-scoped, not /api/v1) ─────────────────────────────────

  /:
    servers:
      - url: /
    get:
      operationId: getRootBanner
      summary: Root banner (plain text)
      tags: [Meta]
      security: []
      responses:
        "200":
          description: Plain-text banner

  /healthz:
    servers:
      - url: /
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [Meta]
      security: []
      responses:
        "200":
          description: '{"status":"ok"}'

  /readyz:
    servers:
      - url: /
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags: [Meta]
      security: []
      responses:
        "200":
          description: '{"status":"ready"}'

  /meta:
    get:
      operationId: getServiceMeta
      summary: Service metadata
      tags: [Meta]
      security: []
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string

  # ── Certificates ──────────────────────────────────────────────────────────

  /certificates:
    get:
      operationId: listCertificates
      summary: List certificates
      tags: [Certificates]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: integer }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: ca_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked] }
        # W11-01 estate model (V5/D-106): every certificate carries
        # origin + management_state; both are filterable and returned on
        # every certificate object.
        - name: origin
          in: query
          schema: { type: string, enum: [internal, imported, discovered, synced] }
        - name: management_state
          in: query
          schema: { type: string, enum: [managed, external, unmanaged] }
      responses:
        "200":
          description: >-
            Certificate list. Each item includes `origin`
            (internal|imported|discovered|synced) and `management_state`
            (managed|external|unmanaged) — the W11-01 estate model. The
            dashboard summary carries the matching managed/external/unmanaged
            counts.
        "401":
          description: Unauthorized

    post:
      operationId: issueCertificate
      summary: Issue certificate from CSR
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ca_id, template_id, csr_pem]
              properties:
                ca_id: { type: string }
                template_id: { type: string }
                csr_pem: { type: string }
                team_id: { type: string }
      responses:
        "201":
          description: Certificate issued
        "202":
          description: Pending approval (template requires an approval gate)
        "400":
          description: Invalid CSR
        "401":
          description: Unauthorized

  /certificates/import:
    post:
      operationId: importCertificate
      summary: Import an externally-issued certificate
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                certificate_pem: { type: string }
                team_id: { type: string }
      responses:
        "201":
          description: Certificate imported
        "409":
          description: Fingerprint already exists

  /certificates/{fingerprint}:
    get:
      operationId: getCertificate
      summary: Get certificate detail
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Certificate detail
        "304":
          description: Not modified (If-None-Match matched)
        "404":
          description: Not found

  /certificates/{fingerprint}/chain:
    get:
      operationId: getCertificateChain
      summary: Get certificate's issuance chain
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Chain
        "404":
          description: Not found

  /certificates/{fingerprint}/revoke:
    post:
      operationId: revokeCertificate
      summary: Revoke certificate
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: integer }
                reason_text: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Revoked
        "409":
          description: Already revoked

  /connectors:
    get:
      operationId: listConnectors
      summary: List issuer connectors with live health (W11-03)
      tags: [Connectors]
      responses:
        "200":
          description: >-
            Connector rows, each with a live health probe (status
            healthy|degraded|unknown + detail). A type with no runtime
            implementation yet reports unknown with a reason — a visible
            state, never a dropped row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type: { type: string, enum: [internal, acme] }
                        config_json: { type: string }
                        credential_ref: { type: string }
                        tenant: { type: string }
                        health:
                          type: object
                          properties:
                            status: { type: string, enum: [healthy, degraded, unknown] }
                            detail: { type: string }
    post:
      operationId: createConnector
      summary: Create an issuer connector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [internal, acme] }
                config_json: { type: string, description: "No secrets — credentials go in credential_ref (W5-10 store)" }
                credential_ref: { type: string }
      responses:
        "201":
          description: Connector created
        "400":
          description: Invalid name or type

  /connectors/{id}:
    delete:
      operationId: deleteConnector
      summary: Delete an issuer connector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Connector not found

  /ssh/ca:
    get:
      operationId: getSSHCA
      summary: SSH CA public key (W11-07) — for sshd TrustedUserCAKeys / known_hosts @cert-authority
      tags: [SSH]
      responses:
        "200":
          description: "{authority_line, authority_fingerprint}"
        "503":
          description: No keystore configured (APP_CERTIFICATE_PROVIDER=ca required)

  /ssh/certificates:
    get:
      operationId: listSSHCertificates
      summary: List issued SSH certificates
      tags: [SSH]
      parameters:
        - name: subject_fingerprint
          in: query
          schema: { type: string, description: "SHA256:... — the sshkeys-inventory link" }
      responses:
        "200":
          description: Issued SSH certificates (newest first, 200 max)
    post:
      operationId: issueSSHCertificate
      summary: Issue a short-lived SSH certificate (W11-07)
      tags: [SSH]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, public_key, cert_type, key_id, principals]
              properties:
                template_id:
                  type: string
                  description: >-
                    Certificate template whose ssh_policy authorises this
                    request (A01S-4). Refused (400) when missing, unknown,
                    inactive or without an ssh_policy, or when cert_type, a
                    principal (user: exact match in allowed_principals; host:
                    matches a host_patterns entry) or ttl_hours falls outside
                    the policy.
                public_key: { type: string, description: "Subject key, authorized_keys format" }
                cert_type: { type: string, enum: [user, host] }
                key_id: { type: string }
                principals:
                  type: array
                  items: { type: string }
                ttl_hours:
                  type: number
                  description: >-
                    Default 8h user / 30d host, lowered to the template's
                    max_ttl_hours; above the ceiling (24h user / 30d host) or
                    the template maximum is REFUSED, never clamped.
      responses:
        "201":
          description: >-
            Signed certificate (authorized_keys line) + record. Audited as
            ssh_certificate.issue with template_id:serial:key_id. The
            record carries template_id.
        "400":
          description: Invalid request, template/policy refusal, or TTL above the ceiling or template maximum
        "503":
          description: No keystore configured

  /inventory-sources:
    get:
      operationId: listInventorySources
      summary: List direct-CA inventory sources (W11-05)
      tags: [Connectors]
      responses:
        "200":
          description: >-
            Sources with their last sync time and result. Types: adcs_export
            (a certutil/ldifde export path) and digicert (CertCentral API;
            key via credential_ref). Synced certs enter the estate as
            origin=synced / management_state=external.
    post:
      operationId: createInventorySource
      summary: Create an inventory source
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [adcs_export, adcs_live, digicert, sectigo, entrust, aws_pca, gcp_cas] }
                config_json: { type: string }
                credential_ref: { type: string }
                schedule_minutes: { type: integer, description: "0 = manual-only" }
      responses:
        "201":
          description: Source created
        "400":
          description: Invalid name or type

  /inventory-sources/{id}:
    delete:
      operationId: deleteInventorySource
      summary: Delete an inventory source
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory-sources/{id}/sync:
    post:
      operationId: syncInventorySource
      summary: Run one sync now and return the report
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Sync report {synced, skipped, revoked_marked, failed[]} —
            idempotent by fingerprint; upstream revocation propagates to
            renewal_status.
        "404":
          description: Not found

  /estate/takeover:
    post:
      operationId: estateTakeover
      summary: Take an unmanaged/external certificate under management (W11-03/W11-06)
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, renewal_path]
              properties:
                fingerprint: { type: string }
                owner_email: { type: string }
                owner_team: { type: string }
                service_name: { type: string }
                renewal_path:
                  type: object
                  required: [mode]
                  properties:
                    mode: { type: string, enum: [internal, connector] }
                    connector_id: { type: string }
      responses:
        "200":
          description: >-
            Certificate now managed: ownership set, management_state=managed,
            renewal path recorded (renewal_method + renewal_connector_id).
            Audit-logged as estate.takeover. An unknown connector_id fails
            whole before anything mutates.
        "400":
          description: Invalid renewal path or unknown connector
        "404":
          description: Certificate not found

  /renewal/execute:
    post:
      operationId: executeRenewal
      summary: Hub-side renewal execution (W5-13) — generate key/CSR, renew, install over SSH
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, target_id]
              properties:
                fingerprint: { type: string }
                target_id: { type: string }
                install:
                  type: object
                  description: >-
                    Optional override of the target's stored install profile
                    (install_server_type, install_cert_path, install_key_path,
                    install_reload_method, verify_host_port). pki-admin only:
                    any other caller gets 403 and the stored profile is used
                    when this is omitted.
                  properties:
                    server_type: { type: string, enum: [nginx, apache] }
                    cert_path: { type: string }
                    key_path: { type: string }
                    reload_method: { type: string }
                    verify_host_port: { type: string }
      responses:
        "200":
          description: >-
            Renewal executed. renewed=true with a non-verified install_outcome
            means the successor certificate exists but the install failed —
            partial state is reported, never hidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      predecessor_fingerprint: { type: string }
                      new_fingerprint: { type: string }
                      renewed: { type: boolean }
                      install_outcome: { type: string }
                      install_detail: { type: string }
                      verified: { type: boolean }
        "202":
          description: Renewal requires approval; execute again once granted
        "400":
          description: Invalid request, non-ssh target, or bad credential payload
        "403":
          description: Certificate or target not visible to the caller, or an install override sent without the pki-admin role
        "404":
          description: Certificate or target not found
        "409":
          description: Certificate already has a successor

  /certificates/{fingerprint}/renew:
    post:
      operationId: renewCertificate
      summary: Renew certificate
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [csr_pem]
              properties:
                csr_pem: { type: string }
      responses:
        "201":
          description: Renewed
        "409":
          description: Already renewed

  /certificates/{fingerprint}/ownership:
    patch:
      operationId: updateCertificateOwnership
      summary: Update a certificate's owner metadata
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_email: { type: string, format: email }
                owner_team: { type: string }
                service_name: { type: string }
      responses:
        "200":
          description: Updated

  /certificates/{fingerprint}/download:
    get:
      operationId: downloadCertificate
      summary: Download certificate (PEM/DER, optionally with chain)
      tags: [Certificates]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [pem, der] }
        - name: include_chain
          in: query
          description: >-
            PEM only. true returns a conventional fullchain: the leaf followed
            by the issuing intermediates, nearest first. The self-signed root
            is never included (relying parties already hold it), so a leaf
            issued directly by a root downloads as a single certificate. Fetch
            the root with GET /cas/{id}/chain?format=pem. DER is always one
            certificate.
          schema: { type: boolean }
      responses:
        "200":
          description: Certificate bytes

  /certificates/bulk-import:
    post:
      operationId: bulkImportCertificates
      summary: Bulk-import certificates (W11-02) — PEM bundle, base64 DER list, or CSV
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              properties:
                format:
                  type: string
                  enum: [pem, der_b64, csv]
                  description: >-
                    pem (default): concatenated PEM blocks. der_b64:
                    whitespace-separated base64 DER. csv: header
                    cert_b64[,owner_email,owner_team,service_name].
                    PKCS#7/CMS input is deliberately unsupported pending a
                    vetted CMS dependency (see spec W11-02).
                bundle: { type: string }
                team_id: { type: string }
                owner_email: { type: string }
                owner_team: { type: string }
                service_name: { type: string }
      responses:
        "200":
          description: >-
            Import report. Duplicates (by SHA-256 fingerprint against the
            whole inventory) are skipped and counted, never errors; per-item
            failures (capped at 50) do not sink the batch. Imported rows
            enter the estate as origin=imported / management_state=unmanaged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported: { type: integer }
                      skipped_duplicates: { type: integer }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            index: { type: integer }
                            reason: { type: string }
                      fingerprints:
                        type: array
                        items: { type: string }
        "400":
          description: >-
            Invalid bundle, over the 8 MiB / 1000-cert limits, or the bundle
            contains private key material (rejected whole — nothing imports).

  /certificates/bulk-revoke:
    post:
      operationId: bulkRevokeCertificates
      summary: Revoke multiple certificates
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprints:
                  type: array
                  items: { type: string }
                reason_code: { type: integer }
      responses:
        "200":
          description: Bulk revoke result (per-item outcomes)

  /certificates/bulk-reissue:
    post:
      operationId: bulkReissueCertificates
      summary: Reissue multiple certificates
      tags: [Certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprints:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Bulk reissue result (per-item outcomes)

  # ── Certificate Authorities ───────────────────────────────────────────────

  /cas:
    get:
      operationId: listCAs
      summary: List Certificate Authorities
      tags: [CAs]
      responses:
        "200":
          description: CA list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        display_name: { type: string }
                        type: { type: string, enum: [root, intermediate, issuing] }
                        status: { type: string }
                        key_storage_type: { type: string }
                        parent_ca_id: { type: string, nullable: true }
                        certificate_fingerprint_sha256: { type: string }
                        # S-72: count of certificates with renewal_status
                        # 'active' issued by this CA; 0 when the inventory
                        # is unavailable.
                        active_issued_certificates: { type: integer }
    post:
      operationId: createCA
      summary: Create a Certificate Authority
      tags: [CAs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_cn]
              properties:
