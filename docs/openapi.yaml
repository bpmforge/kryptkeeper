                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            fingerprint: { type: string }
                            status: { type: string, enum: [migrated, failed] }
                            new_fingerprint: { type: string }
                            error: { type: string }
                      migrated: { type: integer }
                      failed: { type: integer }
        "403":
          description: Not an approver role, or the proposer approving their own action
        "404":
          description: No such pending action for this wave
        "409":
          description: The action is no longer pending

